name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt pytest pytest-cov
      - name: Compile Python
        run: python -m compileall -q main.py data.py routes services pdf_generator.py
      - name: Import smoke (startup timing + manual data load)
        run: python -c "import routes.characters.all"
      - name: Run tests with coverage gate
        run: pytest -q --disable-warnings --maxfail=1 --cov=main --cov=data --cov=routes --cov=services --cov=pdf_generator --cov-report=term --cov-config=.coveragerc
