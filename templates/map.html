{% extends "layout.html" %}
{% block title %}{{ the_map.name }} — Map{% endblock %}
{% block container_class %}container-wide{% endblock %}
{% block content %}
<style>
.vtt-wrap{display:flex;flex-direction:column;height:calc(100vh - 7.5rem);gap:.4rem}
.vtt-toolbar{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap;font-size:.85rem;
  max-height:5.2rem;overflow-y:auto}   /* on a narrow window the toolbar scrolls instead of eating the map */
.vtt-sep{width:1px;height:1.3rem;background:var(--border);margin:0 .2rem}
.vtt-source{font-size:.7rem;color:var(--text-muted);text-decoration:none;border:1px solid var(--border);
  border-radius:4px;padding:.05rem .35rem;white-space:nowrap}
.vtt-source:hover{color:var(--accent);border-color:var(--accent)}
.vtt-body{flex:1;display:flex;gap:.5rem;min-height:0}
.vtt-canvas-host{position:relative;flex:1;min-width:0;border:1px solid var(--border);border-radius:8px;overflow:hidden;background:#0f0f12}
.vtt-canvas-host canvas{display:block;cursor:grab}
.vtt-hint{position:absolute;left:.5rem;bottom:.4rem;font-size:.68rem;color:#94a3b8;pointer-events:none}
.vtt-side{width:16rem;flex-shrink:0;overflow-y:auto;display:flex;flex-direction:column;gap:.6rem;
  border:1px solid var(--border);border-radius:8px;padding:.5rem}
.vtt-row{display:flex;align-items:center;gap:.25rem;margin:.2rem 0}
.vtt-row input{padding:.2rem .4rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.8rem;flex:1;min-width:0}
.vtt-dirty{color:var(--accent)}
@media(max-width:900px){.vtt-body{flex-direction:column}.vtt-side{width:auto;max-height:14rem}}
</style>
<div class="vtt-wrap">
{% include "_map_toolbar.html" %}

  <div class="vtt-body">
    <div class="vtt-canvas-host" id="vttHost">
      <canvas id="vttCanvas"></canvas>
      <div class="vtt-hint" id="vttHint">Drag to pan · wheel to zoom · drag a token to move it</div>
    </div>
    <aside class="vtt-side">
      <div id="vttPalette"></div>
      <div id="vttSelected"></div>
      <div id="vttScenes"></div>
    </aside>
  </div>
</div>

<script>window.MAP_ID = {{ the_map.id }}; window.MAP_DATA = {{ map_json|safe }};</script>
<script src="/static/vtt.js?v={{ static_asset_version('vtt.js') }}"></script>
{% endblock %}
