{% extends "layout.html" %}
{% block title %}Change Password{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto">
  <h2 style="margin-bottom:1rem">Change Password</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}
  <form method="post" action="/change-password">
    <div class="form-group"><label>Current Password</label><input type="password" name="current_password" autocomplete="current-password" required></div>
    <div class="form-group"><label>New Password</label><input type="password" name="password" autocomplete="new-password" minlength="6" required></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Change Password</button>
  </form>
</div>
{% endblock %}
