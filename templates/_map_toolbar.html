{# The map toolbar. Split out of map.html so each file stays small enough to read at a
   glance; tests/test_map_canvas.py counts the two together so the split is not a way to
   dodge the "markup only, no logic" guard. #}
<div class="vtt-toolbar">
    <a class="btn btn-outline btn-sm" href="/dm-tools">← DM Tools</a>
    <strong style="margin-left:.3rem">{{ the_map.name }}</strong>
    <span class="vtt-sep"></span>

    <button class="btn btn-outline btn-sm" onclick="VTT.toggleGrid()" id="vttGridBtn" title="Show or hide the grid (G)">▦ Grid</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setGridType('square')" id="vttSquareBtn" title="Square grid">⬚ Square</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setGridType('hex')" id="vttHexBtn" title="Hex grid (Atlas-style)">⬡ Hex</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeSize(-4)" title="Smaller cells">−</button>
    <input type="number" id="vttGridSize" value="{{ the_map.grid_size }}" min="10" max="400" step="1"
           onchange="VTT.setGridSize(this.value)" title="Pixels per cell — the size of one 5-ft square on the image"
           style="width:3.4rem;padding:.1rem .2rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.75rem;text-align:center">
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeSize(4)" title="Bigger cells">+</button>
    <label style="font-size:.72rem;color:var(--text-muted)" title="Count the squares across the map image — the grid is sized to match, so 5-ft squares line up with the art">cells across
      <input type="number" id="vttGridSquares" min="1" max="400" step="1" onchange="VTT.setSquaresAcross(this.value)"
             style="width:3.4rem;padding:.1rem .2rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.72rem"></label>
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeGrid(-1,0)" title="Move the grid 1px left — align it to the map art">◀</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeGrid(1,0)" title="Move the grid 1px right">▶</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeGrid(0,-1)" title="Move the grid 1px up">▲</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.nudgeGrid(0,1)" title="Move the grid 1px down">▼</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.fitGridToImage()" title="Zero the offset and make the grid divide the image exactly">🧩 Fit</button>
    <span id="vttGridInfo" style="font-size:.7rem;color:var(--text-muted)"></span>
    <button class="btn btn-outline btn-sm" onclick="VTT.toggleSnap()" id="vttSnapBtn" title="Snap tokens to the grid (S)">🧲 Snap: on</button>

    <span class="vtt-sep"></span>
    <button class="btn btn-outline btn-sm" onclick="VTT.zoomBy(1.2)">🔍+</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.zoomBy(1/1.2)">🔍−</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.fit()" title="Fit the map to the window (0)">⤢ Fit</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.chooseImage()" title="Upload a background image">🖼 Image</button>

    <span class="vtt-sep"></span>
    <button class="btn btn-outline btn-sm" onclick="VTT.setTool('select')" id="vttToolSelect" title="Select and move tokens (V)">🖱 Select</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setTool('fog')" id="vttToolFog" title="Paint revealed cells (F); right-drag pans">🕯 Fog</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.toggleFog()" id="vttFogOn" title="Show or hide the fog layer">☁ Fog: off</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setFogBrush('cell')" id="vttBrushCell" title="Reveal cell by cell">⬛ Cell</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setFogBrush('rect')" id="vttBrushRect" title="Drag a rectangle to reveal everything it covers">▭ Rect</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setFogBrush('circle')" id="vttBrushCircle" title="Drag a circle — for templates and rooms with round walls">⭕ Circle</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.revealAll()" title="Reveal the whole map">👁 All</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.hideAll()" title="Hide the whole map again">🚫 All</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setTool('draw')" id="vttToolDraw" title="Draw on the map (D); right-drag pans">✏️ Draw</button>
    <input type="color" id="vttPenColor" value="#ff5555" onchange="VTT.setPen(this.value, null)" title="Pen colour" style="width:2rem;height:1.6rem;padding:0;border:1px solid var(--border);background:none;border-radius:4px">
    <input type="number" id="vttPenWidth" value="4" min="1" max="40" onchange="VTT.setPen(null, this.value)" title="Pen width" style="width:3.2rem;padding:.1rem .2rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.75rem">
    <button class="btn btn-outline btn-sm" onclick="VTT.clearDraw()" title="Erase all drawing">🧽 Clear</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.setTool('measure')" id="vttToolMeasure" title="Measure a distance (M)">📏 Measure</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.clearMeasure()" title="Clear the ruler">✖ Ruler</button>
    <label style="font-size:.72rem;color:var(--text-muted);display:inline-flex;align-items:center;gap:.2rem"
           title="How many feet one grid cell represents — 5 for the standard 5-ft square"><input type="number" id="vttFeet" value="5" min="1" max="100"
           onchange="VTT.setFeetPerCell(this.value)" style="width:2.8rem;padding:.1rem .2rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.72rem">ft/cell</label>
    <span class="vtt-sep"></span>
    <button class="btn btn-outline btn-sm" onclick="VTT.openPlayer()" title="Open the player view on a second screen (TV/tablet)">📺 Player</button>
    <button class="btn btn-outline btn-sm" onclick="VTT.revokePlayer()" title="Revoke the player link">🚫</button>
    <span id="vttPlayerHint" style="font-size:.68rem;color:var(--text-muted);max-width:16rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>

    <span class="vtt-sep"></span>
    <select id="vttEncounterPick" style="padding:.25rem .4rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:.8rem"></select>
    <button class="btn btn-outline btn-sm" onclick="VTT.spawnEncounter()" title="Place that encounter's combatants on this map">⚔ Spawn</button>

    <span class="vtt-sep"></span>
    <input id="vttSearch" placeholder="Add creature, NPC or character…" style="width:15rem"
           oninput="VTT.searchPalette(this.value)">
    <input type="file" id="vttImageInput" accept="image/*" style="display:none"
           onchange="VTT.uploadImage(this)">
    <span id="vttSaved" style="font-size:.7rem;color:var(--text-muted)"></span>
</div>
