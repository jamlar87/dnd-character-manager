<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}D&D Character Manager{% endblock %}</title>
<style>
  :root {
    --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-muted: #888;
    --accent: #e94560; --accent2: #0f3460; --border: #2a2a4a;
    --success: #00c853; --danger: #ff1744; --warn: #ff9100;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; }
  a { color: var(--accent); text-decoration: none; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: var(--card-bg); border-bottom: 1px solid var(--border); }
  .nav-brand { font-size: 1.2rem; font-weight: 700; color: var(--accent); }
  .nav-links { display: flex; gap: 1rem; align-items: center; }
  .nav-links a, .nav-links button { background: none; border: none; color: var(--text); cursor: pointer; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; }
  .nav-links a:hover, .nav-links button:hover { background: var(--accent2); }
  .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
  .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
  .form-group input, .form-group select { width: 100%; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.95rem; }
  .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .alert-error { background: rgba(255,23,68,0.15); border: 1px solid var(--danger); color: var(--danger); }
  .alert-success { background: rgba(0,200,83,0.15); border: 1px solid var(--success); color: var(--success); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .stat-box { text-align: center; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; }
  .stat-num { font-size: 1.5rem; font-weight: 700; }
  .stat-mod { font-size: 0.85rem; color: var(--text-muted); }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-accent { background: var(--accent); color: #fff; }
  .badge-muted { background: var(--accent2); color: var(--text); }
  .hp-bar { height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; }
  .hp-bar-fill { height: 100%; background: var(--success); transition: width 0.3s; }
  .hp-bar-fill.danger { background: var(--danger); }
  .hp-bar-fill.warn { background: var(--warn); }
  footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem; }
  @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  {% block style %}{% endblock %}
</style>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand">⚔️ D&D Character Manager</a>
  <div class="nav-links">
    {% if user %}
    <a href="/dashboard">My Characters</a>
    <a href="/dm-tools">DM Tools</a>
    <a href="/create">+ New</a>
    <span style="color:var(--text-muted);font-size:0.85rem">{{ user.email }}</span>
    <a href="/logout" class="btn btn-outline btn-sm">Logout</a>
    {% else %}
    <a href="/login">Login</a>
    <a href="/register" class="btn btn-primary btn-sm">Register</a>
    {% endif %}
  </div>
</nav>

<div class="container">
{% block content %}{% endblock %}
</div>

<footer>&copy; 2026 D&D Character Manager. Not affiliated with Wizards of the Coast.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
