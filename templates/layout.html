<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}D&D Character Manager{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚔️</text></svg>">
<style>
  :root {
    --bg: #1a1a2e; --card-bg: #16213e; --text: #e0e0e0; --text-muted: #888;
    --accent: #e94560; --accent2: #0f3460; --border: #2a2a4a;
    --success: #00c853; --danger: #ff1744; --warn: #ff9100;
    --font: 'Segoe UI', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  img, table, video, canvas, svg { max-width: 100%; height: auto; }
  body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; overflow-wrap: break-word; word-break: break-word; }
  a { color: var(--accent); text-decoration: none; }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1.5rem; background: var(--card-bg); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 1000; }
  .nav-brand { font-size: 1.2rem; font-weight: 700; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 70vw; }
  .nav-links { display: flex; gap: 1rem; align-items: center; }
  .nav-links a, .nav-links button { background: none; border: none; color: var(--text); cursor: pointer; font-size: 0.9rem; padding: 0.4rem 0.8rem; border-radius: 4px; white-space: nowrap; touch-action: manipulation; }
  .nav-links a:hover, .nav-links button:hover { background: var(--accent2); }
  .nav-search { display: flex; align-items: center; gap: 0.3rem; flex: 1; max-width: 480px; margin: 0 1rem; position: relative; }
  .nav-search input { flex: 1; min-width: 120px; padding: 0.35rem 0.5rem; font-size: 0.8rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 4px; }
  .nav-search input::placeholder { color: var(--text-muted); font-size: 0.75rem; }
  .nav-search .btn-sm { padding: 0.25rem 0.5rem; font-size: 0.75rem; touch-action: manipulation; position: relative; z-index: 5; }
  .search-results-dropdown { display: none; position: fixed; top: 56px; left: 50%; transform: translateX(-50%); width: min(92vw, 560px); z-index: 9999; max-height: 65vh; overflow-y: auto; background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 8px 32px rgba(0,0,0,0.5); }
  @media (max-width: 768px) {
    .nav-search { max-width: none; margin: 0 0.5rem; flex: 2; }
    .nav-search input { font-size: 0.75rem; padding: 0.3rem 0.4rem; }
    .nav-search .btn-sm { padding: 0.4rem 0.55rem; font-size: 0.8rem; min-width: 36px; min-height: 36px; }
  }
  .hamburger { display: none; background: none; border: 1px solid var(--border); color: var(--text); font-size: 1.3rem; cursor: pointer; padding: 0.35rem 0.6rem; border-radius: 4px; line-height: 1; }
  .container { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
  @media (max-width: 768px) {
    .hamburger { display: block; }
    .nav-links { display: none; position: absolute; top: 100%; left: 0; right: 0; background: var(--card-bg); flex-direction: column; gap: 0; padding: 0.5rem 0; border-bottom: 2px solid var(--border); z-index: 100; box-shadow: 0 8px 24px rgba(0,0,0,0.4); }
    .nav-links.open { display: flex; }
    .nav-links a, .nav-links button { display: block; padding: 0.7rem 1.5rem; border-radius: 0; width: 100%; text-align: left; font-size: 0.95rem; }
    .nav-links span { display: block; padding: 0.5rem 1.5rem; }
    .container { padding: 0 0.75rem; margin: 1rem auto; }
  }
  .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; }
  .btn { display: inline-block; padding: 0.5rem 1.2rem; border-radius: 6px; font-weight: 600; cursor: pointer; border: none; font-size: 0.95rem; }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.15); }
  .btn-outline { background: none; border: 1px solid var(--border); color: var(--text); }
  .btn-danger { background: var(--danger); color: #fff; }
  .btn-sm { padding: 0.3rem 0.7rem; font-size: 0.8rem; }
  .form-group { margin-bottom: 1rem; }
  .form-group label { display: block; margin-bottom: 0.3rem; font-weight: 600; font-size: 0.9rem; }
  .form-group input, .form-group select { width: 100%; padding: 0.5rem; background: var(--bg); border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 0.95rem; }
  .alert { padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
  .alert-error { background: rgba(255,23,68,0.15); border: 1px solid var(--danger); color: var(--danger); }
  .alert-success { background: rgba(0,200,83,0.15); border: 1px solid var(--success); color: var(--success); }
  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
  .grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0.75rem; }
  .stat-box { text-align: center; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem; }
  .stat-num { font-size: 1.5rem; font-weight: 700; }
  .stat-mod { font-size: 0.85rem; color: var(--text-muted); }
  .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-accent { background: var(--accent); color: #fff; }
  .badge-muted { background: var(--accent2); color: var(--text); }
  .hp-bar { height: 12px; border-radius: 6px; background: var(--border); overflow: hidden; }
  .hp-bar-fill { height: 100%; background: var(--success); transition: width 0.3s; }
  .hp-bar-fill.danger { background: var(--danger); }
  .hp-bar-fill.warn { background: var(--warn); }
  footer { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.8rem; }
  @media (max-width: 600px) { .grid-2, .grid-3 { grid-template-columns: 1fr; } }
  @media (max-width: 480px) {
    html { font-size: 14px; }
    .container { padding: 0 0.5rem; margin: 0.75rem auto; }
    .card { padding: 1rem; }
    h1 { font-size: 1.4rem !important; }
    h2 { font-size: 1.2rem !important; }
    h3 { font-size: 1.05rem !important; }
    .nav { padding: 0.5rem 0.75rem; }
    footer { padding: 1rem; font-size: 0.7rem; }
  }
  {% block style %}{% endblock %}
  .ai-pdf-btn:hover { filter: brightness(1.2); }
</style>
<script>
// ── Manual search (available on every page) ──
// Defined in <head> so available immediately — before heavy page scripts
let _lastAiSummaryData = null;
async function searchManuals(summarize = false) {
  const input = document.getElementById('manualSearchInput');
  const resultsDiv = document.getElementById('manualSearchResults');
  if (!input || !resultsDiv) { console.warn('search: missing input or resultsDiv'); return; }
  const query = input.value.trim();
  if (query.length < 2) {
    input.style.outline = '2px solid var(--warn)';
    setTimeout(() => input.style.outline = '', 1500);
    resultsDiv.style.display = 'none';
    return;
  }

  resultsDiv.style.display = 'block';
  resultsDiv.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-muted)">🔍 Searching manuals...</div>';

  const endpoint = summarize ? '/api/dm/search-manuals/summarize' : '/api/dm/search-manuals';

  try {
    const r = await fetch(endpoint, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({query})
    });
    const ct = r.headers.get('content-type') || '';
    if (!ct.includes('application/json')) {
      resultsDiv.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--warn)">⚠️ Please log in to search the manuals.</div>';
      return;
    }
    const data = await r.json();

    if (summarize && data.summary) {
      // Store for PDF button
      _lastAiSummaryData = {query, summary: data.summary, sources: data.results};
      let html = '<div style="padding:0.75rem;font-size:0.8rem;line-height:1.6;color:var(--text)">';
      html += '<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">';
      html += '<span style="font-size:0.7rem;color:var(--text-muted)">🤖 AI Summary · ' + data.results.length + ' sources across manuals</span>';
      html += '<button onclick="downloadAiSummaryPdf(_lastAiSummaryData)" style="margin-left:auto;padding:0.2rem 0.5rem;font-size:0.7rem;background:var(--accent2);color:var(--accent);border:1px solid var(--accent);border-radius:4px;cursor:pointer;white-space:nowrap" title="Download AI Summary as PDF" class="ai-pdf-btn">📄 PDF</button>';
      html += '</div>';
      html += '<div style="white-space:pre-wrap">' + escapeHtml(data.summary) + '</div>';
      html += '<hr style="border-color:var(--border);margin:0.5rem 0">';
      html += '<div style="font-size:0.7rem;color:var(--text-muted)">Sources:</div>';
      for (const r of data.results) {
        if (r.page) {
          const pdfUrl = '/api/reference/open/' + encodeURIComponent(r.book) + '#page=' + r.page;
          html += '<div style="font-size:0.75rem;padding:0.25rem 0.4rem;border-bottom:1px solid var(--border);cursor:pointer" onclick="window.open(\'' + pdfUrl + '\',\'_blank\')" onmouseover="this.style.background=\'var(--accent2)\'" onmouseout="this.style.background=\'\'">📖 <strong>' + r.book + '</strong> p.' + r.page + ' — ' + escapeHtml(r.snippet).substring(0,150) + '...</div>';
        } else {
          html += '<div style="font-size:0.75rem;padding:0.25rem 0.4rem;border-bottom:1px solid var(--border)">📄 <strong>' + r.book + '</strong> — ' + escapeHtml(r.snippet).substring(0,150) + '...</div>';
        }
      }
      html += '</div>';
      resultsDiv.innerHTML = html;
    } else if (data.results && data.results.length) {
      let html = '<div style="padding:0.5rem;font-size:0.8rem">';
      html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:0.5rem">' + data.total + ' matches across manuals for "' + escapeHtml(query) + '"</div>';
      for (const r of data.results) {
        if (r.page) {
          const pdfUrl = '/api/reference/open/' + encodeURIComponent(r.book) + '#page=' + r.page;
          html += '<div style="padding:0.4rem 0.5rem;border-bottom:1px solid var(--border);cursor:pointer" onclick="window.open(\'' + pdfUrl + '\',\'_blank\')" onmouseover="this.style.background=\'var(--accent2)\'" onmouseout="this.style.background=\'\'">';
          html += '<div style="font-size:0.7rem;color:var(--accent);margin-bottom:0.15rem">📖 <strong>' + r.book + '</strong> p.' + r.page + ' ↗</div>';
          html += '<div style="font-size:0.75rem;color:var(--text);line-height:1.4">' + highlightMatch(escapeHtml(r.snippet), query) + '</div>';
          html += '</div>';
        } else {
          html += '<div style="padding:0.4rem 0.5rem;border-bottom:1px solid var(--border)">';
          html += '<div style="font-size:0.7rem;color:var(--text-muted);margin-bottom:0.15rem">📄 <strong>' + r.book + '</strong></div>';
          html += '<div style="font-size:0.75rem;color:var(--text);line-height:1.4">' + highlightMatch(escapeHtml(r.snippet), query) + '</div>';
          html += '</div>';
        }
      }
      html += '</div>';
      resultsDiv.innerHTML = html;
    } else {
      resultsDiv.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-muted)">🔍 No matches found for "' + escapeHtml(query) + '" in any manual.</div>';
    }
  } catch(e) {
    resultsDiv.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--danger)">Search failed: ' + e.message + '</div>';
  }
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function downloadAiSummaryPdf(data) {
  try {
    const r = await fetch('/api/ai/summary/pdf', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify(data)
    });
    if (!r.ok) { alert('PDF generation failed'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    window.open(url, '_blank');
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch(e) {
    alert('PDF error: ' + e.message);
  }
}

function highlightMatch(text, query) {
  const words = query.split(/\s+/).filter(w => w.length > 1);
  let result = text;
  for (const w of words) {
    const re = new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
    result = result.replace(re, '<mark style="background:rgba(255,200,0,0.3);color:var(--text);padding:0 1px;border-radius:2px">$1</mark>');
  }
  return result;
}

// Close search results when clicking outside
document.addEventListener('click', function(e) {
  const resultsDiv = document.getElementById('manualSearchResults');
  const input = document.getElementById('manualSearchInput');
  if (resultsDiv && !resultsDiv.contains(e.target) && e.target !== input
      && !e.target.closest('.nav-search')) {
    resultsDiv.style.display = 'none';
  }
});

// Hamburger menu close
document.addEventListener('click', function(e) {
  var nav = document.querySelector('.nav-links');
  var btn = document.querySelector('.hamburger');
  if (nav && nav.classList.contains('open') && !nav.contains(e.target) && !btn.contains(e.target)) {
    nav.classList.remove('open');
    btn.textContent = '☰';
  }
});
</script>
</head>
<body>
<nav class="nav">
  <a href="/" class="nav-brand">⚔️ D&D Character Manager</a>
  <div class="nav-search" id="navSearchBar">
    <input type="text" id="manualSearchInput" placeholder="🔍 Search the Manuals..."
           onkeydown="if(event.key==='Enter'){window.searchManuals();return false}">
    <button type="button" class="btn btn-primary btn-sm" onclick="this.style.background='var(--success)';setTimeout(()=>this.style.background='',300);window.searchManuals();return false" title="Search" style="touch-action:manipulation">🔍</button>
    <button type="button" class="btn btn-outline btn-sm" onclick="this.style.background='var(--success)';setTimeout(()=>this.style.background='',300);window.searchManuals(true);return false" title="AI Summarize" style="touch-action:manipulation">🤖</button>
    <div id="manualSearchResults" class="search-results-dropdown"></div>
  </div>
  <button class="hamburger" onclick="document.querySelector('.nav-links').classList.toggle('open');this.textContent=this.textContent==='☰'?'✕':'☰'" aria-label="Menu">☰</button>
  <div class="nav-links">
    {% if user %}
    <a href="/dashboard">My Characters</a>
    <a href="/dm-tools">DM Tools</a>
    <a href="/create">+ New</a>
    <span style="color:var(--text-muted);font-size:0.85rem">{{ user.email }}</span>
    <a href="/logout" class="btn btn-outline btn-sm">Logout</a>
    {% else %}
    <a href="/login">Login</a>
    <a href="/register" class="btn btn-primary btn-sm">Register</a>
    {% endif %}
  </div>
</nav>

<div class="container">
{% block content %}{% endblock %}
</div>

<footer>&copy; 2026 D&D Character Manager. Not affiliated with Wizards of the Coast.</footer>
{% block scripts %}{% endblock %}
</body>
</html>
