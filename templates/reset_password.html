{% extends "layout.html" %}
{% block title %}Reset Password{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto">
  <h2 style="margin-bottom:1rem">Reset Password</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  {% if success %}<div class="alert" style="background:var(--success);color:#fff;padding:0.5rem 0.75rem;border-radius:6px;margin-bottom:0.75rem">{{ success }}</div>{% endif %}
  <form method="post">
    <div class="form-group"><label>Email</label><input type="text" name="email" autocomplete="username" value="{{ email or 'admin' }}" required></div>
    <div class="form-group"><label>New Password</label><input type="password" name="password" minlength="6" required></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Reset Password</button>
  </form>
  <p style="margin-top:1rem;text-align:center;color:var(--text-muted)"><a href="/login">← Back to login</a></p>
</div>
{% endblock %}
