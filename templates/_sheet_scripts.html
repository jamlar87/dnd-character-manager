// ── Limited-Use Features (Channel Divinity, Rage, etc.) — toggle dots ──
async function toggleFeatureUse(idx, dotIdx) {
  const feat = featureData[idx];
  if (!feat || !feat.uses_max) return;
  // dotIdx < feat.uses means the dot is currently filled (used) → click restores
  // dotIdx >= feat.uses means the dot is empty → click expends
  if (dotIdx < feat.uses) {
    // Restore this use: decrease uses
    feat.uses--;
  } else {
    // Expend this use: increase uses
    feat.uses++;
  }
  renderFeatureDots(idx);
  // Sync actions tab button
  if (feat.action_type) syncActionButton(feat.name, feat.uses, feat.uses_max);
  await api('/update', { feature_data: JSON.stringify(featureData) });
}

function renderFeatureDots(idx) {
  const feat = featureData[idx];
  if (!feat) return;
  const box = document.getElementById(`feat-uses-box-${idx}`);
  if (box) {
    box.querySelectorAll('.feat-use-dot').forEach((dot, i) => {
      dot.classList.toggle('filled', i < feat.uses);
      dot.title = i < feat.uses ? 'Available — click to expend' : 'Used — click to restore';
    });
  }
  // Update pool HP display
  const hpEl = document.getElementById(`feat-pool-hp-${idx}`);
  if (hpEl) hpEl.textContent = feat.uses;
  // Update text counter
  const text = document.getElementById(`feat-uses-text-${idx}`);
  if (text) {
    if (feat.pool_kind) {
      const label = feat.pool_kind === 'hp' ? 'HP' : feat.pool_kind === 'points' ? 'pts' : 'dice';
      text.textContent = `max ${feat.uses_max} ${label}`;
    } else {
      text.textContent = `${feat.uses}/${feat.uses_max}`;
    }
  }
  // Toggle depleted state on the feature card
  const card = document.querySelector(`.feat-card[data-feat-index="${idx}"]`);
  if (card) card.classList.toggle('depleted', feat.uses === 0 && feat.uses_max > 0);
}

// ── Pool features (Lay on Hands, Ki, Sorcery Points, Superiority Dice, etc.) ──
async function spendPool(idx) {
  const feat = featureData[idx];
  if (!feat || !feat.pool_kind) return;
  const input = document.getElementById(`feat-pool-spend-${idx}`);
  const amount = parseInt(input.value) || 0;
  if (amount <= 0) return;
  if (amount > feat.uses) { input.value = feat.uses; return; }
  feat.uses -= amount;
  input.max = feat.uses;
  if (parseInt(input.value) > feat.uses) input.value = feat.uses || 1;
  renderFeatureDots(idx);
  if (feat.action_type) syncActionButton(feat.name, feat.uses, feat.uses_max);
  await api('/update', { feature_data: JSON.stringify(featureData) });
}

async function restorePool(idx) {
  const feat = featureData[idx];
  if (!feat || !feat.pool_kind) return;
  feat.uses = feat.uses_max;
  const input = document.getElementById(`feat-pool-spend-${idx}`);
  if (input) input.max = feat.uses;
  renderFeatureDots(idx);
  if (feat.action_type) syncActionButton(feat.name, feat.uses, feat.uses_max);
  await api('/update', { feature_data: JSON.stringify(featureData) });
}

function resetAllFeatureUses() {
  featureData.forEach((feat, i) => {
    if (feat.uses_max) {
      feat.uses = feat.uses_max;
      renderFeatureDots(i);
    }
  });
  // Sync actions tab buttons
  featureData.forEach(f => { if (f.action_type) syncActionButton(f.name, f.uses, f.uses_max); });
}

// ── Sync Actions tab button when Features tab toggles uses ──
function syncActionButton(name, uses, usesMax) {
  const btn = document.querySelector(`.feat-action-btn[data-feat-name="${name}"]`);
  if (!btn) return;
  const poolKind = btn.dataset.poolKind;
  if (poolKind) {
    // Pool feature: update value display and input max
    const poolVal = btn.querySelector('.feat-pool-val');
    if (poolVal) poolVal.textContent = uses;
    const poolMax = btn.querySelector('.feat-pool-max');
    const label = poolKind === 'hp' ? 'HP' : poolKind === 'points' ? 'pts' : 'dice';
    if (poolMax) poolMax.textContent = `max ${usesMax} ${label}`;
    const spendInput = btn.querySelector('input[type="number"]');
    if (spendInput) {
      spendInput.max = uses;
      if (parseInt(spendInput.value) > uses) spendInput.value = uses || 1;
    }
    // Depleted when pool is empty
    if (uses === 0 && usesMax > 0) {
      btn.classList.add('depleted');
      btn.style.opacity = '0.45';
    } else {
      btn.classList.remove('depleted');
      btn.style.opacity = '';
    }
    return;
  }
  // Update dots
  const dots = btn.querySelectorAll('.use-dot');
  dots.forEach((dot, i) => dot.classList.toggle('active', i < uses));
  // Update count text
  const countSpan = btn.querySelector('.feat-uses-dots span:last-child');
  if (countSpan) countSpan.textContent = `${uses}/${usesMax}`;
  // Toggle depleted state
  if (uses === 0 && usesMax > 0) {
    btn.classList.add('depleted');
    btn.style.opacity = '0.45';
    btn.style.cursor = 'default';
    btn.onclick = null;
  } else {
    btn.classList.remove('depleted');
    btn.style.opacity = '';
    btn.style.cursor = 'pointer';
    btn.onclick = function() { useFeature(name, btn); };
  }
}

// ── Pool features in Actions tab (spend/restore by name) ──
async function spendPoolAction(name, inputEl) {
  const feat = featureData.find(f => f.name === name);
  if (!feat || !feat.pool_kind) return;

async function restorePoolAction(name) {

// ── Inventory Management ──
const WEAPON_KEYWORDS = [
  'sword', 'axe', 'hammer', 'bow', 'dagger', 'mace', 'spear', 'flail',
  'rapier', 'scimitar', 'glaive', 'halberd', 'pike', 'lance', 'whip',
  'club', 'staff', 'quarterstaff', 'crossbow', 'sling', 'dart', 'javelin',
  'trident', 'war pick', 'morningstar', 'greatsword', 'longsword', 'shortsword',
  'battleaxe', 'greataxe', 'warhammer', 'maul', 'handaxe', 'light hammer',
  'sickle', 'blowgun', 'net', 'firearm', 'pistol', 'musket', 'rifle',
  'arrow', 'bolt', 'blade', 'knife', 'katana', 'nunchaku', 'shuriken',
];

function isWeapon(name) {
  const lower = name.toLowerCase().trim();
  if (NAMED_ITEM_TYPES[lower] === 'wpn') return true;
  return WEAPON_KEYWORDS.some(kw => lower.includes(kw));
}

// Weapon info lookup — returns {category: 'Simple'|'Martial'} or null
const _WEAPON_CATEGORIES = {
  // Simple Melee
  'club':'Simple','dagger':'Simple','greatclub':'Simple','handaxe':'Simple',
  'javelin':'Simple','light hammer':'Simple','mace':'Simple','quarterstaff':'Simple',
  'sickle':'Simple','spear':'Simple',
  // Simple Ranged
  'light crossbow':'Simple','dart':'Simple','shortbow':'Simple','sling':'Simple',
  // Martial Melee
  'battleaxe':'Martial','flail':'Martial','glaive':'Martial','greataxe':'Martial',
  'greatsword':'Martial','halberd':'Martial','lance':'Martial','longsword':'Martial',
  'maul':'Martial','morningstar':'Martial','pike':'Martial','rapier':'Martial',
  'scimitar':'Martial','shortsword':'Martial','trident':'Martial','war pick':'Martial',
  'warhammer':'Martial','whip':'Martial',
  // Martial Ranged
  'blowgun':'Martial','hand crossbow':'Martial','heavy crossbow':'Martial',
  'longbow':'Martial','net':'Martial',
};
function getWeaponInfo(name) {
  if (!name) return null;
  const lower = name.toLowerCase().trim();
  // Check server-side classification first
  if (NAMED_ITEM_TYPES[lower] === 'wpn') return {category: 'Simple'};
  // Direct match
  if (_WEAPON_CATEGORIES[lower]) return {category: _WEAPON_CATEGORIES[lower]};
  // Try singular form (strip trailing 's')
  if (lower.endsWith('s') && !lower.endsWith('ss')) {
    const singular = lower.slice(0, -1);
    if (_WEAPON_CATEGORIES[singular]) return {category: _WEAPON_CATEGORIES[singular]};
  }
  // Fallback: keyword match
  if (isWeapon(name)) {
    // Default to Simple for generic weapon-like items
    return {category: 'Simple'};
  }
  return null;
}

function tagWeapons() {
  // Read current proficiencies from display
  const weaponProfs = getCurrentProfs('weapon_proficiencies');
  const hasSimple = weaponProfs.some(p => p.toLowerCase() === 'simple weapons');
  const hasMartial = weaponProfs.some(p => p.toLowerCase() === 'martial weapons');
  
  document.querySelectorAll('#inv-list .item-card, #equipped-list .item-card, #team-items-list .item-card').forEach(card => {
    const input = card.querySelector('.item-card-name');
    const badge = card.querySelector('.wpn-badge');
    const npBadge = card.querySelector('.np-badge');
    if (!input || !badge) return;
    const name = (input.value || input.textContent || '').trim();
    const wpnInfo = getWeaponInfo(name);
    // Show enhancement badge for weapons (always visible for weapon/armor items)
    const enhBadge = card.querySelector('.enh-badge');
    if (enhBadge) {
      const enh = parseInt(card.dataset.enhancement || '0');
      if (wpnInfo) {
        enhBadge.textContent = '+' + enh;
        enhBadge.style.display = '';
      } else if (!isArmor(name)) {
        enhBadge.style.display = 'none';
      }
    }
    if (wpnInfo) {
      badge.style.display = 'inline-block';
      // Check proficiency
      let proficient = weaponProfs.some(p => p.toLowerCase() === name.toLowerCase());
      if (!proficient && wpnInfo.category === 'Simple' && hasSimple) proficient = true;
      if (!proficient && wpnInfo.category === 'Martial' && hasMartial) proficient = true;
      if (!proficient && npBadge) {
        npBadge.style.display = 'inline-block';
        npBadge.textContent = '⚠️ Non-Proficient';
      } else if (npBadge) {
        npBadge.style.display = 'none';
      }
    } else {
      badge.style.display = 'none';
      if (npBadge) npBadge.style.display = 'none';
    }
  });
  tagArmor();
}

// ── Armor Detection ──
const _ARMOR_KEYWORDS = [
  'padded', 'leather', 'studded', 'hide', 'chain shirt', 'scale mail',
  'breastplate', 'half plate', 'ring mail', 'chain mail', 'splint',
  'plate', 'shield', 'armor',
];
function isArmor(name) {
  const lower = name.toLowerCase().trim();
  // Check server-side classification first
  if (NAMED_ITEM_TYPES[lower] === 'arm') return true;
  if (ARMOR_NAMES.some(n => n === lower)) return true;
  if (lower.endsWith('s') && !lower.endsWith('ss')) {
    const singular = lower.slice(0, -1);
    if (ARMOR_NAMES.some(n => n === singular)) return true;
  }
  if (_ARMOR_KEYWORDS.some(kw => lower.includes(kw))) return true;
  return false;
}

function isBodyArmor(name) {
  return isArmor(name) && !name.toLowerCase().includes('shield');
}

// ── Enhancement bonus cycling (+0 ↔ +1 ↔ +2 ↔ +3) ──
function isWeaponOrArmor(name) {
  if (!name) return false;
  if (isArmor(name)) return true;
  return !!getWeaponInfo(name);
}

function cycleEnhancement(badge) {
  if (!document.body.classList.contains('edit-mode')) return;
  const card = badge.closest('.item-card');
  let enh = parseInt(card.dataset.enhancement || '0');
  enh = (enh + 1) % 4;  // 0 → 1 → 2 → 3 → 0
  card.dataset.enhancement = enh;
  badge.textContent = '+' + enh;
  badge.style.display = '';
  // Auto-save
  const inEquipped = card.closest('#equipped-list');
  if (inEquipped) {
    saveEquippedFromDOM();
  } else {
    autoSaveInventory();
  }
}

function isShieldItem(name) {
  return isArmor(name) && name.toLowerCase().includes('shield');
}

// Maps armor names to proficiency categories
function getArmorCategory(armorName) {
  const lower = armorName.toLowerCase().trim();
  const light = ['padded armor', 'padded', 'leather armor', 'leather', 'studded leather armor', 'studded leather'];
  const medium = ['hide armor', 'hide', 'chain shirt', 'scale mail', 'breastplate', 'half plate armor', 'half plate'];
  const heavy = ['ring mail', 'chain mail', 'splint armor', 'splint', 'plate armor', 'plate'];
  if (light.some(n => lower.includes(n))) return 'Light armor';
  if (medium.some(n => lower.includes(n))) return 'Medium armor';
  if (heavy.some(n => lower.includes(n))) return 'Heavy armor';
  return null;
}

function isArmorProficient(armorName) {
  const armors = getCurrentProfs('armor_proficiencies');
  const lower = armorName.toLowerCase().trim();
  // Direct match
  if (armors.some(a => a.toLowerCase() === lower)) return true;
  // Category match
  const cat = getArmorCategory(armorName);
  if (cat && armors.some(a => a.toLowerCase() === cat.toLowerCase())) return true;
  // Shield check
  if (lower.includes('shield') && armors.some(a => a.toLowerCase() === 'shields')) return true;
  return false;
}

function tagArmor() {
  const armors = getCurrentProfs('armor_proficiencies');
  document.querySelectorAll('#inv-list .item-card, #equipped-list .item-card, #team-items-list .item-card').forEach(card => {
    const input = card.querySelector('.item-card-name');
    const badge = card.querySelector('.arm-badge');
    const npBadge = card.querySelector('.np-badge');
    if (!input || !badge) return;
    const name = (input.value || input.textContent || '').trim();
    if (isArmor(name)) {
      badge.style.display = 'inline-block';
      // Show enhancement badge for armor (always visible)
      const enhBadge = card.querySelector('.enh-badge');
      if (enhBadge) {
        const enh = parseInt(card.dataset.enhancement || '0');
        enhBadge.textContent = '+' + enh;
        enhBadge.style.display = '';
      }
      if (!isArmorProficient(name) && npBadge) {
        npBadge.style.display = 'inline-block';
        npBadge.textContent = '⚠️ Non-Proficient';
      } else if (npBadge) {
        npBadge.style.display = 'none';
      }
    } else {
      badge.style.display = 'none';
    }
  });
  // Also update AC warning
  updateAcWarning();
}

function updateAcWarning() {
  const acEl = document.querySelector('.cq-value[data-field="ac"]');
  if (!acEl) return;
  const armorProfs = getCurrentProfs('armor_proficiencies');
  // Find equipped armor
  const equipped = (equippedItems || []).map(eq => typeof eq === 'object' ? eq.name : eq);
  const wornArmor = equipped.find(item => isBodyArmor(item));
  const wornShield = equipped.find(item => isShieldItem(item));
  
  let warning = '';
  if (wornArmor && !isArmorProficient(wornArmor)) {
    warning = ' ⚠️ (non-proficient: disadv on STR/DEX, no spells)';
  }
  // Only add warning, don't change AC value
  const existingWarning = acEl.querySelector('.ac-warn');
  if (warning && !existingWarning) {
    const span = document.createElement('span');
    span.className = 'ac-warn';
    span.style.cssText = 'font-size:0.6rem;color:var(--warn);font-weight:400;display:block;white-space:normal;max-width:200px';
    span.textContent = warning;
    acEl.appendChild(span);
  } else if (!warning && existingWarning) {
    existingWarning.remove();
  }
}

// ── Equip/Unequip System ──
let equippedItems = {{ character.equipped|tojson if character.equipped else '[]' }};
if (!Array.isArray(equippedItems)) equippedItems = [];
// equippedItems is [{name, qty}] from server; normalize to ensure that format
equippedItems = equippedItems.map(eq => {
  if (typeof eq === 'string') return {name: eq, qty: 1};
  return {name: eq.name || '', qty: eq.qty || 1};
});
// Build qty lookup map
const _equippedQtys = {};
equippedItems.forEach(eq => { _equippedQtys[eq.name] = eq.qty; });

function equipItem(name, qty, enhancement) {
  name = name.trim();
  if (!name) return;
  const enh = enhancement || 0;

  // Don't duplicate
  if (equippedItems.some(eq => (typeof eq === 'object' ? eq.name : eq) === name)) return;

  // Armor exclusivity: if equipping body armor, unequip any existing body armor
  if (isBodyArmor(name)) {
    equippedItems = equippedItems.filter(eq => !isBodyArmor(typeof eq === 'object' ? eq.name : eq));
  }

  const item = {name, qty: qty || 1, enhancement: enh};
  equippedItems.push(item);
  _equippedQtys[name] = qty || 1;
  return saveEquipped();
}

// Quick-equip from inventory — clicks the ⬆️ button
async function quickEquip(name, qty) {
  console.log('quickEquip called:', name, qty);
  try {
    // 1. Read enhancement from inventory card
    const safeName = CSS.escape(name);
    const invCard = document.querySelector(`#inv-list .item-card[data-item-name="${safeName}"]`);
    if (!invCard) {
      console.warn('quickEquip: card not found in inv-list for:', name);
      return;
    }
    const enhancement = parseInt(invCard.dataset.enhancement || '0');
    invCard.remove();
    console.log('quickEquip: card removed from DOM');
    
    // 2. Save inventory
    await _flushInventory();
    console.log('quickEquip: inventory saved');
    
    // 3. Add to equipped array and save
    if (!equippedItems.some(eq => (typeof eq === 'object' ? eq.name : eq) === name)) {
      if (isBodyArmor(name)) {
        equippedItems = equippedItems.filter(eq => !isBodyArmor(typeof eq === 'object' ? eq.name : eq));
      }
      equippedItems.push({name: name, qty: qty || 1, enhancement: enhancement || 0});
    }
    _equippedQtys[name] = qty || 1;
    await saveEquipped();
    console.log('quickEquip: equipped saved, renderEquipped done');
  } catch(e) {
    console.error('quickEquip error:', e);
  }
}

// Quick-unequip to inventory — clicks the ⬇️ button
async function quickUnequip(name, qty) {
  console.log('quickUnequip called:', name, qty);
  try {
    // 1. Read enhancement before removing
    const eqItem = equippedItems.find(eq => (typeof eq === 'object' ? eq.name : eq) === name);
    const enhancement = (typeof eqItem === 'object' ? eqItem.enhancement : 0) || 0;
    // Remove from equipped array and save
    equippedItems = equippedItems.filter(eq => (typeof eq === 'object' ? eq.name : eq) !== name);
    delete _equippedQtys[name];
    await saveEquipped();
    console.log('quickUnequip: equipped saved');
    
    // 2. Add to inventory DOM and save
    addInventoryCard(name, qty || 1, enhancement);
    await _flushInventory();
    console.log('quickUnequip: inventory saved');
  } catch(e) {
    console.error('quickUnequip error:', e);
  }
}

function unequipItem(name) {
  equippedItems = equippedItems.filter(eq => (typeof eq === 'object' ? eq.name : eq) !== name);
  delete _equippedQtys[name];
  return saveEquipped();
}

async function saveEquippedFromDOM() {
  // Rebuild equippedItems from DOM cards (preserves enhancement data attributes)
  const items = [];
  document.querySelectorAll('#equipped-list .item-card').forEach(card => {
    const nameEl = card.querySelector('.item-card-name');
    const name = (nameEl?.textContent || '').trim();
    if (!name) return;
    const qtyBadge = card.querySelector('.item-qty');
    const qty = qtyBadge ? parseInt(qtyBadge.textContent) || 1 : 1;
    const enhancement = parseInt(card.dataset.enhancement || '0');
    items.push({ name, qty, enhancement });
  });
  equippedItems = items;
  // Update qty lookup
  Object.keys(_equippedQtys).forEach(k => delete _equippedQtys[k]);
  items.forEach(eq => { _equippedQtys[eq.name] = eq.qty; });
  await saveEquipped();
}

async function saveEquipped() {
  console.log('saveEquipped: equippedItems =', JSON.stringify(equippedItems));
  await api('/update', { equipped: JSON.stringify(equippedItems) });
  console.log('saveEquipped: api call done, calling renderEquipped');
  renderEquipped();
  refreshAttacksTab();
  // Refresh item badges
  tagArmor();
  tagWeapons();
}

// ── Feature Action (use limited-use feature from Actions in Combat) ──
async function useFeature(name, btn) {
  try {
    const resp = await api('/use-feature', { name });
    const data = await resp.json();
    if (!data.ok) return;
    // Update client-side featureData
    const feat = featureData.find(f => f.name === name);
    if (feat) feat.uses = data.uses;
    // Update the dots display on this button
    const dots = btn.querySelectorAll('.use-dot');
    for (let i = dots.length - 1; i >= 0; i--) {
      if (dots[i].classList.contains('active')) {
        dots[i].classList.remove('active');
        break;
      }
    }
    const countSpan = btn.querySelector('.feat-uses-dots span:last-child');
    if (countSpan) {
      countSpan.textContent = `${data.uses}/${dots.length}`;
    }
    if (data.uses === 0) {
      btn.classList.add('depleted');
      btn.style.opacity = '0.45';
      btn.style.cursor = 'default';
      btn.onclick = null;
    }
    // Sync features tab dots via render
    const idx = featureData.indexOf(feat);
    if (idx >= 0) renderFeatureDots(idx);
  } catch(e) { console.error(e); }
}

// ── Charged Items ── click card to spend charges ──
function chargeStep(btn, delta) {
  const stepper = btn.closest('.charge-stepper');
  const display = stepper.querySelector('.charge-amount-display');
  const card = btn.closest('.charge-card');
  const maxCharge = parseInt(card.dataset.maxCharges);
  const currentCharge = parseInt(card.dataset.currentCharges);
  const available = Math.min(maxCharge, currentCharge);
  let val = parseInt(display.textContent) + delta;
  if (val < 1) val = 1;
  if (val > available) val = available;
  display.textContent = val;
}

async function spendCharge(itemName, amount) {
  amount = amount || 1;
  try {
    const resp = await fetch(`/api/character/${CHAR_ID}/spend-charge`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: itemName, amount: amount})
    });
    const data = await resp.json();
    if (!data.charged_items) return;

    updateChargeCards(data.charged_items);
  } catch(e) { console.error('spendCharge error:', e); }
}

async function reloadCharge(itemName) {
  try {
    const resp = await fetch(`/api/character/${CHAR_ID}/reload-charge`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: itemName})
    });
    const data = await resp.json();
    if (!data.charged_items) return;

    updateChargeCards(data.charged_items);
  } catch(e) { console.error('reloadCharge error:', e); }
}

function updateChargeCards(chargedItems) {
  chargedItems.forEach(ci => {
    // Update Charged Items cards (wands, staves, etc.)
    document.querySelectorAll('.charge-card').forEach(card => {
      if (card.dataset.itemName === ci.name) {
        updateSingleChargeCard(card, ci);
      }
    });
    // Update Weapon Attack cards with magazines (firearms)
    document.querySelectorAll('.weapon-atk-card.has-magazine').forEach(card => {
      if (card.dataset.itemName === ci.name) {
        updateWeaponMagazineCard(card, ci);
      }
    });
  });
  window._chargedItems = chargedItems;
}

function updateSingleChargeCard(card, ci) {
  // Update charge count display
  const countEl = card.querySelector('.charge-count-display');
  if (countEl) {
    countEl.textContent = `${ci.current_charges}/${ci.max_charges} charges`;
  }
  // Update data attributes
  card.dataset.currentCharges = ci.current_charges;
  card.dataset.maxCharges = ci.max_charges;
  const recharge = card.dataset.recharge || '';
  const isReload = recharge.startsWith('reload');
  const multiCharge = ci.max_charges > 1;
  // Update stepper visibility and reset amount to 1
  let stepper = card.querySelector('.charge-stepper');
  if (multiCharge && ci.current_charges > 0) {
    if (!stepper) {
      // Rebuild stepper if missing (e.g. after depletion → recharge)
      stepper = document.createElement('div');
      stepper.className = 'charge-stepper';
      stepper.style.cssText = 'display:flex;align-items:center;gap:0.4rem;margin-top:0.3rem;justify-content:flex-end';
      stepper.onclick = (e) => e.stopPropagation();
      stepper.innerHTML = `<button class="charge-amount-btn" style="padding:0.1rem 0.4rem;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:0.75rem;line-height:1">−</button><span class="charge-amount-display" style="font-family:monospace;font-size:0.8rem;min-width:1.2rem;text-align:center">1</span><button class="charge-amount-btn" style="padding:0.1rem 0.4rem;border-radius:3px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:0.75rem;line-height:1">+</button><button class="charge-spend-btn" style="padding:0.15rem 0.5rem;border-radius:4px;border:1px solid var(--accent);background:var(--accent2);color:var(--accent);cursor:pointer;font-size:0.7rem;font-weight:600">⚡ Spend</button>`;
      stepper.querySelector('.charge-amount-btn:first-child').onclick = (e) => { e.stopPropagation(); chargeStep(e.target, -1); };
      stepper.querySelector('.charge-amount-btn:last-child').onclick = (e) => { e.stopPropagation(); chargeStep(e.target, 1); };
      stepper.querySelector('.charge-spend-btn').onclick = (e) => {
        e.stopPropagation();
        spendCharge(card.dataset.itemName, parseInt(stepper.querySelector('.charge-amount-display').textContent));
      };
      card.appendChild(stepper);
    }
    stepper.style.display = '';
    const disp = stepper.querySelector('.charge-amount-display');
    if (disp) disp.textContent = '1';
  } else if (stepper) {
    stepper.style.display = 'none';
  }
  if (ci.current_charges <= 0) {
    card.classList.add('depleted');
    if (isReload) {
      card.style.opacity = '';
      card.style.cursor = 'pointer';
      card.onclick = function() { reloadCharge(this.dataset.itemName); };
      let reloadRow = card.querySelector('.reload-btn-row');
      if (!reloadRow) {
        reloadRow = document.createElement('div');
        reloadRow.className = 'reload-btn-row';
        reloadRow.style.cssText = 'margin-top:0.3rem;text-align:right';
        reloadRow.innerHTML = `<button class="reload-btn" style="padding:0.2rem 0.6rem;border-radius:4px;border:1px solid var(--accent);background:var(--accent2);color:var(--accent);cursor:pointer;font-size:0.7rem;font-weight:600">🔄 Reload</button>`;
        reloadRow.querySelector('.reload-btn').onclick = function(e) {
          e.stopPropagation();
          reloadCharge(card.dataset.itemName);
        };
        card.appendChild(reloadRow);
      }
      reloadRow.style.display = '';
    } else {
      card.style.opacity = '0.45';
      card.style.cursor = 'default';
      card.onclick = null;
      const reloadRow = card.querySelector('.reload-btn-row');
      if (reloadRow) reloadRow.style.display = 'none';
    }
  } else {
    card.classList.remove('depleted');
    card.style.opacity = '';
    card.style.cursor = 'pointer';
    card.onclick = function() { spendCharge(this.dataset.itemName); };
    const reloadRow = card.querySelector('.reload-btn-row');
    if (reloadRow) reloadRow.style.display = 'none';
  }
}

function updateWeaponMagazineCard(card, ci) {
  // Update magazine count
  const countEl = card.querySelector('.magazine-count');
  if (countEl) {
    countEl.textContent = `${ci.current_charges}/${ci.max_charges}`;
  }
  // Update Fire button
  const fireBtn = card.querySelector('.mag-spend-btn');
  if (fireBtn) {
    if (ci.current_charges <= 0) {
      fireBtn.disabled = true;
      fireBtn.style.opacity = '0.4';
    } else {
      fireBtn.disabled = false;
      fireBtn.style.opacity = '';
    }
  }
}

// Auto-load team items when opening inventory tab (merged with history tab hook below)

// ── Drag & Drop handlers ──
let _dragItem = null; // { name, source, qty }

function handleDragStart(e, name, source, qty) {
  _dragItem = { name, source, qty };
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', name);
  e.target.closest('.item-card')?.classList.add('dragging');
}

function handleDragEnd(e) {
  e.target.closest('.item-card')?.classList.remove('dragging');
  document.querySelectorAll('.drop-zone-active').forEach(el => el.classList.remove('drop-zone-active'));
  _dragItem = null;
}

function handleDragOver(e, zone) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const card = e.currentTarget;
  if (!card.classList.contains('drop-zone-active')) {
    card.classList.add('drop-zone-active');
  }
}

function handleDragLeave(e) {
  if (!e.currentTarget.contains(e.relatedTarget)) {
    e.currentTarget.classList.remove('drop-zone-active');
  }
}

async function handleDrop(e, targetZone) {
  e.preventDefault();
  e.currentTarget.classList.remove('drop-zone-active');
  if (!_dragItem) return;

  const { name, source, qty } = _dragItem;
  if (source === targetZone) return;

  if (source === 'inventory' && targetZone === 'equipped') {
    // Move card from inventory to equipped: remove from DOM, save inventory, then equip
    const card = document.querySelector(`#inv-list .item-card[data-item-name="${CSS.escape(name)}"]`);
    const enhancement = card ? parseInt(card.dataset.enhancement || '0') : 0;
    if (card) card.remove();
    await _flushInventory();
    await equipItem(name, qty, enhancement);
  } else if (source === 'equipped' && targetZone === 'inventory') {
    // Move from equipped to inventory: unequip first, then add card + save
    const eqQty = _equippedQtys[name] || 1;
    const eqCard = document.querySelector(`#equipped-list .item-card[data-item-name="${CSS.escape(name)}"]`);
    const eqEnhancement = eqCard ? parseInt(eqCard.dataset.enhancement || '0') : 0;
    await unequipItem(name);
    addInventoryCard(name, eqQty, eqEnhancement);
    await _flushInventory();
  } else if (source === 'inventory' && targetZone === 'team') {
    await shareToTeam(name, qty);
  } else if (source === 'team' && targetZone === 'inventory') {
    const teamCard = document.querySelector(`.team-item-card[data-item-name="${CSS.escape(name)}"]`);
    const itemId = teamCard?.dataset?.itemId;
    if (itemId) await claimTeamItem(parseInt(itemId), name);
  }
  _dragItem = null;
}

// ── Add a card to the inventory DOM ──
function addInventoryCard(name, qty, enhancement) {
  const list = document.getElementById('inv-list');
  if (!list) return;
  const emptyEl = document.getElementById('inv-empty');
  if (emptyEl) emptyEl.style.display = 'none';

  const qtyBadge = qty > 1 ? `<span class="item-qty" onclick="event.stopPropagation();toggleItemExpand(this.closest('.item-card').querySelector('.item-expand-btn'))" title="Click to expand" style="cursor:pointer">${qty}</span>` : '';
  const safeName = name.replace(/"/g, '&quot;');
  const safeNameAttr = name.replace(/'/g, "\\'");

  const card = document.createElement('div');
  card.className = 'item-card';
  card.draggable = true;
  card.setAttribute('data-item-name', safeName);
  card.dataset.enhancement = String(enhancement || 0);
  card.setAttribute('ondragstart', `handleDragStart(event, '${safeNameAttr}', 'inventory', ${qty})`);

// ── Delete inventory item ──
async function deleteInventoryItem(name) {
  if (!confirm(`Remove "${name}" from inventory?`)) return;
  const card = document.querySelector(`#inv-list .item-card[data-item-name="${CSS.escape(name)}"]`);

// ── Toggle attunement ──
async function toggleAttune(itemName) {
  const trimmed = itemName.trim();
  // Extract char_id from URL (/character/{id})
  const pathMatch = window.location.pathname.match(/\/character\/(\d+)/);
  if (!pathMatch) { alert('Could not determine character'); return; }
  const charId = pathMatch[1];
  try {
    const r = await fetch(`/api/character/${charId}/toggle-attune`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({item: trimmed})
    });
    const d = await r.json();
    if (d.error) { alert(d.error); return; }
    // Update badge and slots without full reload
    const card = document.querySelector(`.equipped-card[data-item-name="${CSS.escape(trimmed)}"]`);
    if (card) {
      const badge = card.querySelector('.item-attune-badge');
      if (badge) {
        if (d.action === 'attuned') {
          badge.className = 'item-attune-badge attuned';
          badge.textContent = '◆';
          badge.title = 'Attuned — click to break';
        } else {
          badge.className = 'item-attune-badge';
          badge.textContent = '◇';
          badge.title = 'Needs attunement — click to attune';
        }
      }
    }
    // Update attunement slots
    const slots = document.querySelectorAll('#attunement-slots .attune-slot');
    slots.forEach((el, i) => {
      if (i < d.slots_used) {
        el.classList.add('filled');
        el.style.background = 'var(--accent)';
        el.style.borderColor = 'var(--accent)';
        el.textContent = '◆';
      } else {
        el.classList.remove('filled');
        el.style.background = '';
        el.style.borderColor = '';
        el.textContent = '◇';
      }
    });
    // Update count
    const countEl = document.querySelector('#attunement-slots span:last-child');
    if (countEl) countEl.textContent = `${d.slots_used}/3`;
  } catch(e) {
    alert('Failed to toggle attunement');
  }
}

// ── Save inventory (card-based) ──
let _invSaveBusy = false;
async function saveInventory() {
  if (_invSaveBusy) {
    // Save already in flight — schedule a retry that re-reads fresh DOM
    clearTimeout(window._invSaveQueued);
    window._invSaveQueued = setTimeout(saveInventory, 50);
    return;
  }
  _invSaveBusy = true;
  try {
    await _flushInventory();
  } catch(e) {
    console.error('saveInventory failed:', e);
  }
  _invSaveBusy = false;
}

async function _flushInventory() {
  const items = [];
  const cards = document.querySelectorAll('#inv-list .item-card');
  console.log('_flushInventory: found', cards.length, 'cards in #inv-list');
  cards.forEach(card => {
    const nameEl = card.querySelector('.item-card-name');
    const qtyBadge = card.querySelector('.item-qty');
    const name = (nameEl?.value || nameEl?.textContent || '').trim();
    if (!name) return;
    const qty = qtyBadge ? parseInt(qtyBadge.textContent) || 1 : 1;
    const enhancement = parseInt(card.dataset.enhancement || '0');
    items.push(enhancement > 0 ? { name, qty, enhancement } : { name, qty });
  });
  document.querySelectorAll('#inv-list .item-card').forEach(card => {
    const nameEl = card.querySelector('.item-card-name');
    if (!(nameEl?.value || nameEl?.textContent || '').trim()) card.remove();
  });
  const emptyEl = document.getElementById('inv-empty');
  if (emptyEl) emptyEl.style.display = items.length === 0 ? 'block' : 'none';
  console.log('Saving inventory:', JSON.stringify(items));
  const resp = await api('/update', { inventory: JSON.stringify(items) });
  if (!resp.ok) {
    console.error('Inventory save failed:', resp.status, await resp.text().catch(()=>''));
    return;
  }
  console.log('Inventory save OK');
  tagWeapons();
}

function autoSaveInventory() {
  clearTimeout(window._invSaveTimeout);
  window._invSaveTimeout = setTimeout(saveInventory, 600);
}

let _pickerTimer = null;

function openItemPicker() {
  const popup = document.getElementById('item-picker-popup');
  if (!popup) return;
  popup.style.display = 'flex';
  document.getElementById('item-picker-results').innerHTML = '<div style="padding:1rem;color:var(--text-muted);text-align:center;font-size:0.85rem">Loading...</div>';

  fetch('/api/items/search')
    .then(r => r.json())
    .then(d => renderPickerResults(d.results || []))
    .catch(() => {});
  document.getElementById('item-picker-search').value = '';
  setTimeout(() => document.getElementById('item-picker-search').focus(), 100);
}

function closeItemPicker() {
  document.getElementById('item-picker-popup').style.display = 'none';
}

function searchPickerItems(query) {
  clearTimeout(_pickerTimer);
  const q = query.trim();
  if (!q) { fetch('/api/items/search').then(r=>r.json()).then(d=>renderPickerResults(d.results||[])).catch(()=>{}); return; }
  _pickerTimer = setTimeout(async () => {
    try {
      const r = await fetch(`/api/items/search?q=${encodeURIComponent(q)}`);
      const d = await r.json();
      renderPickerResults(d.results || []);
    } catch(e) {}
  }, 200);
}

function renderPickerResults(items) {

    return;

  results.innerHTML = items.map(item =>
    `<div style="padding:0.25rem 0.6rem;cursor:pointer;border-bottom:1px solid var(--border);overflow-wrap:break-word;word-break:break-word">

          <span style="font-size:0.75rem;color:var(--accent);cursor:pointer;padding:0.15rem 0.4rem;border-radius:3px;user-select:none" onclick="event.stopPropagation();event.preventDefault();togglePickerRowDesc(this)" onmousedown="event.stopPropagation()" onmouseover="this.style.background='var(--accent2)'" onmouseout="this.style.background='transparent'">▾ info</span>

// ── Level Up Wizard ───────────────────────────────────────────────────
let luData = null;
let luStep = 0;
let luSteps = [];       // [{label, render}]
let luChoices = {};     // accumulated choices
let luClassToLevel = null;  // multiclass: which class to level

async function openLevelUp() {
  // Ask for target level
  const maxTarget = 20;
  const target = prompt(`Level to? (${CHAR_LEVEL + 1}–${maxTarget})`, CHAR_LEVEL + 1);
  if (!target) return;
  const targetNum = parseInt(target);
  if (isNaN(targetNum) || targetNum <= CHAR_LEVEL || targetNum > maxTarget) {
    alert(`Enter a level between ${CHAR_LEVEL + 1} and ${maxTarget}`);
    return;
  }
  return openLevelUpDirect(targetNum);
}

async function openLevelUpDirect(targetNum) {
  // Always level up one at a time — frontend wizard handles single-level jumps
  const stepTarget = CHAR_LEVEL + 1;
  if (stepTarget > 20) return;
  
  try {
    const resp = await fetch(`/api/character/${CHAR_ID}/level-up-info?target=${stepTarget}`);
    luData = await resp.json();
    if (luData.error) { alert(luData.error); return; }
  } catch(e) { console.error(e); alert('Failed to load level-up info'); return; }
  
  // Stash the ultimate goal so applyLevelUp knows where we're headed
  luData._ultimate_target = targetNum;
  
  luStep = 0;
  luChoices = {};
  
  // Update title
  document.getElementById('lu-title').textContent = `⬆ Level Up — L${luData.current_level} → L${luData.target_level}`;
  
  // Build steps
  luSteps = [];
  luSteps.push({label: 'Overview', render: renderLuOverview});
  
  // Class picker — show whenever multiclass options exist (PHB p.163: any level-up)
  if (luData.multiclass && luData.multiclass.options && luData.multiclass.options.length > 0) {
    luClassToLevel = luData.multiclass.class_to_level;
    luSteps.push({label: 'Class', render: renderLuClassPick});
  }
  
  luSteps.push({label: 'HP', render: renderLuHP});
  if (luData.asi) luSteps.push({label: 'ASI/Feat', render: renderLuASI});
  if (luData.fighting_style) luSteps.push({label: 'Fighting Style', render: renderLuFightingStyle});
  if (luData.expertise) luSteps.push({label: 'Expertise', render: renderLuExpertise});
  if (luData.metamagic) luSteps.push({label: 'Metamagic', render: renderLuMetamagic});
  if (luData.invocations) luSteps.push({label: 'Invocations', render: renderLuInvocations});
  if (luData.pact_boon) luSteps.push({label: 'Pact Boon', render: renderLuPactBoon});
  if (luData.maneuvers) luSteps.push({label: 'Maneuvers', render: renderLuManeuvers});
  if (luData.magical_secrets) luSteps.push({label: 'Magical Secrets', render: renderLuMagicalSecrets});
  if (luData.totem_spirit) luSteps.push({label: 'Totem Spirit', render: renderLuTotemSpirit});
  if (luData.hunters_prey) luSteps.push({label: "Hunter's Prey", render: renderLuHuntersPrey});
  if (luData.favored_enemy) luSteps.push({label: 'Favored Enemy', render: renderLuFavoredEnemy});
  if (luData.favored_terrain) luSteps.push({label: 'Favored Terrain', render: renderLuFavoredTerrain});
  if (luData.infusions) luSteps.push({label: 'Infusions', render: renderLuInfusions});
  if (luData.subclass) luSteps.push({label: luData.subclass.label, render: renderLuSubclass});
  if (luData.subclass_bonus_map && Object.keys(luData.subclass_bonus_map).length > 0) {
    luSteps.push({label: 'Bonuses', render: renderLuSubclassBonus});
  }
  if (luData.spells) luSteps.push({label: 'Spells', render: renderLuSpells});
  luSteps.push({label: 'Confirm', render: renderLuConfirm});
  
  // Render step dots
  const dots = document.getElementById('lu-steps');
  dots.innerHTML = luSteps.map((s, i) => 
    `<span class="lu-step-dot" id="lu-dot-${i}" style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:0.7rem;font-weight:600;background:var(--bg);border:2px solid var(--border);color:var(--text-muted)">${i+1}</span>`
  ).join(' ');
  
  // Show modal
  document.getElementById('levelup-modal').style.display = 'flex';
  renderLevelUpStep();
}

function closeLevelUp() {
  document.getElementById('levelup-modal').style.display = 'none';
  luData = null;
}

function levelUpStep(delta) {
  if (delta > 0 && luStep >= luSteps.length - 1) return;
  if (delta < 0 && luStep <= 0) return;
  luStep += delta;
  renderLevelUpStep();
}

function renderLevelUpStep() {
  const content = document.getElementById('lu-content');
  content.innerHTML = '';
  
  // Step dots
  document.querySelectorAll('.lu-step-dot').forEach((d, i) => {
    d.style.background = i === luStep ? 'var(--accent)' : (i < luStep ? 'var(--success)' : 'var(--bg)');
    d.style.borderColor = i === luStep ? 'var(--accent)' : (i < luStep ? 'var(--success)' : 'var(--border)');
    d.style.color = i <= luStep ? '#fff' : 'var(--text-muted)';
  });
  
  // Show/hide nav
  document.getElementById('lu-back').style.display = luStep > 0 ? '' : 'none';
  document.getElementById('lu-next').style.display = luStep < luSteps.length - 1 ? '' : 'none';
  document.getElementById('lu-confirm').style.display = luStep === luSteps.length - 1 ? '' : 'none';
  
  // Render step content
  if (luSteps[luStep] && luSteps[luStep].render) {
    luSteps[luStep].render(content);
  }
}

function renderLuOverview(el) {
  const d = luData;
  let html = `<div style="font-size:0.9rem;line-height:1.6">`;
  html += `<p><strong>Class:</strong> ${d.class_name}</p>`;
  html += `<p><strong>New Level:</strong> ${d.target_level}</p>`;
  html += `<p><strong>HP:</strong> Gain 1d12 + CON (average ${d.hp.average}, max ${d.hp.max_roll})</p>`;
  if (d.all_features && d.all_features.length) {
    html += `<p><strong>New Features:</strong></p><ul>`;
    d.all_features.forEach(f => html += `<li>${f}</li>`);
    html += `</ul>`;
  }
  if (d.proficiency_bonus.changed) {
    html += `<p><strong>Proficiency Bonus:</strong> +${d.proficiency_bonus.old} → <strong style="color:var(--accent)">+${d.proficiency_bonus.new}</strong></p>`;
  }
  if (d.asi) html += `<p><strong>Ability Score Improvement</strong> at this level!</p>`;
  if (d.subclass) html += `<p><strong>${d.subclass.label}</strong> choice at this level!</p>`;
  if (d.spells) html += `<p><strong>Spellcasting</strong> updates available.</p>`;
  html += `</div>`;
  el.innerHTML = html;
}

function renderLuClassPick(el) {
  const mc = luData.multiclass;
  const cl = mc.class_levels || {};
  const curClass = mc.class_to_level;
  
  // Build current class levels display
  const lvlDisplay = Object.entries(cl).map(([c, l]) => `${c} ${l}`).join(' / ');
  
  let html = `<div style="font-size:0.9rem;line-height:1.6">
    <h3 style="margin-bottom:0.5rem">Choose Class to Level</h3>
    <p style="color:var(--text-muted);margin-bottom:1rem">Current: <strong>${lvlDisplay}</strong></p>`;
  
  // ── Existing classes (always shown first) ──
  html += `<p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem">Continue existing class:</p>`;
  html += `<div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem">`;
  for (const [clsName, clsLvl] of Object.entries(cl)) {
    const checked = luClassToLevel === clsName;
    html += `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer">
      <input type="radio" name="lu-class" value="${clsName}" ${checked ? 'checked' : ''} onchange="luClassToLevel=this.value">
      <strong>${clsName}</strong>
      <span style="font-size:0.75rem;color:var(--text-muted)">Lv ${clsLvl} → Lv ${clsLvl + 1}</span>
    </label>`;
  }
  html += `</div>`;
  
  // ── New multiclass options ──
  if (mc.options && mc.options.length > 0) {
    const newOpts = mc.options.filter(o => !cl[o.class]);
    if (newOpts.length > 0) {
      // Split eligible vs ineligible
      const eligible = newOpts.filter(o => o.available);
      const ineligible = newOpts.filter(o => !o.available);
      html += `<p style="font-size:0.8rem;color:var(--text-muted);margin-bottom:0.3rem">Multiclass into a new class:</p>`;
      html += `<div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem">`;
      // Eligible first
      eligible.forEach(opt => {
        const checked = luClassToLevel === opt.class;
        html += `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer">
          <input type="radio" name="lu-class" value="${opt.class}" ${checked ? 'checked' : ''} onchange="luClassToLevel=this.value">
          <strong>${opt.class}</strong>
          <span style="font-size:0.7rem;color:var(--accent)">(new)</span>
        </label>`;
      });
      html += `</div>`;
      // Ineligible (grayed out)
      if (ineligible.length > 0) {
        html += `<p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.3rem">Locked (missing prerequisites):</p>`;
        html += `<div style="display:flex;flex-direction:column;gap:0.3rem;opacity:0.5">`;
        ineligible.forEach(opt => {
          const missing = opt.missing ? Object.entries(opt.missing).map(([s,v]) => `${s} ${v}`).join(', ') : 'prerequisites not met';
          html += `<div style="display:flex;align-items:center;gap:0.5rem;padding:0.4rem 0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px">
            <span style="font-size:0.8rem;color:var(--text-muted)">🔒 <strong>${opt.class}</strong></span>
            <span style="font-size:0.65rem;color:var(--text-muted)">needs ${missing}</span>
          </div>`;
        });
        html += `</div>`;
      }
    }
  }
  
  html += `</div>`;
  el.innerHTML = html;
  if (!luClassToLevel) luClassToLevel = curClass;
}

function renderLuASI(el) {

    <p style="margin-bottom:0.75rem;font-weight:600">Ability Score Improvement (Level ${d.level})</p>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem">Choose +2 to one ability, +1 to two abilities, or pick a feat.</p>`;

    <label style="font-weight:600;display:block;margin-bottom:0.3rem">+2 to one ability:</label>
    <select id="lu-asi-plus2" onchange="luChoices.asi = {[this.value]: 2}" style="width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
      <option value="">— Choose —</option>`;
  for (const [a, v] of Object.entries(d.abilities)) {
    const capped = (d.would_exceed_20 || d.max_20).includes(a);
    const taken2 = prevPlus2.includes(a);
    const disabled = capped || taken2;
    const tag = capped ? '[cap]' : taken2 ? `[taken L${prevByAb[a]?.join(', L')}]` : '';
    html += `<option value="${a}"${disabled ? ' disabled' : ''}>${a} (${v} → ${v+2})${tag ? ' ' + tag : ''}</option>`;
  }
  html += `</select></div>`;
  
  // Option 2: +1 to two
  html += `<div style="margin-bottom:1rem">
    <label style="font-weight:600;display:block;margin-bottom:0.3rem">+1 to two abilities:</label>
    <div style="display:flex;gap:0.5rem">`;
  html += `<select id="lu-asi-plus1a" onchange="updateASIplus1()" style="flex:1;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
    <option value="">— A —</option>`;
  for (const [a, v] of Object.entries(d.abilities)) {
    const capped = d.max_20.includes(a);
    const taken1 = prevPlus1.includes(a);
    const disabled = capped || taken1;
    const tag = capped ? '[max]' : taken1 ? `[taken L${prevByAb[a]?.join(', L')}]` : '';
    html += `<option value="${a}"${disabled ? ' disabled' : ''}>${a} (${v} → ${v+1})${tag ? ' ' + tag : ''}</option>`;
  }
  html += `</select>`;
  html += `<select id="lu-asi-plus1b" onchange="updateASIplus1()" style="flex:1;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
    <option value="">— B —</option>`;
  for (const [a, v] of Object.entries(d.abilities)) {
    const capped = d.max_20.includes(a);
    const taken1 = prevPlus1.includes(a);
    const disabled = capped || taken1;
    const tag = capped ? '[max]' : taken1 ? `[taken L${prevByAb[a]?.join(', L')}]` : '';
    html += `<option value="${a}"${disabled ? ' disabled' : ''}>${a} (${v} → ${v+1})${tag ? ' ' + tag : ''}</option>`;
  }
  html += `</select></div></div>`;
  
  // Option 3: Feat
  if (feats.length) {
    html += `<div style="margin-bottom:1rem">
      <label style="font-weight:600;display:block;margin-bottom:0.3rem">Or pick a Feat (${feats.filter(f=>f.eligible).length} eligible, ${feats.length} total):</label>
      <input id="lu-feat-search" placeholder="Filter feats..." oninput="filterLuFeats()" style="width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--accent);border-radius:6px;color:var(--text);margin-bottom:0.4rem">
      <div id="lu-feat-list" style="max-height:250px;overflow-y:auto;border:1px solid var(--border);border-radius:6px;padding:0.3rem">`;
    feats.forEach(f => {
      const sel = luChoices.asi === 'feat:' + f.key;
      const inel = !f.eligible;
      const shortDesc = (f.desc || '').replace(/<\/?[^>]+(>|$)/g,'').substring(0, 140);
      html += `<div class="lu-feat-card" data-key="${f.key}" data-eligible="${f.eligible}" style="cursor:${inel?'not-allowed':'pointer'};padding:0.4rem 0.5rem;margin:0.15rem 0;border:1px solid ${sel?'var(--accent)':inel?'var(--border)':'var(--border)'};border-radius:6px;font-size:0.8rem;opacity:${inel?'0.5':'1'};background:${sel?'var(--accent2)':'var(--bg)'}"
        ${inel ? '' : `onclick="selectLuFeat('${f.key}')"`}>

      <div id="lu-feat-detail" style="margin-top:0.5rem;font-size:0.8rem;color:var(--text-muted)"></div>

    luChoices.asi = {[a]: 1, [b]: 1};

function selectLuFeat(key) {
  const feat = luData.feats.find(f => f.key === key);
  if (!feat || !feat.eligible) return;
  luChoices.asi = 'feat:' + key;
  // Update card highlights
  document.querySelectorAll('.lu-feat-card').forEach(c => {
    const isSel = c.getAttribute('data-key') === key;
    c.style.borderColor = isSel ? 'var(--accent)' : 'var(--border)';
    c.style.background = isSel ? 'var(--accent2)' : 'var(--bg)';
    const strong = c.querySelector('strong');
    if (strong) strong.style.color = isSel ? 'var(--accent)' : 'var(--text)';
    if (isSel && !strong.textContent.startsWith('✓ ')) strong.textContent = '✓ ' + strong.textContent;
    else if (!isSel && strong.textContent.startsWith('✓ ')) strong.textContent = strong.textContent.substring(2);
  });
  // Show full description
  const detailEl = document.getElementById('lu-feat-detail');
  const srcTag = feat.source ? ` ${_srcBadge(feat.source)}` : '';
  detailEl.innerHTML = `<div style="padding:0.5rem;background:var(--bg);border:1px solid var(--accent);border-radius:6px"><strong>${feat.name}</strong>${srcTag}<br><span style="font-size:0.78rem">${feat.desc || ''}</span></div>`;
  // Half-feat ASI
  const asiEl = document.getElementById('lu-feat-asi-choice');
  if (feat.asi && feat.asi.choices) {
    let asiHtml = `<label style="font-weight:600;display:block;margin-bottom:0.3rem;font-size:0.85rem">+${feat.asi.amount} to:</label>
      <select id="lu-feat-asi" onchange="luChoices.feat_asi_choice=this.value" style="width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text)">
        <option value="">— Choose —</option>`;
    feat.asi.choices.forEach(a => { asiHtml += `<option value="${a}">${a}</option>`; });
    asiHtml += '</select>';
    asiEl.innerHTML = asiHtml;
    asiEl.style.display = '';
  } else {
    asiEl.style.display = 'none';
  }
}

function filterLuFeats() {
  const q = (document.getElementById('lu-feat-search')?.value || '').toLowerCase();
  document.querySelectorAll('.lu-feat-card').forEach(c => {

let _luSpellList = [];

async function loadLuSpells(className, targetLevel, needSpells, needCantrips) {
  try {
    const r = await fetch(`/api/character/${CHAR_ID}/available-spells?level=${targetLevel}`);
    _luSpellList = await r.json();
    // Sort: cantrips first, then by level, then name
    _luSpellList.sort((a,b) => a.level - b.level || a.name.localeCompare(b.name));
    filterLuSpells();
    renderLuSelected();
  } catch(e) {
    document.getElementById('lu-spell-results').innerHTML = 
      '<div style="padding:0.5rem;color:var(--danger);text-align:center">Failed to load spells</div>';
  }
}

function filterLuSpells() {
  const q = (document.getElementById('lu-spell-search')?.value || '').toLowerCase().trim();
  const div = document.getElementById('lu-spell-results');
  if (!div) return;
  
  let spells = _luSpellList;
  if (_coreOnly) {
    spells = spells.filter(s => isCoreSource(s.book));
  }
  if (q) {
    spells = spells.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.school || '').toLowerCase().includes(q) ||
      s.source.toLowerCase().includes(q)
    );
  }
  
  if (!spells.length) {
    div.innerHTML = '<div style="padding:0.5rem;color:var(--text-muted);text-align:center">No spells match</div>';
    return;
  }
  
  const selected = luChoices.spells || [];
  const totalNeeded = (luData.spells.spells_known_change || 0) + (luData.spells.cantrips_change || 0);
  
  const shown = spells;
  div.innerHTML = shown.map((s, i) => {
    const selIdx = selected.findIndex(x => x.name === s.name);
    const isSelected = selIdx >= 0;
    const uid = 'lus' + i;
    // Level badge
    const lvlBadge = s.level === 0
      ? '<span style="background:var(--accent2);color:var(--accent);font-size:0.65rem;padding:0.1rem 0.35rem;border-radius:3px;flex-shrink:0">Cantrip</span>'
      : `<span style="background:var(--accent);color:#fff;font-size:0.65rem;padding:0.1rem 0.35rem;border-radius:3px;flex-shrink:0">Lv${s.level}</span>`;
    // Dice badge
    let diceBadge = '';
    if (s.dice) {
      if (s.dice_healing) {
        diceBadge = `<span style="font-size:0.55rem;font-weight:600;background:rgba(34,197,94,0.15);color:var(--success);font-family:monospace;padding:0.1rem 0.25rem;border-radius:3px;flex-shrink:0">${s.dice}</span>`;
      } else if (s.dice_ac) {
        diceBadge = `<span style="font-size:0.55rem;font-weight:600;background:rgba(59,130,246,0.15);color:#3b82f6;font-family:monospace;padding:0.1rem 0.25rem;border-radius:3px;flex-shrink:0">${s.dice}</span>`;
      } else if (s.dice_buff) {
        diceBadge = `<span style="font-size:0.55rem;font-weight:600;background:rgba(139,92,246,0.15);color:#8b5cf6;font-family:monospace;padding:0.1rem 0.25rem;border-radius:3px;flex-shrink:0">${s.dice}</span>`;
      } else {
        diceBadge = `<span style="font-size:0.55rem;font-weight:600;background:var(--accent2);color:var(--accent);font-family:monospace;padding:0.1rem 0.25rem;border-radius:3px;flex-shrink:0">${s.dice}</span>`;
      }
    }
    let ritualBadge = s.ritual ? '<span style="font-size:0.55rem;color:var(--accent);opacity:0.7;flex-shrink:0" title="Ritual">\u26a1</span>' : '';
    let concBadge = s.concentration ? '<span style="font-size:0.55rem;color:var(--warning);opacity:0.8;flex-shrink:0" title="Concentration">\u23f3</span>' : '';
    const bg = isSelected ? 'background:rgba(99,102,241,0.15);' : '';
    // Description body
    let descText = (s.description || '').replace(/'/g, "\\'").replace(/`/g, '\\`').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let timeText = s.casting_time || '1 action';
    let rangeText = s.range || 'Self';
    let durText = s.duration || 'Instantaneous';
    return `<div style="border-bottom:1px solid var(--border);${bg}">
      <div onclick="const b=document.getElementById('${uid}');b.style.display=b.style.display==='none'?'block':'none'" 
        style="padding:0.35rem 0.5rem;cursor:pointer;font-size:0.82rem;display:flex;align-items:center;gap:0.3rem;flex-wrap:wrap">
        <span style="font-size:0.8rem;width:1.2em;text-align:center;flex-shrink:0" onclick="event.stopPropagation();toggleLuSpell('${s.name.replace(/'/g,"\\'")}', ${s.level})">${isSelected ? '\u2705' : '\u2610'}</span>
        <strong style="flex:1 1 auto;min-width:8ch;overflow-wrap:break-word;word-break:break-word">${s.name}</strong>
        ${lvlBadge}
        ${diceBadge}
        ${ritualBadge}
        ${concBadge}
        <span style="font-size:0.65rem;color:var(--text-muted);flex-shrink:0">${s.school||''}</span>
        ${s.book ? _srcBadge(s.book) : ''}
      </div>
      <div id="${uid}" style="display:none;padding:0.3rem 0.5rem 0.5rem 2.2rem;font-size:0.78rem;color:var(--text-muted);line-height:1.5;overflow-wrap:break-word;word-break:break-word">
        <p style="margin:0 0 0.3rem 0">${descText || '<em>No description available.</em>'}</p>
        <p style="margin:0;font-size:0.7rem;display:flex;flex-wrap:wrap;gap:0.5rem">
          <span>\u23f1 ${timeText}</span>
          <span>\ud83c\udfaf ${rangeText}</span>
          <span>\u23f3 ${durText}</span>
          ${s.ritual ? '<span style="color:var(--accent)">\u26a1 Ritual</span>' : ''}
          ${s.concentration ? '<span style="color:var(--warning)">\ud83e\udde0 Concentration</span>' : ''}
        </p>
      </div>
    </div>`;
  }).join('');
  if (shown.length < spells.length) {
    div.innerHTML += `<div style="padding:0.3rem;font-size:0.7rem;color:var(--text-muted);text-align:center">Showing ${shown.length} of ${spells.length} \u2014 type to narrow</div>`;
  }
}

function toggleLuSpell(name, level) {
  const selected = luChoices.spells || [];
  const idx = selected.findIndex(x => x.name === name);
  const needSpells = luData.spells.spells_known_change || 0;
  const needCantrips = luData.spells.cantrips_change || 0;
  const totalNeeded = needSpells + needCantrips;
  
  if (idx >= 0) {
    // Deselect
    selected.splice(idx, 1);
  } else {
    // Check limits
    if (selected.length >= totalNeeded) {
      // Already at max — swap if they click a different one
      return; // Just block for now
    }
    // Check cantrip vs leveled spell counts
    const selCantrips = selected.filter(x => x.level === 0).length;
    const selLeveled = selected.filter(x => x.level > 0).length;
    if (level === 0 && selCantrips >= needCantrips && needCantrips > 0) {
      return; // Already picked enough cantrips
    }
    if (level > 0 && selLeveled >= needSpells && needSpells > 0) {
      return; // Already picked enough leveled spells
    }
    selected.push({name, level});
  }
  
  filterLuSpells();
  renderLuSelected();
  updateLuSpellCount();
}

  }
  if (luChoices.subclass_bonus && luChoices.subclass_bonus.length) {
    html += `<p><strong>Bonus Proficiencies:</strong> ${luChoices.subclass_bonus.join(', ')}</p>`;
  }
  if (luChoices.asi) {
    if (typeof luChoices.asi === 'string' && luChoices.asi.startsWith('feat:')) {
      const featKey = luChoices.asi.substring(5);
      const feat = luData.feats.find(f => f.key === featKey);
      html += `<p><strong>Feat:</strong> ${feat ? feat.name : featKey}</p>`;
    } else if (typeof luChoices.asi === 'object') {
      for (const [a, inc] of Object.entries(luChoices.asi)) {
        html += `<p><strong>ASI:</strong> ${a} +${inc}</p>`;
      }
    }
  }

  el.innerHTML = html;
}

async function applyLevelUp() {
  const btn = document.getElementById('lu-confirm');
  btn.disabled = true;
  btn.textContent = 'Applying...';
  
  const nextLevel = (luData?.current_level || CHAR_LEVEL) + 1;
  const ultimateTarget = luData?._ultimate_target;
  
  try {
    const resp = await fetch(`/api/character/${CHAR_ID}/apply-level-up`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({...luChoices, expertise_skills: (luChoices.expertise || []), fighting_style: (luChoices.fighting_style || ''), metamagic: (luChoices.metamagic || {}), invocations: (luChoices.invocations || []), pact_boon: (luChoices.pact_boon || ''), maneuvers: (luChoices.maneuvers || []), magical_secrets: (luChoices.magical_secrets || []), totem_spirits: (luChoices.totem_spirits || {}), hunters_prey: (luChoices.hunters_prey || ''), favored_enemies: (luChoices.favored_enemies || []), favored_terrains: (luChoices.favored_terrains || []), infusions: (luChoices.infusions || []), class_to_level: luClassToLevel, target_level: nextLevel}),
    });

    if (result.ok) {

      }
    } else {
      alert('Level up failed');

}

async function saveRelationship() {
  const name = document.getElementById('rel-name').value.trim();
  const desc = document.getElementById('rel-desc').value.trim();
  const prompt = document.getElementById('rel-prompt').value.trim();
  if (!name && !desc) { alert('Enter a name or description'); return; }
  const body = {
    name: name || prompt.substring(0, 50),
    relationship_type: document.getElementById('rel-type').value,
    description: desc,
    prompt: prompt,
  };
  if (relGeneratedData) {
    body.npc_data = relGeneratedData.npc_data;
    body.ai_generated = true;
  }
  const isEdit = !!editingRelId;
  const url = isEdit
    ? `/api/character/${CHAR_ID}/relationships/${editingRelId}`
    : `/api/character/${CHAR_ID}/relationships`;
  try {
    await fetch(url, {
      method: isEdit ? 'PUT' : 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body),
    });
    relGeneratedData = null;
    editingRelId = null;
    closeRelModal();
    loadRelationships();
  } catch(e) { console.error(e); }
}

function getHistoryLockKey() {
  const m = window.location.pathname.match(/\/character\/(\d+)/);
  return m ? `history-lock-${m[1]}` : null;
}
function applyHistoryLock(locked) {
  const ta = document.getElementById('history-backstory');
  const btn = document.getElementById('history-lock-btn');
  const tools = document.getElementById('history-tools');
  if (!ta || !btn) return;
  if (locked) {
    ta.readOnly = true;
    ta.style.background = 'var(--bg-muted)';
    ta.style.opacity = '0.7';
    btn.textContent = '🔒';
    btn.title = 'Click to unlock editing';
    if (tools) tools.style.display = 'none';
  } else {
    ta.readOnly = false;
    ta.style.background = 'var(--bg)';
    ta.style.opacity = '1';
    btn.textContent = '🔓';
    btn.title = 'Click to lock editing';
    if (tools) tools.style.display = '';
  }
}
function toggleHistoryLock() {
  const key = getHistoryLockKey();
  if (!key) return;
  const locked = localStorage.getItem(key) === 'true';
  const newVal = !locked;
  localStorage.setItem(key, newVal ? 'true' : 'false');
  applyHistoryLock(newVal);
}
// Restore lock state on page load
(function() {
  const key = getHistoryLockKey();
  if (key && localStorage.getItem(key) === 'true') {
    applyHistoryLock(true);
  }
})();

async function claimFromTeam(itemId, itemName) {
  if (!confirm(`Claim "${itemName}" from the team pool?`)) return;
  try {
    const r = await fetch(`/api/campaign/${CAMPAIGN_ID}/team-items/${itemId}/claim`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({character_id: CHAR_ID}),
      credentials: 'same-origin'
    });
    const d = await r.json();
    if (d.ok) {
      // Instant GP update for currency claims
      if (d.currency && d.gp_added) { CHARACTER_GP += d.gp_added; renderGpDisplay(); }
      // Fallback: client-side parse for older items
      else if (!d.currency) {
        const gpMatch = itemName.match(/(\d[\d,]*)\s*gp/i);
        if (gpMatch) { CHARACTER_GP += parseInt(gpMatch[1].replace(/,/g,'')); renderGpDisplay(); }
      }
      // Refresh team items list
      try { loadTeamItems(); } catch(e) {}
      // Add item to inventory DOM (server already added it to DB)
      if (!d.currency && d.added) {
        addInventoryCard(d.added, d.qty || 1);
        await _flushInventory();
      }
      try { reloadGp(); } catch(e) {}
    } else {
      alert(d.error || 'Failed to claim');
    }
  } catch(e) { alert('Failed to claim item'); }
}

  if (!CAMPAIGN_ID) return;

  try {

  const popup = document.getElementById('gp-popup');

async function adjustGpPopup(mode) {
  const inp = document.getElementById('gp-amount');
  const amt = parseInt(inp.value) || 0;
  if (amt <= 0) return;
  if (mode === 'sub') {
    if (amt > CHARACTER_GP && !confirm(`You only have ${CHARACTER_GP} gp. Subtract all?`)) return;
    CHARACTER_GP = Math.max(0, CHARACTER_GP - amt);
  } else {
    CHARACTER_GP += amt;
  }
  renderGpDisplay();
  inp.value = '';
  await saveGp();
}

async function giftGpToTeam() {
  const inp = document.getElementById('gp-amount');
  const amt = parseInt(inp.value) || 0;
  if (amt <= 0) { alert('Enter an amount to gift'); return; }
  if (amt > CHARACTER_GP) { alert(`You only have ${CHARACTER_GP} gp`); return; }
  if (!confirm(`Gift ${amt} gp to the party pool?`)) return;
  try {
    const r = await fetch(`/api/campaign/${CAMPAIGN_ID}/team-items/add`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({name: `${amt} gp`, qty: 1, gp_value: amt})
    });
    const d = await r.json();
    if (d.ok) {
      CHARACTER_GP -= amt;
      renderGpDisplay();
      await saveGp();
      loadTeamItems();
      inp.value = '';
      closeGpPopup();
    } else {
      alert(d.error || 'Failed to gift');
    }
  } catch(e) { alert('Failed to gift gp'); }
}

    await fetch(`/api/character/${CHAR_ID}/update`, {
      method: 'POST', headers: {'Content-Type':'application/json'},

  const currentLevel = levelEl ? parseInt(levelEl.textContent) : 1;

  dlStep = 0;
  dlChoices = {target_level: null, abilities: null, hp_max: null};
  dlClassToLevel = null;

  // Detect multiclass from CLASS_LEVELS
  const clKeys = Object.keys(CLASS_LEVELS || {});
  const isMulti = clKeys.length > 1;

  dlData = {current_level: currentLevel, is_multiclass: isMulti};

  dlSteps = [];
  if (isMulti) {
    dlSteps.push({label: 'Class', render: renderDlClassPick});
  }
  dlSteps.push({label: 'Target', render: renderDlTarget});

  document.getElementById('dl-title').textContent = '🔻 Level Down';

  const dots = document.getElementById('dl-steps');
  dots.innerHTML = dlSteps.map((s, i) =>
    `<span class="dl-step-dot" id="dl-dot-${i}" style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:0.7rem;font-weight:600;background:var(--bg);border:2px solid var(--border);color:var(--text-muted)">${i+1}</span>`
  ).join(' ');

  document.getElementById('delevel-modal').style.display = 'flex';
  renderDeLevelStep();
}

function closeDeLevel() {
  document.getElementById('delevel-modal').style.display = 'none';
  dlData = null;
}

function deLevelStep(delta) {
  if (delta > 0 && dlStep >= dlSteps.length - 1) return;
  if (delta < 0 && dlStep <= 0) return;
  dlStep += delta;
  renderDeLevelStep();
}

function renderDeLevelStep() {
  const content = document.getElementById('dl-content');
  content.innerHTML = '';

  document.querySelectorAll('.dl-step-dot').forEach((d, i) => {
    d.style.background = i === dlStep ? 'var(--accent)' : (i < dlStep ? 'var(--success)' : 'var(--bg)');
    d.style.borderColor = i === dlStep ? 'var(--accent)' : (i < dlStep ? 'var(--success)' : 'var(--border)');
    d.style.color = i <= dlStep ? '#fff' : 'var(--text-muted)';
  });

  document.getElementById('dl-back').style.display = dlStep > 0 ? '' : 'none';
  document.getElementById('dl-next').style.display = dlStep < dlSteps.length - 1 ? '' : 'none';
  document.getElementById('dl-confirm').style.display = dlStep === dlSteps.length - 1 ? '' : 'none';

  if (dlSteps[dlStep] && dlSteps[dlStep].render) {
    dlSteps[dlStep].render(content);
  }
}

function renderDlClassPick(el) {
  const cl = CLASS_LEVELS || {};
  const lvlDisplay = Object.entries(cl).map(([c, l]) => `${c} ${l}`).join(' / ');

  let html = `<div style="font-size:0.9rem;line-height:1.6">
    <h3 style="margin-bottom:0.5rem">Choose Class to De-Level</h3>
    <p style="color:var(--text-muted);margin-bottom:1rem">Current: <strong>${lvlDisplay}</strong></p>
    <div style="display:flex;flex-direction:column;gap:0.4rem;margin-bottom:0.75rem">`;
  for (const [clsName, clsLvl] of Object.entries(cl)) {
    const checked = dlClassToLevel === clsName;
    html += `<label style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;cursor:pointer">
      <input type="radio" name="dl-class" value="${clsName}" ${checked ? 'checked' : ''} onchange="dlClassToLevel=this.value">
      <strong>${clsName}</strong>
      <span style="font-size:0.75rem;color:var(--text-muted)">Lv ${clsLvl}</span>
    </label>`;
  }
  html += `</div>
    <p style="color:var(--text-muted);font-size:0.8rem">Select which class to remove levels from. The target level you choose next is the character's new total level.</p>
  </div>`;
  el.innerHTML = html;
}

function renderDlTarget(el) {
  const currentLevel = dlData.current_level;
  let html = `<div>
    <p style="margin-bottom:1rem">Select a level to de-level down to:</p>
    <select id="dl-target-select" style="width:100%;padding:0.4rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);margin-bottom:1rem" onchange="dlChoices.target_level=this.value">
      <option value="">— Select target level —</option>`;
  for (let l = 1; l < currentLevel; l++) {
    const sel = dlChoices.target_level == l ? ' selected' : '';
    html += `<option value="${l}"${sel}>Level ${l}</option>`;
  }
  html += `</select>
    <button class="btn btn-primary" onclick="loadDlDataAndAdvance()" style="width:100%">🔍 Load Preview</button>
  </div>`;
  el.innerHTML = html;
}

async function loadDlDataAndAdvance() {
  const target = parseInt(dlChoices.target_level);
  if (!target) { alert('Please select a target level'); return; }

  // If multiclass, require class selection
  if (dlData.is_multiclass && !dlClassToLevel) {
    alert('Please select a class to de-level');
    return;
  }

  const btn = document.querySelector('#dl-content .btn');
  if (btn) { btn.disabled = true; btn.textContent = 'Loading...'; }

  try {
    let url = `/api/character/${CHAR_ID}/de-level-info?target_level=${target}`;
    if (dlClassToLevel) url += `&class_name=${encodeURIComponent(dlClassToLevel)}`;
    const resp = await fetch(url);
    dlData = await resp.json();
    if (dlData.error) { alert(dlData.error); if (btn) { btn.disabled = false; btn.textContent = '🔍 Load Preview'; } return; }
  } catch(e) {
    console.error(e);
    alert('Failed to load de-level info');
    if (btn) { btn.disabled = false; btn.textContent = '🔍 Load Preview'; }
    return;
  }

  dlChoices.hp_max = dlData.hp_estimate;
  dlChoices.abilities = dlData.suggested_abilities ? {...dlData.suggested_abilities} : (dlData.current_abilities ? {...dlData.current_abilities} : null);

  dlSteps = [
    {label: 'Target', render: renderDlTarget},
    {label: 'Preview', render: renderDlPreview}
  ];
  if (dlData.lost_asi_levels && dlData.lost_asi_levels.length > 0) {
    dlSteps.push({label: 'Abilities', render: renderDlAbilities});
  }
  dlSteps.push({label: 'Confirm', render: renderDlConfirm});

  document.getElementById('dl-title').textContent = `🔻 Level Down — L${dlData.current_level} → L${dlData.target_level}`;

  const dots = document.getElementById('dl-steps');
  dots.innerHTML = dlSteps.map((s, i) =>
    `<span class="dl-step-dot" id="dl-dot-${i}" style="display:inline-block;width:24px;height:24px;line-height:24px;text-align:center;border-radius:50%;font-size:0.7rem;font-weight:600;background:var(--bg);border:2px solid var(--border);color:var(--text-muted)">${i+1}</span>`
  ).join(' ');

  dlStep = 1;
  renderDeLevelStep();
}

function renderDlPreview(el) {
  const d = dlData;
  let html = `<div style="font-size:0.9rem;line-height:1.6">
    <p><strong>Class:</strong> ${d.class_name} (losing ${d.levels_lost} level${d.levels_lost > 1 ? 's' : ''})</p>
    <p><strong>New Level:</strong> <span style="color:var(--danger)">${d.target_level}</span></p>
    <p><strong>HP Estimate:</strong> ${d.hp_estimate} (${d.hp_per_level_avg} avg/level × ${d.levels_lost} levels lost)</p>`;

  if (d.features_lost && d.features_lost.length) {
    html += `<p><strong>Features Lost:</strong></p><ul>`;
    d.features_lost.forEach(f => html += `<li style="color:var(--danger)">${f}</li>`);
    html += `</ul>`;
  }

  if (d.proficiency_bonus && d.proficiency_bonus.changed) {
    html += `<p><strong>Proficiency Bonus:</strong> +${d.proficiency_bonus.old} → <span style="color:var(--danger)">+${d.proficiency_bonus.new}</span></p>`;
  }

  if (d.subclass_note) {
    html += `<p style="color:var(--warn)"><strong>⚠ Subclass:</strong> ${d.subclass_note}</p>`;
  }

  if (d.lost_asi_levels && d.lost_asi_levels.length) {
    html += `<p style="color:var(--warn)"><strong>⚠ ASI Levels Lost:</strong> ${d.lost_asi_levels.map(l => 'L' + l).join(', ')} — You'll need to revert ability score changes on the next step.</p>`;
  }

  html += `</div>`;
  el.innerHTML = html;
}

function renderDlAbilities(el) {
  const abilities = dlData.current_abilities;
  if (!abilities) { el.innerHTML = '<p>No ability data available.</p>'; return; }

  if (!dlChoices.abilities) dlChoices.abilities = {...abilities};

  let html = `<div>
    <p style="font-weight:600;margin-bottom:0.75rem">Revert Ability Scores</p>
    <p style="font-size:0.85rem;color:var(--text-muted);margin-bottom:1rem">These levels included ASI improvements. Adjust ability scores down to what they were before those levels.</p>
    <button class="btn btn-outline btn-sm" onclick="resetDlAbilities()" style="margin-bottom:1rem">🔄 Reset to Current</button>`;

  for (const [name, value] of Object.entries(abilities)) {
    const currentVal = dlChoices.abilities[name] !== undefined ? dlChoices.abilities[name] : value;
    html += `<div style="display:flex;align-items:center;gap:0.5rem;margin-bottom:0.5rem">
      <label style="width:100px;font-weight:600">${name}</label>
      <input type="number" min="1" max="30" value="${currentVal}"
        onchange="dlChoices.abilities['${name}']=parseInt(this.value)||0"
        style="width:80px;padding:0.35rem;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);text-align:center">
    </div>`;
  }

  html += `</div>`;
  el.innerHTML = html;
}

function resetDlAbilities() {
  if (dlData && dlData.current_abilities) {
    dlChoices.abilities = {...dlData.current_abilities};
    renderDeLevelStep();
  }
}

function renderDlConfirm(el) {
  const d = dlData;
  let html = `<div style="font-size:0.9rem;line-height:1.6">
    <h3 style="margin-bottom:0.75rem">Confirm De-Level</h3>
    <p><strong>Class:</strong> ${d.class_name}</p>
    <p><strong>Level:</strong> ${d.current_level} → <span style="color:var(--danger)">${d.target_level}</span> (lose ${d.levels_lost} level${d.levels_lost > 1 ? 's' : ''})</p>
    <p><strong>HP:</strong> → ${dlChoices.hp_max}</p>`;

  if (d.features_lost && d.features_lost.length) {
    html += `<p><strong>Features Lost:</strong> ${d.features_lost.join(', ')}</p>`;
  }

  if (d.proficiency_bonus && d.proficiency_bonus.changed) {
    html += `<p><strong>Proficiency:</strong> +${d.proficiency_bonus.old} → +${d.proficiency_bonus.new}</p>`;
  }

  if (dlChoices.abilities && d.lost_asi_levels && d.lost_asi_levels.length) {
    html += `<p><strong>Adjusted Abilities:</strong></p>`;
    for (const [name, value] of Object.entries(dlChoices.abilities)) {
      const orig = d.current_abilities[name];
      if (value !== orig) {
        html += `<p style="margin-left:1rem">${name}: ${orig} → <span style="color:var(--danger)">${value}</span></p>`;
      }
    }
  }

  html += `<p style="color:var(--warn);font-size:0.8rem;margin-top:1rem">⚠ This cannot be undone. HP will be fully restored. All features and spells from lost levels will be removed.</p>`;
  html += `</div>`;
  el.innerHTML = html;
}

async function applyDeLevel() {
  const btn = document.getElementById('dl-confirm');
  btn.disabled = true;
  btn.textContent = 'Applying...';

  try {
    const payload = {...dlChoices};
    if (dlClassToLevel) payload.class_to_level = dlClassToLevel;
    const resp = await fetch(`/api/character/${CHAR_ID}/de-level`, {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload),
    });
    const result = await resp.json();
    if (result.ok) {
      alert(`De-Level complete! ${result.changes.join(', ')}`);
      location.reload();
    } else {
      alert('De-level failed: ' + (result.error || 'Unknown error'));
      btn.disabled = false;
      btn.textContent = '✅ Confirm De-Level';
    }
  } catch(e) {
    console.error(e);
    btn.disabled = false;
    btn.textContent = '✅ Confirm De-Level';
  }
}

// ══════ SUMMONS ══════
const SUMMON_TEMPLATES = {{ summon_templates|tojson }};
let characterSummons = {{ character.summons|tojson }};
let _lastMonsterData = null;   // captured from monster API during fill
let _lastTemplateKey = null;   // template key for addSummon to reference

function toggleSummonBody(chip) {
  const body = chip.querySelector('.summon-body');
  if (body) body.style.display = body.style.display === 'none' ? 'block' : 'none';
}

async function saveSummons() {
  await fetch(`/api/character/${CHAR_ID}/update`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({summons: JSON.stringify(characterSummons)}),
  });
}

async function applySummonHP(idx, sign) {
  const deltaEl = document.getElementById('summon-hp-delta-' + idx);
  const raw = parseInt(deltaEl.value) || 1;
  const delta = sign === -1 ? -raw : raw;
  let hp = characterSummons[idx].hp_current + delta;
  hp = Math.max(0, hp);  // floor at 0, allow over max
  characterSummons[idx].hp_current = hp;

  // Update DOM — bar fill + hp text on the collapsed chip
  const chip = document.querySelector(`.summon-chip[data-summon-id="${idx}"]`);
  if (chip) {
    const barFill = chip.querySelector('.summon-bar-fill');
    const hpText = chip.querySelector('.summon-hp-text');
    if (barFill && characterSummons[idx].hp_max) {
      const pct = hp / characterSummons[idx].hp_max * 100;
      barFill.style.width = pct + '%';
      barFill.style.background = pct > 50 ? 'var(--success)' : pct > 25 ? 'var(--warn)' : 'var(--danger)';
    }
    if (hpText) hpText.textContent = hp + '/' + characterSummons[idx].hp_max;
  }

  await saveSummons();
}

async function resetSummonHP(idx) {
  const hp = characterSummons[idx].hp_max;
  characterSummons[idx].hp_current = hp;

  const chip = document.querySelector(`.summon-chip[data-summon-id="${idx}"]`);
  if (chip) {
    const barFill = chip.querySelector('.summon-bar-fill');
    const hpText = chip.querySelector('.summon-hp-text');
    if (barFill) { barFill.style.width = '100%'; barFill.style.background = 'var(--success)'; }
    if (hpText) hpText.textContent = hp + '/' + hp;
  }

  await saveSummons();
}

async function saveSummonName(idx) {
  const chip = document.querySelector(`.summon-chip[data-summon-id="${idx}"]`);
  if (!chip) return;
  const mainInput = chip.querySelector('.summon-edit-main-name');
  const nameInput = chip.querySelector('.summon-edit-name');
  if (!mainInput || !nameInput) return;

  characterSummons[idx].main_name = mainInput.value;
  characterSummons[idx].name = nameInput.value || 'Unnamed';

  // Update chip header display
  const headerSpan = chip.querySelector('div:first-child > span:first-child');
  if (headerSpan) {
    const mn = characterSummons[idx].main_name;
    const nm = characterSummons[idx].name;
    if (mn && nm) {
      headerSpan.innerHTML = mn + ` <span style="color:var(--text-muted);font-weight:400;font-size:0.65rem">(` + nm + `)</span>`;
    } else {
      headerSpan.textContent = mn || nm;
    }
  }

  await saveSummons();
}

async function dismissSummon(idx) {
  const label = characterSummons[idx].main_name || characterSummons[idx].name;
  if (!confirm(`Dismiss ${label}?`)) return;
  characterSummons.splice(idx, 1);
  await saveSummons();
  location.reload();
}
