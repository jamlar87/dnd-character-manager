// ── Source reference: click 📚 badge → open PDF ──
const SOURCE_SLUG_MAP = {{ source_map_json|safe }};
function _srcBadge(src) {
  if (!src) return '';
  // Keep the full source text including page number for accuracy
  const short = src.length > 30 ? src.replace(/\s+\d{4}$/, '').trim() : src;
  return `<span class="src-badge" onclick="openSourceRef(this.dataset.src)" data-src="${src.replace(/"/g, '&quot;')}" title="Click to open ${src}">📚 ${short}</span>`;
}
function openSourceRef(src) {
  if (!src || src.startsWith('SRD')) return;
  const pageMatch = src.match(/\b[pP]\.?\s*(\d+)/);
  const page = pageMatch ? parseInt(pageMatch[1]) : 0;
  let bookPart = src.replace(/\s+[pP]\.?\s*\d+.*$/, '').replace(/\s+\d{4}$/, '').trim();
  // Try slug match first (e.g., "PHB", "DMG")
  for (const [slug, info] of Object.entries(SOURCE_SLUG_MAP)) {
    if (slug.toLowerCase() === bookPart.toLowerCase()) {
      window.open(`/api/reference/open/${slug}${page?'?page='+page+'#page='+page:''}`, '_blank');
      return;
    }
  }
  // Try display name match
  for (const [slug, info] of Object.entries(SOURCE_SLUG_MAP)) {
    if (info.display.toLowerCase() === bookPart.toLowerCase()) {
      window.open(`/api/reference/open/${slug}${page?'?page='+page+'#page='+page:''}`, '_blank');
      return;
    }
  }
  // Fallback: substring match
  for (const [slug, info] of Object.entries(SOURCE_SLUG_MAP)) {
    if (info.display.toLowerCase().includes(bookPart.toLowerCase()) || bookPart.toLowerCase().includes(info.display.toLowerCase())) {
      window.open(`/api/reference/open/${slug}${page?'?page='+page+'#page='+page:''}`, '_blank');
      return;
    }
  }
}

// ── Ability Score Editor Popover ───────────────────────────────────────
function showAbilityEditor(statKey, statLabel, currentScore) {
  if (!document.body.classList.contains('edit-mode')) return;

  // Remove any existing editor
  document.querySelectorAll('.ability-editor-overlay').forEach(o => o.remove());

  let score = parseInt(currentScore) || 10;

  const overlay = document.createElement('div');
  overlay.className = 'ability-editor-overlay';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const card = document.createElement('div');
  card.className = 'ability-editor-card';

  function render() {
    const mod = Math.floor((score - 10) / 2);
    const modStr = mod >= 0 ? '+' + mod : '' + mod;
    let modClass = 'zero';
    if (mod > 0) modClass = 'positive';
    else if (mod < 0) modClass = 'negative';
    const statNames = {strength:'Strength',dexterity:'Dexterity',constitution:'Constitution',
      intelligence:'Intelligence',wisdom:'Wisdom',charisma:'Charisma'};
    const fullName = statNames[statKey] || statKey;

    card.innerHTML = [
      '<h3>' + statLabel + ' — ' + fullName + '</h3>',
      '<div class="ae-mod-preview ' + modClass + '">' + modStr + '</div>',
      '<div class="ability-editor-stepper">',
      '  <button id="ae-minus"' + (score <= 1 ? ' disabled style="opacity:0.3"' : '') + '>−</button>',
      '  <span class="ae-score-display" id="ae-score-text">' + score + '</span>',
      '  <button id="ae-plus"' + (score >= 30 ? ' disabled style="opacity:0.3"' : '') + '>+</button>',
      '</div>',
      '<div class="ability-editor-actions">',
      '  <button class="ae-cancel">Cancel</button>',
      '  <button class="ae-save">Save</button>',
      '</div>'
    ].join('');

    // Score display — click to type directly
    card.querySelector('#ae-score-text').addEventListener('click', () => {
      const input = document.createElement('input');
      input.type = 'number';
      input.min = 1; input.max = 30;
      input.className = 'ae-score-input';
      input.value = score;
      const display = card.querySelector('#ae-score-text');
      display.replaceWith(input);
      input.focus();
      input.select();
      input.addEventListener('blur', () => {
        score = Math.max(1, Math.min(30, parseInt(input.value) || score));
        render();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') input.blur();
      });
    });

    card.querySelector('#ae-minus').onclick = () => { score = Math.max(1, score - 1); render(); };
    card.querySelector('#ae-plus').onclick = () => { score = Math.min(30, score + 1); render(); };
    card.querySelector('.ae-cancel').onclick = () => overlay.remove();
    card.querySelector('.ae-save').onclick = async () => {
      // Update DOM
      const abEl = document.querySelector(`.ab-score[data-ability="${statKey}"]`);
      if (abEl) abEl.textContent = score;
      // Update modifier display in ability box
      const abBox = abEl ? abEl.closest('.ability-box') : null;
      if (abBox) {
        const modEl = abBox.querySelector('.ab-mod');
        const newMod = Math.floor((score - 10) / 2);
        if (modEl) modEl.textContent = (newMod >= 0 ? '+' : '') + newMod;
      }
      // Update client cache + recalc
      ABILITY_SCORES[statKey] = score;
      recalcAllDerived();
      // Persist to server
      try { await api('/update', { [statKey]: score }); } catch(e) { console.error(e); }
      overlay.remove();
    };
  }

  render();
  overlay.appendChild(card);
  document.body.appendChild(overlay);
}

// ── Recalculate all values that depend on ability scores ────────────────
function recalcAllDerived() {
  const scores = ABILITY_SCORES;
  const abMod = (ab) => Math.floor((scores[ab] - 10) / 2);
  const prof = CHAR_PROF_BONUS;

  // Update saving throws in sidebar
  document.querySelectorAll('.save-row').forEach(row => {
    const statDot = row.querySelector('.save-dot');
    if (!statDot) return;
    const stat = statDot.dataset.stat;
    if (!stat || !(stat in scores)) return;
    const mod = abMod(stat);
    const hasProf = statDot.classList.contains('active');
    const val = mod + (hasProf ? prof : 0);
    const valEl = row.querySelector('.stat-val');
    if (valEl) {
      valEl.textContent = (val >= 0 ? '+' : '') + val;
      valEl.style.color = hasProf ? 'var(--accent)' : 'var(--text-muted)';
    }
  });

  // Update skills in sidebar
  document.querySelectorAll('.stat-row .skill-dot').forEach(dot => {
    const skillName = dot.dataset.skill;
    const ability = SKILL_AB_MAP[skillName];
    if (!ability || !(ability in scores)) return;
    const mod = abMod(ability);
    const hasProf = dot.classList.contains('active');
    const val = mod + (hasProf ? prof : 0);
    const row = dot.closest('.stat-row');
    if (row) {
      const valEl = row.querySelector('.stat-val');
      if (valEl) {
        valEl.textContent = (val >= 0 ? '+' : '') + val;
        valEl.style.color = hasProf ? 'var(--accent)' : 'var(--text-muted)';
      }
    }
  });

  // Update passive perception
  const ppEl = document.querySelector('.sense-val.editable[data-field="passive_perception"]');
  if (ppEl) {
    const wisMod = abMod('wisdom');
    const hasPercProf = CHAR_SKILLS.includes('Perception');
    ppEl.textContent = 10 + wisMod + (hasPercProf ? prof : 0);
  }

  // Update passive investigation (non-editable span)
  const piRow = [...document.querySelectorAll('.sense-row')].find(r => r.textContent.includes('Passive Investigation'));
  if (piRow) {
    const piVal = piRow.querySelector('.sense-val');
    if (piVal) {
      const intMod = abMod('intelligence');
      const hasInvProf = CHAR_SKILLS.includes('Investigation');
      piVal.textContent = 10 + intMod + (hasInvProf ? prof : 0);
    }
  }

  // Update passive insight
  const pInsRow = [...document.querySelectorAll('.sense-row')].find(r => r.textContent.includes('Passive Insight'));
  if (pInsRow) {
    const pInsVal = pInsRow.querySelector('.sense-val');
    if (pInsVal) {
      const wisMod = abMod('wisdom');
      const hasInsProf = CHAR_SKILLS.includes('Insight');
      pInsVal.textContent = 10 + wisMod + (hasInsProf ? prof : 0);
    }
  }
}

    el.style.cursor = 'default';

  });

    const isEdit = document.body.classList.contains('edit-mode');
    document.querySelectorAll('.ab-score[data-ability]').forEach(el => {
      el.style.cursor = isEdit ? 'pointer' : 'default';
    });
  });
  observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });
}

// ── HP (updates both sidebar mini and bar) ──
async function applyHP(sign) {
  const deltaEl = document.getElementById('hp-delta');
  const raw = parseInt(deltaEl.value) || 1;
  const delta = sign === -1 ? -raw : raw;
  const curEl = document.getElementById('hp-cur');
  let hp = parseInt(curEl.textContent) + delta;
  // Can go above max, but floor at 0
  hp = Math.max(0, hp);
  curEl.textContent = hp;
  const pct = Math.min(hp, HP_MAX) / HP_MAX * 100;
  ['hp-bar-side'].forEach(id => {
    const bar = document.getElementById(id);
    if (bar) {
      bar.style.width = pct + '%';
      bar.classList.toggle('danger', hp > 0 && pct < 25);
      bar.classList.toggle('warn', hp > 0 && pct >= 25 && pct < 50);
    }
  });
  // Auto-expand death saves when HP hits 0
  if (hp === 0) {
    const dsBody = document.getElementById('ds-body');
    if (dsBody) {
      dsBody.style.display = 'block';
      document.getElementById('ds-toggle').textContent = '▾';
    }
  }
  await api('/update', { hp_current: hp });
}

async function resetHP() {
  const curEl = document.getElementById('hp-cur');
  const hp = HP_MAX;
  curEl.textContent = hp;
  ['hp-bar-side'].forEach(id => {
    const bar = document.getElementById(id);
    if (bar) {
      bar.style.width = '100%';
      bar.classList.remove('danger', 'warn');
    }
  });
  await api('/update', { hp_current: hp });
}

// ── Export / Import JSON (backup + transfer) ──
async function exportCharacter() {
  try {
    const r = await fetch('/api/character/' + CHAR_ID + '/export');
    if (!r.ok) { alert('Export failed (' + r.status + ')'); return; }
    const blob = await r.blob();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const cd = r.headers.get('Content-Disposition') || '';
    const m = cd.match(/filename="?([^";]+)"?/);
    a.download = m ? m[1] : 'character.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  } catch (e) {
    alert('Export error: ' + e.message);
  }
}
async function importCharacterFile(file) {
  if (!file) return;
  const text = await file.text();
  let data;
  try { data = JSON.parse(text); } catch (e) { alert('Not valid JSON'); return; }
  if (!data.character) { alert('Not a character export file'); return; }
  if (!confirm('Import "' + (data.character.name || 'character') + '" as a new character?')) return;
  const r = await fetch('/api/character/import', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  const res = await r.json().catch(() => ({}));
  if (r.ok && res.id) {
    alert('Imported "' + res.name + '"');
    location.href = '/character/' + res.id;
  } else {
    alert('Import failed: ' + (res.error || r.status));
  }
}

// ── HP Sync Polling (sheet ↔ combat cross-sync) ──
async function syncSheetHP() {
  try {
    const resp = await fetch('/api/sync-combat-hp', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({char_ids: [CHAR_ID]})
    });
    if (!resp.ok) return;
    const data = await resp.json();
    const info = data.characters && data.characters[String(CHAR_ID)];
    if (!info) return;

    // ── Player HP ──
    const curEl = document.getElementById('hp-cur');
    if (curEl && info.hp_current !== parseInt(curEl.textContent)) {
      const hp = info.hp_current;
      curEl.textContent = hp;
      const pct = Math.min(hp, HP_MAX) / HP_MAX * 100;
      ['hp-bar-side'].forEach(id => {
        const bar = document.getElementById(id);
        if (bar) {
          bar.style.width = pct + '%';
          bar.classList.toggle('danger', hp > 0 && pct < 25);
          bar.classList.toggle('warn', hp > 0 && pct >= 25 && pct < 50);
        }
      });
    }

    // ── Summons HP ──
    if (characterSummons && info.summons) {
      for (let i = 0; i < characterSummons.length; i++) {
        const srv = info.summons[i];
        const local = characterSummons[i];
        if (!srv || !local) continue;
        if (srv.hp_current !== local.hp_current) {
          local.hp_current = srv.hp_current;
          // Update DOM
          const chip = document.querySelector(`.summon-chip[data-summon-id="${i}"]`);
          if (chip) {
            const barFill = chip.querySelector('.summon-bar-fill');
            const hpText = chip.querySelector('.summon-hp-text');
            if (barFill && local.hp_max) {
              const pct = srv.hp_current / local.hp_max * 100;
              barFill.style.width = pct + '%';
              barFill.style.background = pct > 50 ? 'var(--success)' : pct > 25 ? 'var(--warn)' : 'var(--danger)';
            }
            if (hpText) hpText.textContent = srv.hp_current + '/' + local.hp_max;
          }
        }
      }
    }
    // ── Conditions ──
    if (info.conditions) {
      const srvConds = JSON.stringify(info.conditions);
      const localConds = JSON.stringify(_lastConditions || []);
      if (srvConds !== localConds) {
        _lastConditions = info.conditions;
        renderConditions(info.conditions);
      }
    }
  } catch(e) { /* silent */ }
}

function startSheetPolling() {
  stopSheetPolling();
  _sheetPollTimer = setInterval(syncSheetHP, 2000);
}

function stopSheetPolling() {
  if (_sheetPollTimer) {
    clearInterval(_sheetPollTimer);
    _sheetPollTimer = null;
  }
}

async function addCondition(name, desc) {
  if (!name) return;
  try {
    const r = await fetch('/api/character/'+CHAR_ID+'/conditions', {
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name,description:desc||'',source:''})
    });
    const d = await r.json();
    renderConditions(d.conditions);
  } catch(e) { /* silent */ }
}

async function dismissCondition(name) {
  try {
    const r = await fetch('/api/character/'+CHAR_ID+'/conditions', {
      method:'DELETE',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({name:name})
    });
    const d = await r.json();
    renderConditions(d.conditions);
  } catch(e) { /* silent */ }
}

function renderConditions(conditions) {
  const container = document.getElementById('condition-badges');
  if (!container) return;
  if (!conditions || !conditions.length) {
    container.innerHTML = '<span style="font-size:0.6rem;color:var(--text-muted);opacity:0.5">None</span>';
    return;
  }
  let html = '';
  for (const c of conditions) {
    const style = CONDITION_COLORS[c.name] || 'var(--accent);color:#fff;border-color:var(--accent)';
    html += '<span class="cond-badge" style="background:'+style.split(';')[0]+';'+style.split(';')[1]+'" data-name="'+c.name+'" onclick="toggleConditionDetail(event,\''+c.name+'\',\''+(c.description||'').replace(/'/g,"\\'")+'\')">'+c.name+'<span class="dismiss" onclick="event.stopPropagation();dismissCondition(\''+c.name+'\')">✕</span></span>';
  }
  container.innerHTML = html;
}

function toggleConditionDetail(event, name, desc) {
  event.stopPropagation();
  // Remove any existing popouts
  document.querySelectorAll('.cond-detail-popout').forEach(el => el.remove());
  const badge = event.currentTarget;
  const popout = document.createElement('div');
  popout.className = 'cond-popout cond-detail-popout';
  popout.innerHTML = '<strong style="color:'+(CONDITION_COLORS[name]||'var(--text)').split(';')[0]+'">'+name+'</strong><div class="cond-desc">'+desc+'</div><button class="cond-dismiss" onclick="dismissCondition(\''+name+'\');this.parentElement.remove()">Remove</button>';
  document.body.appendChild(popout);
  const rect = badge.getBoundingClientRect();
  popout.style.left = (rect.left) + 'px';
  popout.style.top = (rect.bottom + 4) + 'px';
  // Dismiss on click outside the popout
  document.addEventListener('click', function _dismissOut(e) {
    if (!popout.isConnected) {
      document.removeEventListener('click', _dismissOut);
      return;
    }
    if (!popout.contains(e.target)) {
      popout.remove();
      document.removeEventListener('click', _dismissOut);
    }
  });
}

async function spendHitDice() {
  const remaining = HD_TOTAL - hdUsed;
  if (remaining <= 0) {
    showHDResult('No Hit Dice remaining. Take a Long Rest to recover some.', false);
    return;
  }
  const roll = Math.floor(Math.random() * HD_DIE) + 1;
  const heal = roll + CON_MOD;
  const gain = Math.max(0, heal);

  // Update HP
  const curEl = document.getElementById('hp-cur');
  const hp = Math.min(parseInt(curEl.textContent) + gain, HP_MAX);
  curEl.textContent = hp;

  // Update HP bar
  const pct = HP_MAX > 0 ? (hp / HP_MAX * 100) : 0;
  const bar = document.getElementById('hp-bar-side');
  if (bar) {
    bar.style.width = pct + '%';
    bar.classList.toggle('danger', hp > 0 && pct < 25);
    bar.classList.toggle('warn', hp > 0 && pct >= 25 && pct < 50);
  }

  // Increment used counter
  hdUsed++;
  const remainEl = document.getElementById('hd-remaining');
  if (remainEl) remainEl.textContent = HD_TOTAL - hdUsed;

  // API call
  await api('/update', { hp_current: hp, hit_dice_used: hdUsed });

  showHDResult(`Rolled ${roll} on d${HD_DIE} + ${CON_MOD} = ${heal} HP regained (${remaining - 1} HD remaining)`, true);
}

async function executeLongRest() {
  // 1. Restore HP to max
  const hp = HP_MAX;
  const curEl = document.getElementById('hp-cur');
  curEl.textContent = hp;
  const pct = HP_MAX > 0 ? 100 : 0;
  const bar = document.getElementById('hp-bar-side');
  if (bar) {
    bar.style.width = pct + '%';
    bar.classList.remove('danger', 'warn');
  }

  // 2. Recover up to half total Hit Dice
  const recover = Math.max(1, Math.floor(HD_TOTAL / 2));
  const newUsed = Math.max(0, hdUsed - recover);
  const recovered = hdUsed - newUsed;

  hdUsed = newUsed;
  const remainEl = document.getElementById('hd-remaining');
  if (remainEl) remainEl.textContent = HD_TOTAL - hdUsed;

  // 3. Reset death saves
  const dsSuccessDots = document.querySelectorAll('#ds-body .ds-dot.filled-success');
  const dsFailDots = document.querySelectorAll('#ds-body .ds-dot.filled-fail');
  dsSuccessDots.forEach(d => d.classList.remove('filled-success'));
  dsFailDots.forEach(d => d.classList.remove('filled-fail'));

  // 4. Reset spell slots — clear all level-based and per-spell used dots
  document.querySelectorAll('.slot-box.used').forEach(d => d.classList.remove('used'));

  // Reset per-spell slots_used in DB — collect all spell IDs and reset to 0
  const spellSlotElements = document.querySelectorAll('[id^="sp-slots-"]');
  const spellResets = [];
  spellSlotElements.forEach(el => {
    const id = el.id.replace('sp-slots-', '');
    if (id) spellResets.push({ id: parseInt(id), slots_used: 0 });
  });

  // 5. Reset limited-use class features (Channel Divinity, Rage, etc.)
  resetAllFeatureUses();

  // 6. Reduce exhaustion by 1 (floor at 0) — also in DB
  const exhaustionEl = document.querySelector('#hd-body [style*="font-size:0.78rem"]');
  // We track it in the DB update below

  // API: update HP, hit_dice_used, death saves reset, spell slots, exhaustion
  await api('/update', {
    hp_current: hp,
    hit_dice_used: hdUsed,
    death_saves_success: 0,
    death_saves_fail: 0,
    spell_slots_used: JSON.stringify({}),
    spells: spellResets
  });

  // Save reset feature uses to DB separately
  await api('/update', { feature_data: JSON.stringify(featureData) });

  // Reset Magic Initiate 1/day uses — update DOM directly so it reflects immediately
  try {
    await fetch('/api/character/' + CHAR_ID + '/magic-initiate/reset', { method: 'POST', headers: {'Content-Type':'application/json'}, body: '{}' });
    // Update the Magic Initiate card button on the spells tab
    const miCard = document.getElementById('mi-spells-card');
    if (miCard) {
      const btn = miCard.querySelector('button');
      if (btn) {
        btn.textContent = 'Available';
        btn.style.background = 'var(--success)';
      }
    }
    // Also update passive chip buttons (features tab)
    document.querySelectorAll('.passive-chip-body button').forEach(btn => {
      if (btn.textContent.trim() === 'Used ✓') {
        btn.textContent = 'Available';
        btn.style.background = 'var(--success)';
      }
    });
  } catch(e) {}

  // Show result notification
  const hdResult = document.getElementById('hd-result');
  if (hdResult) {
    const lines = [];
    lines.push(`Restored ${HP_MAX} HP`);
    if (recovered > 0) lines.push(`Recovered ${recovered} Hit Dice`);
    lines.push('Reset Death Saves, Spell Slots, Class Features');
    hdResult.textContent = 'Long Rest complete — ' + lines.join(', ');
    hdResult.style.display = 'block';
    hdResult.style.borderColor = 'var(--success)';
    hdResult.style.background = 'rgba(0,200,83,0.05)';
  }
}

// ── Short Rest ──
let _srRolls = [];  // module-level roll storage

function shortRestConfirm() {
  const curHp = parseInt(document.getElementById('hp-cur').textContent);
  const hpMissing = HP_MAX - curHp;
  const available = HD_TOTAL - hdUsed;
  _srRolls = [];
  let diceToSpend = Math.min(available, Math.max(0, Math.ceil(hpMissing / (HD_DIE / 2 + 2))));
  if (diceToSpend < 0) diceToSpend = 0;

  if (available <= 0 && hpMissing <= 0) {
    doShortRest(0, []);
    return;
  }

  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:9999;display:flex;align-items:center;justify-content:center';
  overlay.onclick = (e) => { if (e.target === overlay) overlay.remove(); };

  const modal = document.createElement('div');
  modal.style.cssText = 'background:var(--card-bg);border:1px solid var(--border);border-radius:12px;padding:1.5rem;max-width:420px;width:90%;box-shadow:0 8px 32px rgba(0,0,0,0.4)';

  function render() {
    const canSpend = Math.min(available, Math.max(0, diceToSpend));
    let totalHeal = 0;
    const rollDetails = _srRolls.map((r) => {
      const hv = r + Math.max(0, CON_MOD);
      totalHeal += hv;
      return `<span style="color:var(--success)">d${HD_DIE}: ${r} + ${Math.max(0, CON_MOD)} = ${hv}</span>`;
    }).join(', ');

    const finalHp = Math.min(HP_MAX, curHp + totalHeal);
    const actualHeal = finalHp - curHp;

    modal.innerHTML = `
      <div style="font-size:1.2rem;font-weight:700;margin-bottom:0.75rem;display:flex;align-items:center;gap:0.5rem">
        <span>☕</span> Short Rest
      </div>
      <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:0.5rem">
        <div style="margin-bottom:0.4rem;display:flex;justify-content:space-between;align-items:center">
          <span>Spend Hit Dice:</span>
          <div style="display:flex;gap:0.3rem;align-items:center">
            <button class="sr-adjust" data-delta="-1" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-weight:700;font-size:1rem">−</button>
            <span style="font-weight:700;font-size:1.1rem;color:var(--text);min-width:2rem;text-align:center">${canSpend}</span>
            <button class="sr-adjust" data-delta="+1" style="width:28px;height:28px;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-weight:700;font-size:1rem">+</button>
            <button class="sr-max" style="padding:0.2rem 0.5rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text-muted);cursor:pointer;font-size:0.65rem">Max</button>
          </div>
        </div>
        <div style="margin-bottom:0.4rem;font-size:0.75rem">
          Available: <strong style="color:var(--text)">${available}</strong> d${HD_DIE} · Con mod: <strong style="color:var(--text)">+${Math.max(0, CON_MOD)}</strong>
        </div>
        ${_srRolls.length > 0 ? `
          <div style="margin-bottom:0.4rem;padding:0.35rem;background:var(--bg);border-radius:6px;border:1px solid var(--border);font-size:0.78rem;line-height:1.6">
            <div style="color:var(--text-muted);font-size:0.65rem;margin-bottom:0.15rem">Roll results:</div>
            ${rollDetails}
            <div style="margin-top:0.3rem;border-top:1px solid var(--border);padding-top:0.3rem;font-weight:600">
              Total heal: <strong style="color:var(--success)">+${actualHeal} HP</strong>
              <span style="color:var(--text-muted);font-weight:400"> (${curHp} → ${finalHp})</span>
            </div>
          </div>
        ` : ''}
        <div style="margin-top:0.4rem;display:flex;gap:0.25rem;">
          ${canSpend > 0 ? `<button id="sr-roll-btn" style="padding:0.3rem 0.8rem;border-radius:6px;border:none;background:var(--accent);color:#fff;cursor:pointer;font-weight:600;font-size:0.8rem">🎲 Roll ${canSpend} HD</button>` : ''}
          <button id="sr-skip-btn" style="padding:0.3rem 0.8rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:0.8rem">Skip Rolls</button>
        </div>
      </div>
      <div style="margin-bottom:0.5rem;font-size:0.75rem;color:var(--text-muted);opacity:0.7">
        • Short rest: at least 1 hour of downtime<br>
        • Reset features &amp; spell slots (Channel Divinity, Action Surge, Ki, Pact Magic, etc.)
      </div>
      <div style="display:flex;gap:0.5rem;justify-content:flex-end">
        <button id="sr-cancel-btn" style="padding:0.4rem 1rem;border-radius:6px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer">Cancel</button>
        <button id="sr-confirm-btn" style="padding:0.4rem 1rem;border-radius:6px;border:none;background:var(--success);color:#fff;cursor:pointer;font-weight:600">Take Short Rest</button>
      </div>
    `;

    // Wire event listeners
    modal.querySelectorAll('.sr-adjust').forEach(btn => {
      btn.onclick = () => {
        diceToSpend = Math.max(0, Math.min(available, diceToSpend + parseInt(btn.dataset.delta)));
        render();
      };
    });
    modal.querySelector('.sr-max').onclick = () => { diceToSpend = available; render(); };
    const rollBtn = modal.querySelector('#sr-roll-btn');
    if (rollBtn) rollBtn.onclick = () => {
      const n = Math.min(available, Math.max(0, diceToSpend));
      for (let i = 0; i < n; i++) {
        _srRolls.push(Math.floor(Math.random() * HD_DIE) + 1);
      }
      diceToSpend = 0;
      render();
    };
    modal.querySelector('#sr-skip-btn').onclick = () => { overlay.remove(); doShortRest(0, _srRolls); };
    modal.querySelector('#sr-cancel-btn').onclick = () => overlay.remove();
    modal.querySelector('#sr-confirm-btn').onclick = () => {
      const healAmt = _srRolls.reduce((s, r) => s + r + Math.max(0, CON_MOD), 0);
      overlay.remove();
      doShortRest(healAmt, _srRolls);
    };
  }

  render();
  overlay.appendChild(modal);
  document.body.appendChild(overlay);
}

async function doShortRest(healed, rolls) {
  const curHp = parseInt(document.getElementById('hp-cur').textContent);
  const newHp = Math.min(HP_MAX, curHp + healed);
  const diceUsed = rolls ? rolls.length : 0;

  // Apply HP
  const curEl = document.getElementById('hp-cur');
  curEl.textContent = newHp;
  const pct = HP_MAX > 0 ? (newHp / HP_MAX * 100) : 0;
  const bar = document.getElementById('hp-bar-side');
  if (bar) {
    bar.style.width = pct + '%';
    bar.classList.toggle('danger', newHp > 0 && pct < 25);
    bar.classList.toggle('warn', newHp > 0 && pct >= 25 && pct < 50);
  }

  // Update Hit Dice used
  if (diceUsed > 0) {
    hdUsed += diceUsed;
    const remainEl = document.getElementById('hd-remaining');
    if (remainEl) remainEl.textContent = HD_TOTAL - hdUsed;
  }

  // Reset short-rest features (Channel Divinity, Action Surge, Ki, etc.)
  resetShortRestFeatures();

  // Warlock Pact Magic: recover all spell slots on short rest (PHB p.107)
  // Other casters do NOT recover slots on short rest — that's a long rest only
  let spellUpdate = {};
  if (CASTER_TYPE === 'pact') {
    document.querySelectorAll('.slot-box.used').forEach(d => d.classList.remove('used'));
    spellUpdate = { spell_slots_used: JSON.stringify({}) };
  }

  // Arcane Recovery (Wizard, PHB p.115): recover slots = ceil(level/2) levels, max L5
  let arcaneUsed = false;
  if (cls === 'Wizard') {
    const arFeat = featureData.find(f => f.name && f.name.toLowerCase().includes('arcane recovery'));
    if (arFeat && arFeat.uses > 0) {
      const pool = Math.ceil(CHAR_LEVEL / 2);
      // Read current used slots from DOM
      const usedSlots = {};
      for (let lvl = 1; lvl <= 5; lvl++) {
        const tracker = document.getElementById(`slots-lvl-${lvl}`);
        if (tracker) {
          const used = tracker.querySelectorAll('.slot-box.used').length;
          if (used > 0) usedSlots[lvl] = used;
        }
      }
      // Recover highest-level slots first
      let remaining = pool;
      const recovered = {};
      for (let lvl = 5; lvl >= 1 && remaining > 0; lvl--) {
        const used = usedSlots[lvl] || 0;
        if (used > 0) {
          const toRecover = Math.min(used, Math.floor(remaining / lvl));
          if (toRecover > 0) {
            recovered[lvl] = toRecover;
            remaining -= toRecover * lvl;
            // Update DOM
            const boxes = document.querySelectorAll(`#slots-lvl-${lvl} .slot-box`);
            const newUsed = used - toRecover;
            boxes.forEach((b, i) => b.classList.toggle('used', i < newUsed));
          }
        }
      }
      // Merge with existing spellUpdate
      if (Object.keys(recovered).length > 0) {
        // Build new spell_slots_used: subtract recovered from current
        const ssu = {};
        for (let lvl = 1; lvl <= 9; lvl++) {
          const tracker = document.getElementById(`slots-lvl-${lvl}`);
          if (tracker) {
            const used = tracker.querySelectorAll('.slot-box.used').length;
            if (used > 0) ssu[lvl] = used;
          }
        }
        spellUpdate = Object.assign(spellUpdate, { spell_slots_used: JSON.stringify(ssu) });
        arcaneUsed = true;
        // Mark Arcane Recovery as used
        arFeat.uses = 0;
        renderFeatureDots(featureData.indexOf(arFeat));
      }
    }
  }

  // API: save HP, hit_dice_used, and feature_data
  await api('/update', Object.assign({ hp_current: newHp, hit_dice_used: hdUsed }, spellUpdate));
  await api('/update', { feature_data: JSON.stringify(featureData) });

  // Show result
  const hdResult = document.getElementById('hd-result');
  if (hdResult) {
    const parts = [];
    if (healed > 0) parts.push(`Regained ${healed} HP (${diceUsed} HD spent)`);
    if (diceUsed > 0) parts.push(`${diceUsed} HD used`);
    parts.push('Features reset');
    if (CASTER_TYPE === 'pact') parts.push('Pact slots recovered');
    if (arcaneUsed) parts.push(`Arcane Recovery (${Math.ceil(CHAR_LEVEL/2)} levels)`);
    hdResult.textContent = 'Short Rest — ' + parts.join(', ');
    hdResult.style.display = 'block';
    hdResult.style.borderColor = 'var(--success)';
    hdResult.style.background = 'rgba(0,200,83,0.05)';
  }
}

// ── Add Spell (searchable dropdown) ──
let _spellCache = [];
let _coreOnly = localStorage.getItem('coreOnly') === 'true';
const _CORE_BOOKS = ['PHB','PHB 2014','DMG','DMG 2014','MM','XGE','TCE','TCE 2020','VGM','MTF','SCAG','ERLW','FTD','MPMM','BPGG'];
const _CORE_NAMES = ["player's handbook","dungeon master's guide","monster manual","xanathar's guide","tasha's cauldron","volo's guide","mordenkainen's tome","sword coast adventurer's guide","eberron: rising","fizban's treasury","mordenkainen presents","bigby presents","glory of the giants","elemental evil player's companion"];
function isCoreSource(book) {
  if (!book) return true;
  const lower = book.toLowerCase();
  const abbr = lower.split(' p.')[0].trim();
  if (_CORE_BOOKS.some(b => abbr === b.toLowerCase())) return true;
  if (_CORE_NAMES.some(n => lower.includes(n))) return true;
  return false;
}
// Extended check for item source strings (full book names, no abbreviation pattern)
function isCoreItemSource(src) {
  if (!src) return true;
  const lower = src.toLowerCase();
  for (const b of _CORE_BOOKS) if (lower.includes(b.toLowerCase())) return true;
  for (const n of _CORE_NAMES) if (lower.includes(n)) return true;
  return false;
}

function toggleCoreOnly() {
  _coreOnly = !_coreOnly;
  localStorage.setItem('coreOnly', _coreOnly);
  document.getElementById('core-toggle-box').textContent = _coreOnly ? '☑' : '☐';
  document.getElementById('core-toggle-label').style.color = _coreOnly ? 'var(--accent)' : 'var(--text-muted)';
  filterSpellResults();
}

// Sync spell modal toggle when inventory toggle clicked
function syncCoreToSpellToggle() {
  const box = document.getElementById('core-toggle-box');
  const label = document.getElementById('core-toggle-label');
  if (box) box.textContent = _coreOnly ? '☑' : '☐';
  if (label) label.style.color = _coreOnly ? 'var(--accent)' : 'var(--text-muted)';
  filterSpellResults();
}

async function showAddSpell() {
  document.getElementById('add-spell-modal').style.display = 'flex';
  document.getElementById('spell-search').value = '';
  document.getElementById('spell-name').value = '';
  document.getElementById('spell-level').value = '0';
  document.getElementById('spell-detail').style.display = 'none';
  document.getElementById('spell-results').innerHTML = '<div style="padding:0.5rem;color:var(--text-muted);font-size:0.8rem">Loading...</div>';
  document.getElementById('spell-source-info').textContent = 'Loading available spells...';
  document.getElementById('spell-search').focus();

  try {
    const r = await fetch('/api/character/' + CHAR_ID + '/available-spells');
    _spellCache = await r.json();
    const counts = {};
    _spellCache.forEach(s => { counts[s.source] = (counts[s.source]||0) + 1; });
    const parts = Object.entries(counts).map(([k,v]) => `${v} ${k}`);
    document.getElementById('spell-source-info').textContent = parts.join(' · ') || 'No spells available';
    filterSpellResults();
  } catch(e) {
    document.getElementById('spell-results').innerHTML = '<div style="padding:0.5rem;color:var(--error)">Failed to load spells</div>';
  }
}

function closeAddSpell() {
  document.getElementById('add-spell-modal').style.display = 'none';
  _spellCache = [];
}

function filterSpellResults() {
  const q = document.getElementById('spell-search').value.toLowerCase().trim();
  const div = document.getElementById('spell-results');
  let spells = _spellCache;
  if (_coreOnly) {
    spells = spells.filter(s => isCoreSource(s.book));
  }
  if (q) {
    spells = spells.filter(s =>
      s.name.toLowerCase().includes(q) ||
      s.school.toLowerCase().includes(q) ||
      s.source.toLowerCase().includes(q)
    );
  }
  if (!spells.length) {
    div.innerHTML = '<div style="padding:0.5rem;color:var(--text-muted);font-size:0.8rem">No spells match</div>';
    return;
  }
  // Show all (scrollable)
  const shown = spells;
  div.innerHTML = shown.map((s, i) => {
    const lvlBadge = s.level === 0
      ? '<span style="background:var(--accent2);color:var(--accent);font-size:0.65rem;padding:0.1rem 0.35rem;border-radius:3px">Cantrip</span>'
      : `<span style="background:var(--accent);color:#fff;font-size:0.65rem;padding:0.1rem 0.35rem;border-radius:3px">Lv${s.level}</span>`;
    const schoolBadge = s.school ? `<span style="font-size:0.65rem;color:var(--text-muted)">${s.school}</span>` : '';
    const srcBadge = s.book ? `${_srcBadge(s.book)}` : '';
    const originTag = s.source ? `<span style="font-size:0.55rem;color:var(--accent);opacity:0.6">${s.source}</span>` : '';
    const concIcon = s.concentration ? '🔷' : '';
    const ritIcon = s.ritual ? '📖' : '';
    return `<div class="spell-option" data-idx="${i}"
      style="padding:0.4rem 0.6rem;cursor:pointer;border-bottom:1px solid var(--border);font-size:0.82rem;display:flex;align-items:center;gap:0.4rem;flex-wrap:wrap"
      onmouseover="this.style.background='var(--accent2)'" onmouseout="this.style.background=''"
      onclick="selectSpell(${i})">
      <strong style="flex:1;min-width:0">${s.name}</strong>
      ${concIcon}${ritIcon} ${lvlBadge} ${schoolBadge} ${srcBadge} ${originTag}
    </div>`;
  }).join('');
  if (spells.length > 30) {
    div.innerHTML += `<div style="padding:0.3rem;font-size:0.7rem;color:var(--text-muted);text-align:center">Showing ${shown.length} of ${spells.length} \u2014 type to narrow</div>`;
  }
}

function handleSpellKey(e) {
  if (e.key === 'Escape') { closeAddSpell(); return; }
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    const first = document.querySelector('.spell-option');
    if (first) { first.focus(); first.style.background = 'var(--accent2)'; }
  }
}

function selectSpell(idx) {
  const s = _spellCache[idx];
  if (!s) return;
  document.getElementById('spell-name').value = s.name;
  document.getElementById('spell-level').value = s.level;
  document.getElementById('spell-search').value = s.name;
  document.getElementById('spell-results').innerHTML = '';

  // Show/hide fields based on cantrip vs leveled spell
  const isCantrip = s.level === 0;
  document.getElementById('spell-prepared-label').textContent = isCantrip ? 'Known (cantrip)' : 'Prepared';
  document.getElementById('spell-prepared').checked = isCantrip ? true : true;
  document.getElementById('spell-slots-group').style.display = isCantrip ? 'none' : '';

  // Show spell detail
  const detail = document.getElementById('spell-detail');
  detail.style.display = 'block';
  const parts = [];
  if (s.casting_time) parts.push(`<strong>Cast:</strong> ${s.casting_time}`);
  if (s.range) parts.push(`<strong>Range:</strong> ${s.range}`);
  if (s.duration) parts.push(`<strong>Duration:</strong> ${s.duration}${s.concentration ? ' (concentration)' : ''}`);
  if (s.ritual) parts.push('<strong>Ritual</strong>');
  detail.innerHTML = parts.join(' · ') + '<br><br>' + (s.description || 'No description available');
}

async function addSpell() {
  const name = document.getElementById('spell-name').value.trim();
  if (!name) return;
  const data = {
    name, level: parseInt(document.getElementById('spell-level').value),
    prepared: document.getElementById('spell-prepared').checked ? 1 : 0,
    slots_max: parseInt(document.getElementById('spell-slots').value)
  };
  const r = await fetch('/api/character/' + CHAR_ID + '/add-spell', {
    method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(data)
  });
  if (r.ok) location.reload();
}

async function aiSelectSpells() {
  const btn = document.querySelector('#tab-spells button[onclick*=\"aiSelectSpells\"]') || event.target;
  btn.disabled = true;
  const orig = btn.textContent;
  btn.textContent = '🤖 Thinking...';
  try {
    const r = await fetch('/api/character/' + CHAR_ID + '/ai-spells', { method: 'POST' });
    const data = await r.json();
    if (data.added > 0) {
      location.reload();
    } else {
      btn.textContent = data.message || 'Already full';
      setTimeout(() => { btn.textContent = orig; btn.disabled = false; }, 2000);
    }
  } catch(e) {
    btn.textContent = 'Error';
    btn.disabled = false;
    setTimeout(() => { btn.textContent = orig; }, 1500);
  }
}

// ── Toggle Prepared Spell ──
async function togglePrepared(spellId, checkbox) {
  // checkbox can be an <input type=checkbox> or a <button> with data-checked
  const wasChecked = checkbox.tagName === 'BUTTON' ? checkbox.dataset.checked === 'true' : checkbox.checked;
  const prepared = !wasChecked;  // toggle
  const r = await fetch('/api/character/' + CHAR_ID + '/toggle-prepared', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id: spellId, prepared: prepared })
  });
  if (!r.ok) return;
  
  // Update the button state if it's a button
  if (checkbox.tagName === 'BUTTON') {
    checkbox.dataset.checked = prepared ? 'true' : 'false';
    checkbox.textContent = prepared ? '✕' : '+';
    checkbox.title = prepared ? 'Unprepare' : 'Prepare';
    checkbox.style.color = prepared ? 'var(--danger)' : 'var(--success)';
  } else {
    checkbox.checked = prepared;
  }
  
  // Sync the Spellbook row button (if toggle came from chip)
  const row = document.getElementById('spell-row-' + spellId);
  if (row) {
    const spellbookBtn = row.querySelector('.prep-toggle-btn');
    if (spellbookBtn && spellbookBtn !== checkbox) {
      spellbookBtn.dataset.checked = prepared ? 'true' : 'false';
      spellbookBtn.textContent = prepared ? '✕' : '+';
      spellbookBtn.title = prepared ? 'Unprepare' : 'Prepare';
      spellbookBtn.style.color = prepared ? 'var(--danger)' : 'var(--success)';
    }
  }
  // Sync the chip button (if toggle came from Spellbook)
  if (checkbox.tagName === 'BUTTON' && checkbox.closest('.prepared-spell-chip')) {
    // Click came from chip — need to update Spellbook button too (handled above)
  } else {
    // Click came from Spellbook button — need to update chip button
    const chip = document.getElementById('prep-spell-' + spellId);
    if (chip) {
      const chipBtn = chip.querySelector('button');
      if (chipBtn) {
        chipBtn.dataset.checked = prepared ? 'true' : 'false';
        chipBtn.textContent = prepared ? '✕' : '+';
        chipBtn.title = prepared ? 'Unprepare' : 'Prepare';
        chipBtn.style.color = prepared ? 'var(--danger)' : 'var(--success)';
      }
    }
  }
  
  // Update prepared spell chip in the prepared spells card
  const prepList = document.getElementById('prepared-spells-list');
  if (prepList) {
    if (prepared) {
      // Use existing row var from sync section above, or find it
      const spellRow = document.getElementById('spell-row-' + spellId);
      const name = spellRow ? spellRow.querySelector('strong').textContent : 'Spell';
      const lvlBadge = spellRow ? spellRow.querySelector('.badge-muted') : null;
      const lvl = lvlBadge ? lvlBadge.textContent : '';
      const schoolBadge = spellRow ? spellRow.querySelector('[style*="var(--border)"]') : null;
      const concBadge = spellRow ? spellRow.querySelector('[style*="var(--warn)"]') : null;
      
      // Remove "no spells" message if present
      const emptyMsg = prepList.querySelector('p');
      if (emptyMsg) emptyMsg.remove();
      
      const chip = document.createElement('div');
      chip.className = 'prepared-spell-chip';
      chip.id = 'prep-spell-' + spellId;
      chip.style.cssText = 'display:flex;align-items:center;flex-wrap:wrap;gap:0.3rem;padding:0.25rem 0.5rem;background:var(--bg);border:1px solid var(--accent2);border-radius:4px;font-size:0.8rem;cursor:pointer';
      chip.onclick = function(e) {
        e.stopPropagation();
        const targetRow = document.getElementById('spell-row-' + spellId);
        if (targetRow) {
          targetRow.scrollIntoView({behavior:'smooth',block:'center'});
          targetRow.querySelector('.spell-header').classList.add('highlight-pulse');
        }
      };
      chip.title = 'Click to find in Spellbook';
      chip.innerHTML = '<strong>' + name + '</strong>' +
        (lvl ? ' <span class=\"badge badge-muted\" style=\"font-size:0.6rem\">' + lvl + '</span>' : '') +
        (schoolBadge ? ' ' + schoolBadge.outerHTML : '') +
        (concBadge ? ' ' + concBadge.outerHTML : '') +
        '<button class=\"btn btn-outline btn-sm\" style=\"font-size:0.6rem;padding:0.1rem 0.3rem;line-height:1;color:var(--danger)\" ' +
        'onclick=\"event.stopPropagation();togglePrepared(' + spellId + ', this)\" data-checked=\"true\" title=\"Unprepare\">✕</button>';
      prepList.appendChild(chip);
    } else {
      // Remove the chip
      const chip = document.getElementById('prep-spell-' + spellId);
      if (chip) chip.remove();
      // Add "no spells" message if list is empty
      if (prepList.children.length === 0) {
        prepList.innerHTML = '<p style=\"color:var(--text-muted);font-size:0.85rem;margin:0\">No spells prepared. Prepare spells from your Spellbook below.</p>';
      }
    }
  }
  
  // Update prepared count
  const countEl = document.getElementById('prepared-count');
  if (countEl) {
    if (prepared) {
      countEl.textContent = parseInt(countEl.textContent) + 1;
    } else {
      countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
    }
    const current = parseInt(countEl.textContent);
    countEl.style.color = current > PREPARED_MAX ? 'var(--danger)' : '';
  }
}

// ── Unlearn Cantrip ──
async function unlearnSpell(spellId, spellName) {
  if (!confirm(`Unlearn "${spellName}"? This cannot be undone.`)) return;
  const btn = event.target;
  btn.disabled = true;
  btn.textContent = '⌛';
  const r = await fetch('/api/character/' + CHAR_ID + '/unlearn-spell', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ id: spellId })
  });
  if (!r.ok) { btn.disabled = false; btn.textContent = '🗑'; return; }
  // Remove the spell row
  const row = document.getElementById('spell-row-' + spellId);
  if (row) row.remove();
  // Update cantrip count
  const countEl = document.getElementById('cantrips-known-count');
  if (countEl) countEl.textContent = Math.max(0, parseInt(countEl.textContent) - 1);
}

// ── Portrait Modal ──
function openPortraitModal() {
  document.getElementById('portrait-modal').style.display = 'flex';
  // Reset upload section
  document.getElementById('upload-section').style.display = 'none';
  document.getElementById('upload-preview').style.display = 'none';
  document.getElementById('upload-file').value = '';
  document.getElementById('upload-status').textContent = '';
}

function toggleUpload() {
  const sec = document.getElementById('upload-section');
  sec.style.display = sec.style.display === 'none' ? 'block' : 'none';
}

function previewUpload() {
  const file = document.getElementById('upload-file').files[0];
  const preview = document.getElementById('upload-preview');
  if (!file) { preview.style.display = 'none'; return; }
  const reader = new FileReader();
  reader.onload = (e) => { preview.src = e.target.result; preview.style.display = 'block'; };
  reader.readAsDataURL(file);
}

async function saveUploadedPortrait() {
  const file = document.getElementById('upload-file').files[0];
  const status = document.getElementById('upload-status');
  if (!file) { status.textContent = 'Select a file first'; return; }

  status.textContent = 'Uploading...';
  const reader = new FileReader();
  reader.onload = async (e) => {
    try {
      const r = await fetch('/api/character/portrait', {
        method: 'POST', headers: {'Content-Type':'application/json'},
        body: JSON.stringify({ character_id: {{ character.id }}, image_data: e.target.result })
      });
      if (r.ok) {
        status.textContent = 'Saved!';
        // Update modal + sidebar
        document.getElementById('modal-portrait-img').src = e.target.result;
        document.getElementById('modal-portrait-img').style.display = 'block';
        const ph = document.getElementById('modal-portrait-placeholder');
        if (ph) ph.style.display = 'none';
        const sb = document.getElementById('sidebar-portrait');
        if (sb) sb.src = e.target.result;
      } else {
        status.textContent = 'Error: ' + r.status;
      }
    } catch(err) {
      status.textContent = 'Failed: ' + err.message;
    }
  };
  reader.readAsDataURL(file);
}

async function fetchPortraitPrompt() {
  const custom = document.getElementById('modal-portrait-custom').value.trim();
  const display = document.getElementById('prompt-display');
  const textarea = document.getElementById('prompt-text');
  display.style.display = 'block';
  textarea.value = 'Generating prompt...';

  try {
    const r = await fetch('/api/ai/portrait', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        race: '{{ character.race }}', subrace: '{{ character.subrace or "" }}',
        class_name: '{{ character.class_name }}', subclass: '{{ character.subclass or "" }}',
        background: '{{ character.background or "" }}', alignment: '{{ character.alignment or "" }}',
        custom_prompt: custom
      })
    });
    const data = await r.json();
    textarea.value = data.prompt || '(no prompt returned)';
  } catch(e) {
    textarea.value = 'Error: ' + (e.message || e);
  }
}

function copyPrompt() {
  const ta = document.getElementById('prompt-text');
  ta.select();
  document.execCommand('copy');
  const span = document.getElementById('prompt-copied');
  span.style.display = 'inline';
  setTimeout(() => { span.style.display = 'none'; }, 2000);
}

async function regenerateSheetPortrait() {
  const custom = document.getElementById('modal-portrait-custom').value.trim();
  const img = document.getElementById('modal-portrait-img');
  const placeholder = document.getElementById('modal-portrait-placeholder');
  const loading = document.getElementById('modal-portrait-loading');

  if (placeholder) placeholder.style.display = 'none';
  img.style.display = 'none';
  loading.style.display = 'block';

  try {
    const r = await fetch('/api/ai/portrait', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        race: '{{ character.race }}', subrace: '{{ character.subrace or "" }}',
        class_name: '{{ character.class_name }}', subclass: '{{ character.subclass or "" }}',
        background: '{{ character.background or "" }}', alignment: '{{ character.alignment or "" }}',
        custom_prompt: custom, character_id: {{ character.id }}
      })
    });
    const data = await r.json();
    const dataUrl = data.image_url || '';

    if (dataUrl) {
      img.src = dataUrl;
      loading.style.display = 'none';
      img.style.display = 'block';
      // Update sidebar portrait
      const sb = document.getElementById('sidebar-portrait');
      if (sb) sb.src = dataUrl;
    } else {
      loading.innerHTML = '<div style="font-size:0.75rem;color:var(--text-muted);text-align:center;line-height:1.4">'
        + '<span>⏳ Image being generated...</span><br>'
        + '<span style="font-size:0.65rem">Free tier limited to 50 requests/day. '
        + 'Close and re-open this modal to check.</span>'
        + '<br><button onclick="generatePortrait()" style="margin-top:6px;padding:2px 10px;font-size:0.7rem;cursor:pointer;background:var(--accent);color:#fff;border:none;border-radius:4px">🔄 Retry</button>'
        + '</div>';
    }
  } catch(e) {
    loading.innerHTML = '⚠️ Failed: ' + (e.message || e);
    console.error(e);
  }
}

// ── Detail Popup ──
const DESCRIPTIONS = {
  race: {{ races|tojson }},
  class: {{ classes|tojson }},
  bg: {{ bg_info|tojson }}
};
const CLASS_LEVELS = {{ (class_levels or {})|tojson }};

const ARMOR_NAMES = {{ armor_names|tojson }};  // from Campaign Expert equipment_data
const NAMED_ITEM_TYPES = {{ named_item_types|tojson }};  // server-side weapon/armor classification

// ── Action Detail Popup ──
function showDetail() {
  if (document.body.classList.contains('edit-mode')) return;
  const popup = document.getElementById('detail-popup');
  const title = document.getElementById('popup-title');
  const body = document.getElementById('popup-body');

  const race = {{ character.race|tojson }};
  const subrace = {{ (character.subrace or "")|tojson }};
  const cls = {{ character.class_name|tojson }};
  const subclass = {{ (character.subclass or "")|tojson }};
  const bg = {{ (character.background or "")|tojson }};
  const align = {{ (character.alignment or "")|tojson }};
  const bgData = {{ character.background_data|tojson if character.background_data else '{}' }};

  title.textContent = {{ character.name|tojson }};

  let html = '';
  // Case-insensitive race lookup: try exact first, then lowercase
  const raceData = DESCRIPTIONS.race[race] || DESCRIPTIONS.race[race.toLowerCase()];
  const classData = DESCRIPTIONS.class[cls];
  const bgDesc = DESCRIPTIONS.bg[bg];

  // Race
  const effectiveSubrace = subrace || raceData?.subrace || '';
  const raceSrc = raceData?.source || '';
  html += `<div style="margin-bottom:1rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong style="color:var(--accent)">${race}</strong>${raceSrc ? ` ${_srcBadge(raceSrc)}` : ''}</div>`;
  if (raceData?.desc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${raceData.desc}</p>`;
  if (effectiveSubrace) {
    const srSrc = (raceData?._subrace_sources || {})[effectiveSubrace] || '';
    html += `<div style="margin-top:0.5rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong>${effectiveSubrace}</strong>${srSrc ? ` ${_srcBadge(srSrc)}` : ''}</div>`;
    const srDesc = (raceData?.subrace_descs || {})[effectiveSubrace];
    if (srDesc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${srDesc}</p>`;
    html += '</div>';
  }
  html += '</div>';

  // Find which class owns the subclass (may differ from primary for multiclass)
  let subclassParent = null;
  if (subclass) {
    for (const [cName] of Object.entries(CLASS_LEVELS)) {
      const cd = DESCRIPTIONS.class[cName];
      if (cd && (cd.subclasses || []).includes(subclass)) {
        subclassParent = cName;
        break;
      }
    }
  }

  // Primary class
  const classSrc = classData?.source || '';
  html += `<div style="margin-bottom:1rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong style="color:var(--accent)">${cls} ${CLASS_LEVELS[cls] || ''}</strong>${classSrc ? ` ${_srcBadge(classSrc)}` : ''}</div>`;
  if (classData?.desc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${classData.desc}</p>`;
  // Subclass — only if it belongs to primary
  if (subclass && cls === subclassParent) {
    const scSrc = (classData?._subclass_sources || {})[subclass] || '';
    html += `<div style="margin-top:0.5rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong>${subclass}</strong>${scSrc ? ` ${_srcBadge(scSrc)}` : ''}</div>`;
    const scDesc = (classData?.subclass_descs || {})[subclass];
    if (scDesc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${scDesc}</p>`;
    html += '</div>';
  }
  html += '</div>';

  // Additional multiclass classes
  for (const [mcName, mcLevel] of Object.entries(CLASS_LEVELS)) {
    if (mcName === cls) continue;  // skip primary
    const mcData = DESCRIPTIONS.class[mcName];
    if (!mcData) continue;
    const mcSrc = mcData.source || '';
    html += `<div style="margin-bottom:1rem;border-top:1px solid var(--border);padding-top:0.75rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong style="color:var(--accent)">${mcName} ${mcLevel}</strong>${mcSrc ? ` ${_srcBadge(mcSrc)}` : ''}</div>`;
    if (mcData.desc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${mcData.desc}</p>`;
    // Subclass — only if it belongs to this multiclass
    if (subclass && mcName === subclassParent) {
      const scSrc = (mcData?._subclass_sources || {})[subclass] || '';
      html += `<div style="margin-top:0.5rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong>${subclass}</strong>${scSrc ? ` ${_srcBadge(scSrc)}` : ''}</div>`;
      const scDesc = (mcData?.subclass_descs || {})[subclass];
      if (scDesc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${scDesc}</p>`;
      html += '</div>';
    }
    html += '</div>';
  }

  // Background
  if (bg) {
    const bgSrc = (bgData && bgData.source) ? bgData.source : '';
    html += `<div style="margin-bottom:1rem;border-top:1px solid var(--border);padding-top:0.75rem"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem"><strong style="color:var(--accent)">Background: ${bg}</strong>${bgSrc ? ` ${_srcBadge(bgSrc)}` : ''}</div>`;
    const desc = (bgData && bgData.description) ? bgData.description : bgDesc;
    if (desc) html += `<p style="margin:0.25rem 0 0 0;font-size:0.85rem;color:var(--text-muted)">${desc}</p>`;
    if (bgData && bgData.items && bgData.items.length) html += `<p style="margin:0.25rem 0 0 0;font-size:0.8rem;color:var(--text-muted)">Items: ${bgData.items.join(', ')} · ${bgData.gp || 15} gp</p>`;
    html += '</div>';
  }

  // Alignment
  if (align) {
    html += `<div style="font-size:0.85rem;color:var(--text-muted);border-top:1px solid var(--border);padding-top:0.75rem"><strong>Alignment:</strong> ${align}</div>`;
  }

  body.innerHTML = html;
  popup.style.display = 'flex';
}

async function showItemInfo(name) {
  if (!name || !name.trim()) return;
  const popup = document.getElementById('detail-popup');
  const title = document.getElementById('popup-title');
  const body = document.getElementById('popup-body');
  
  title.textContent = name;
  body.innerHTML = '<p style="color:var(--text-muted);font-size:0.85rem">Loading...</p>';
  popup.style.display = 'flex';
  
  try {
    const resp = await fetch(`/api/items/describe?name=${encodeURIComponent(name.trim())}`);

// ── Expand/collapse item cards (fetches SRD info on first expand) ──
const _itemDetailCache = {};
async function toggleItemExpand(btn) {
  const card = btn.closest('.item-card');
  if (!card) return;
  const isExpanding = !card.classList.contains('expanded');
  card.classList.toggle('expanded');

  if (isExpanding) {
    const detail = card.querySelector('.item-detail');
    if (!detail || detail.dataset.loaded) return;
    const nameEl = card.querySelector('.item-card-name');
    const name = (nameEl?.value || nameEl?.textContent || '').trim();
    if (!name) return;

    // Use cache if available
    if (_itemDetailCache[name]) {
      const qtyBadge2 = card.querySelector('.item-qty');
      const currentQty2 = qtyBadge2 ? parseInt(qtyBadge2.textContent) || 1 : 1;
      detail.innerHTML = _itemDetailCache[name] + buildQtyRow(currentQty2);
      detail.dataset.loaded = '1';
      return;
    }

    detail.innerHTML = '<span style="color:var(--text-muted);font-size:0.65rem">Loading...</span>';
    try {
      const resp = await fetch(`/api/items/describe?name=${encodeURIComponent(name)}`);
      const data = await resp.json();
      const typeTag = data.type ? ` · ${data.type}` : '';
      const srcTag = data.source ? `${_srcBadge(data.source)}` : '';
      const qtyBadge = card.querySelector('.item-qty');
      const currentQty = qtyBadge ? parseInt(qtyBadge.textContent) || 1 : 1;
      const descHtml = `<span class="detail-label">${data.name || name}</span>${typeTag}${srcTag}
        <br><span style="color:var(--text);font-size:0.65rem;line-height:1.4">${data.description || 'No description available.'}</span>
        ${data.curse ? _curseSectionHtml(data.curse) : ''}`;
      _itemDetailCache[name] = descHtml;
      detail.innerHTML = descHtml + buildQtyRow(currentQty);
    } catch(e) {
      detail.innerHTML = '<span style="color:var(--text-muted);font-size:0.65rem">Unable to load details.</span>';
    }
    detail.dataset.loaded = '1';
  }
}

// ── Quantity input inside expanded item detail ──
function buildQtyRow(qty) {
  return `<div style="margin-top:0.4rem;display:flex;align-items:center;gap:0.3rem">
    <span class="detail-label">Qty</span>
    <button class="qty-stepper" onclick="event.stopPropagation();stepQty(this, -1)">−</button>
    <input type="number" class="qty-detail-input" value="${qty}" min="1" max="999"
      style="width:4ch;padding:0.1rem 0.2rem;background:var(--bg);border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:0.65rem;-moz-appearance:textfield;appearance:textfield;text-align:center"
      onchange="updateItemQty(this)" onclick="event.stopPropagation()">
    <button class="qty-stepper" onclick="event.stopPropagation();stepQty(this, 1)">+</button>
  </div>`;
}

function stepQty(btn, delta) {
  const input = btn.parentElement.querySelector('.qty-detail-input');
  if (!input) return;
  let val = parseInt(input.value) || 1;
  val = Math.max(1, Math.min(999, val + delta));
  input.value = val;
  updateItemQty(input);
}

async function updateItemQty(input) {
  console.log('updateItemQty called');
  const card = input.closest('.item-card');
  if (!card) { console.log('updateItemQty: no card found'); return; }
  const qty = Math.max(1, parseInt(input.value) || 1);
  input.value = qty;
  console.log('updateItemQty: qty =', qty, 'card name =', (card.querySelector('.item-card-name')?.value || ''));

  // Update or remove qty badge on the card
  let badge = card.querySelector('.item-qty');
  if (qty > 1) {
    if (!badge) {
      badge = document.createElement('span');
      badge.className = 'item-qty';
      badge.style.cursor = 'pointer';
      badge.title = 'Click to expand';
      badge.onclick = function(e) { e.stopPropagation(); toggleItemExpand(card.querySelector('.item-expand-btn')); };
      const btn = card.querySelector('.item-card-btn');
      card.insertBefore(badge, btn);
    }
    badge.textContent = qty;
  } else if (badge) {
    badge.remove();
  }

  // Update drag data with new qty
  const nameEl = card.querySelector('.item-card-name');
  const name = (nameEl?.value || nameEl?.textContent || '').trim();
  card.setAttribute('ondragstart', `handleDragStart(event, '${name.replace(/'/g, "\\'")}', 'inventory', ${qty})`);

  await saveInventory();
}

// ── Editable fields ──
function makeEditable(el, field, isNum, isList) {
  el.classList.add('editable');
  el.addEventListener('click', () => {
    if (!document.body.classList.contains('edit-mode')) return; // locked
    if (el.querySelector('input')) return;
    const current = el.textContent.trim();
    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'editable-input' + (isNum ? ' number' : '');
    input.value = isNum ? current.replace(/[^0-9-]/g,'') : current;
    input.style.width = (Math.max(current.length, 3) + 2) + 'ch';
    el.textContent = '';
    el.appendChild(input);
    input.focus();
    input.select();

    const save = async () => {
      let val = input.value.trim();
      if (isNum) val = parseInt(val) || 0;
      if (isList) {
        const arr = val.split(',').map(s => s.trim()).filter(Boolean);
        el.textContent = arr.join(', ') || 'None';
        try { await api('/update', { [field]: JSON.stringify(arr) }); } catch(e) { console.error(e); }
      } else {
        el.textContent = isNum ? val : val || '—';
        try { await api('/update', { [field]: isNum ? val : val }); } catch(e) { console.error(e); }
      }
    };
    input.addEventListener('blur', save);
    input.addEventListener('keydown', (e) => { if (e.key==='Enter') input.blur(); });
  });
}

function initEditable() {
  document.querySelectorAll('.editable[data-num]').forEach(el => {
    makeEditable(el, el.dataset.field, true, el.dataset.list === '1');
  });
  document.querySelectorAll('.editable[data-text]').forEach(el => {
    makeEditable(el, el.dataset.field, false, el.dataset.list === '1');
  });
  // Text fields without explicit data-text/data-num (identity, etc.)
  document.querySelectorAll('.editable[data-field]:not([data-num]):not([data-text])').forEach(el => {
    makeEditable(el, el.dataset.field, false, el.dataset.list === '1');
  });
}

// Section labels for each field (shown above badge group)
const PROF_SECTION_LABELS = {
  armor_proficiencies: 'Armor',
  weapon_proficiencies: 'Weapons',
  tool_proficiencies: 'Tools',
  languages: 'Languages'
};

function updateProfBadges(field) {
  const profs = getCurrentProfs(field);
  let container = document.getElementById('prof-badges-' + field);
  const section = document.getElementById('prof-section');
  if (!section) return;

  if (profs.length === 0) {
    // Remove badge container + its header if exists
    if (container) {
      const header = container.previousElementSibling;
      if (header && header.style.fontSize === '0.6rem') header.remove();
      container.remove();
    }
    // Update "No proficiencies" visibility
    updateNoProfsMessage();
    return;
  }

  // Build badge HTML
  const badgesHtml = profs.map(p => `<span class="prof-badge">${p}</span>`).join('');

  if (container) {
    container.innerHTML = badgesHtml;
  } else {
    // Create header + container
    const label = PROF_SECTION_LABELS[field] || field;
    const header = document.createElement('div');
    header.style.cssText = 'font-size:0.6rem;color:var(--text-muted);margin-bottom:0.15rem;margin-top:0.3rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em';
    header.textContent = label;
    container = document.createElement('span');
    container.id = 'prof-badges-' + field;
    container.innerHTML = badgesHtml;

    // Insert before edit pickers or at end of prof-section
    const editBlock = section.querySelector('.edit-only-block');
    if (editBlock) {
      editBlock.before(header, container);
    } else {
      section.appendChild(header);
      section.appendChild(container);
    }
  }
  updateNoProfsMessage();
}

function updateNoProfsMessage() {
  const noMsg = document.querySelector('#prof-section > span[style*="color:var(--text-muted)"]');
  const anyBadges = document.querySelectorAll('#prof-section [id^="prof-badges-"]').length > 0;
  if (anyBadges && noMsg) {
    noMsg.style.display = 'none';
  } else if (!anyBadges && noMsg) {
    noMsg.style.display = '';
  } else if (!anyBadges && !noMsg) {
    const section = document.getElementById('prof-section');
    if (section) {
      const msg = document.createElement('span');
      msg.style.cssText = 'color:var(--text-muted);font-size:0.8rem';
      msg.textContent = 'No proficiencies';
      section.insertBefore(msg, section.querySelector('.edit-only-block') || section.firstChild);
    }
  }
}

async function toggleProfItem(cb, field, type) {
  let profs = getCurrentProfs(field);
  const name = cb.value;
  const idx = profs.findIndex(p => p.toLowerCase() === name.toLowerCase());
  if (cb.checked && idx === -1) {
    profs.push(name);
  } else if (!cb.checked && idx !== -1) {
    profs.splice(idx, 1);
  }
  // Update display
  const displayEl = document.querySelector(`.prof-display[data-field="${field}"]`);
  if (displayEl) displayEl.textContent = profs.join(', ') || '';
  // Update badges
  updateProfBadges(field);
  // Save

  if (field === 'weapon_proficiencies') tagWeapons();
  if (field === 'armor_proficiencies') { tagArmor(); updateAcWarning(); }
}

  if (cb.checked && idx === -1) {
    items.push(name);
  } else if (!cb.checked && idx !== -1) {
    items.splice(idx, 1);
  }
  // Update display
  displayEl.textContent = items.join(', ') || '—';
  // Save to server
  await api('/update', { [field]: JSON.stringify(items) });
  // Refresh the defense badge area (reload page or update inline)
  refreshDefenseBadges();
}

// Map field → icon + class for badge rendering
const DEFENSE_BADGE_STYLE = {
  damage_resistances: { icon: '🛡️', cls: 'defense-resist' },
  damage_immunities: { icon: '✨', cls: 'defense-immune' },
  damage_vulnerabilities: { icon: '⚠️', cls: 'defense-vuln' },
  condition_immunities: { icon: '✨', cls: 'defense-immune' }
};

const DEFENSE_SECTION_LABELS = {
  damage_resistances: 'Resistances',
  damage_immunities: 'Immunities',
  damage_vulnerabilities: 'Vulnerabilities',
  condition_immunities: 'Condition Imm.'
};

function getDefenseBadgeContainer(field) {
  // Defense section structure: header div → badges → ...
  const section = document.getElementById('defenses-section');
  if (!section) return null;
  const labels = section.querySelectorAll('div[style*="font-size:0.6rem"]');
  for (const label of labels) {
    if (label.textContent.trim() === DEFENSE_SECTION_LABELS[field]) {
      // Return the container after the header — collect all defense-badge siblings until next header or non-badge
      const container = document.createElement('span');
      container.id = 'def-badges-' + field;
      let el = label.nextElementSibling;
      // Find existing badges or create container
      while (el && el.classList && (el.classList.contains('defense-badge') || el.classList.contains('defense-display'))) {
        if (!el.classList.contains('defense-display')) {
          container.appendChild(el.cloneNode(true));
        }
        el = el.nextElementSibling;
      }
      return { label, container, nextSibling: el };
    }
  }
  return null;
}

function updateDefenseBadges(field) {
  const displayEl = document.querySelector(`.defense-display[data-field="${field}"]`);
  if (!displayEl) return;
  const curText = displayEl.textContent.trim();
  const items = (!curText || curText === '—' || curText === 'None') ? [] : curText.split(',').map(s => s.trim()).filter(Boolean);
  const style = DEFENSE_BADGE_STYLE[field] || { icon: '🛡️', cls: 'defense-resist' };
  const section = document.getElementById('defenses-section');
  if (!section) return;

  // Remove old badge container + header if exists
  const oldContainer = document.getElementById('def-badges-' + field);
  if (oldContainer) {
    const header = oldContainer.previousElementSibling;
    if (header && header.style && header.style.fontSize === '0.6rem') header.remove();
    oldContainer.remove();
  }

  if (items.length === 0) {
    updateNoDefensesMessage();
    return;
  }

  // Build badge HTML
  const badgesHtml = items.map(v => `<span class="defense-badge ${style.cls}">${style.icon} ${v}</span>`).join('');

  // Create header + container
  const label = DEFENSE_SECTION_LABELS[field] || field;
  const header = document.createElement('div');
  header.style.cssText = 'font-size:0.6rem;color:var(--text-muted);margin-bottom:0.15rem;margin-top:0.3rem;font-weight:600;text-transform:uppercase;letter-spacing:0.04em';
  header.textContent = label;

  const container = document.createElement('span');
  container.id = 'def-badges-' + field;
  container.innerHTML = badgesHtml;

  // Insert before edit pickers or at end of defenses-section
  const editBlock = section.querySelector('.edit-only-block');
  if (editBlock) {
    editBlock.before(header, container);
  } else {
    section.appendChild(header);
    section.appendChild(container);
  }
  updateNoDefensesMessage();
}

function updateNoDefensesMessage() {
  const section = document.getElementById('defenses-section');
  if (!section) return;
  const noMsg = section.querySelector('span[style*="color:var(--text-muted)"]');
  const anyBadges = section.querySelectorAll('[id^="def-badges-"]').length > 0;
  if (anyBadges && noMsg) {
    noMsg.style.display = 'none';
  } else if (!anyBadges && noMsg) {
    noMsg.style.display = '';
  } else if (!anyBadges && !noMsg) {
    const msg = document.createElement('span');
    msg.style.cssText = 'color:var(--text-muted);font-size:0.8rem';
    msg.textContent = 'No special defenses';
    const editBlock = section.querySelector('.edit-only-block');
    if (editBlock) editBlock.before(msg);
    else section.appendChild(msg);
  }
}

let _expPicks = [];

function startExpertiseEdit() {
  _expPicks = [...CHAR_EXPERTISE];
  const count = EXPERTISE_COUNT;
  document.getElementById('exp-edit-count').textContent = count;
  
  let html = '';
  EXPERTISE_OPTIONS.forEach(opt => {
    const sel = _expPicks.includes(opt);

      style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem;border:1px solid ${sel ? 'var(--accent)' : 'var(--border)'};border-radius:6px;cursor:pointer;transition:border-color 0.15s;${sel ? 'background:var(--accent2)' : ''}">

      <span class="exp-check" style="font-size:0.9rem">${sel ? '✅' : '⬜'}</span>
    </div>`;
  });
  document.getElementById('exp-edit-body').innerHTML = html || '<p style="color:var(--text-muted);font-size:0.8rem">No expertise options available for this class.</p>';
  _updateExpCount();
  document.getElementById('exp-edit-modal').style.display = 'flex';
}

function toggleExpPick(el, opt) {
  const idx = _expPicks.indexOf(opt);
  if (idx >= 0) {
    _expPicks.splice(idx, 1);
    el.style.borderColor = 'var(--border)';
    el.style.background = '';
    el.querySelector('.exp-check').textContent = '⬜';
  } else {
    if (_expPicks.length >= EXPERTISE_COUNT) {
      // Remove first pick to make room
      const old = _expPicks.shift();
      const oldEl = document.querySelector(`.exp-opt-row[data-opt="${old.replace(/"/g,'&quot;')}"]`);
      if (oldEl) {
        oldEl.style.borderColor = 'var(--border)';
        oldEl.style.background = '';
        oldEl.querySelector('.exp-check').textContent = '⬜';
      }
    }
    _expPicks.push(opt);
    el.style.borderColor = 'var(--accent)';
    el.style.background = 'var(--accent2)';
    el.querySelector('.exp-check').textContent = '✅';
  }
  _updateExpCount();
}

function _updateExpCount() {
  document.getElementById('exp-edit-selected').textContent = `${_expPicks.length} / ${EXPERTISE_COUNT} selected`;
}

function closeExpertiseEdit() {
  document.getElementById('exp-edit-modal').style.display = 'none';
  _expPicks = [];
}

async function saveExpertiseEdit() {
  try {
    const r = await api('/edit-expertise', { expertise_skills: _expPicks });
    if (r.ok) { location.reload(); }
    else { const err = await r.json(); alert('Failed: ' + (err.error || 'Unknown error')); }

}

async function saveAsiEdit() {
  const isFeat = document.querySelector('input[name="asi-type"]:checked')?.parentElement?.textContent.includes('Feat');
  let entry = {level: _asiEditLevel};
  
  if (isFeat) {
    const feat = document.getElementById('asi-edit-feat-select')?.value;
    if (!feat) { alert('Please select a feat.'); return; }
    entry.type = 'feat';
    entry.feat = feat;
  } else {
    const plus2 = document.getElementById('asi-edit-plus2')?.value;
    const plus1 = document.getElementById('asi-edit-plus1')?.value;
    if (!plus2 || !plus1) { alert('Please select both +2 and +1 abilities.'); return; }

    entry.type = 'asi';
    entry[plus2.toLowerCase()] = 2;
    entry[plus1.toLowerCase()] = 1;
  }
  
  try {
    const r = await api('/edit-asi', {level: _asiEditLevel, entry});
    if (r.ok) { location.reload(); }
    else { alert('Failed to save. Try again.'); }
  } catch(e) { alert('Error saving: ' + e.message); }
}

function togglePassiveBody(chip) {

    const idx = parseInt(chip.getAttribute('data-feat-index'));

function editFeature(idx) {
  if (!document.body.classList.contains('edit-mode')) return;
  const feat = featureData[idx];
  if (!feat) return;
  const card = document.querySelector(`.feat-card[data-feat-index="${idx}"]`);
  const body = card.querySelector('.feat-body');
  const current = feat.description || '';
  
  if (body.querySelector('textarea')) return; // already editing
  body.innerHTML = `<textarea id="feat-edit-${idx}" style="width:100%;min-height:80px;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:0.5rem;border-radius:4px;font-family:var(--font);font-size:0.85rem">${current.replace(/`/g,'\\`').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</textarea>

    </div>`;
}

async function saveFeature(idx) {
  const ta = document.getElementById(`feat-edit-${idx}`);
  if (!ta) return;
  const val = ta.value.trim();
  featureData[idx].description = val;
  await api('/update', { feature_data: JSON.stringify(featureData) });
  // If feature has sub_options, reload to re-render; otherwise update inline
  if (featureData[idx].sub_options && featureData[idx].sub_options.length) {
    location.reload();
  } else {
    const card = document.querySelector(`.feat-card[data-feat-index="${idx}"]`);
    card.querySelector('.feat-body').textContent = val || 'No description available.';
  }
}

function cancelFeature(idx) {
  const feat = featureData[idx];
  // If feature has sub_options, reload to re-render; otherwise restore inline
  if (feat.sub_options && feat.sub_options.length) {
    location.reload();
  } else {
    const card = document.querySelector(`.feat-card[data-feat-index="${idx}"]`);
    card.querySelector('.feat-body').textContent = feat.description || 'No description available.';
  }
}

async function loadMISpells() {
  const cls = document.getElementById('mi-class').value;
  const container = document.getElementById('mi-spells');
  container.innerHTML = '<p style="color:var(--text-muted);font-size:0.8rem">Loading spells...</p>';

    const resp = await fetch('/api/spells/starting?class_name=' + cls + '&level=1');
    const spells = await resp.json();
    const cantrips = spells.filter(s => s.level === 0);
    const l1spells = spells.filter(s => s.level === 1);
    let html = '';
    if (cantrips.length) {
      html += '<p style="font-weight:600;margin-bottom:0.3rem;font-size:0.85rem">Cantrips <span style="font-weight:400;color:var(--text-muted);font-size:0.75rem">(pick 2)</span></p>';
      cantrips.forEach(s => {
        html += `<label style="display:block;font-size:0.8rem;margin:0.1rem 0;cursor:pointer"><input type="checkbox" class="mi-cantrip" value="${s.name}" onchange="limitMICantrips()"> ${s.name}</label>`;
      });
    }
    if (l1spells.length) {

}

function toggleMaManeuver(el, manKey) {

    window._ma_picks.push(manKey);
