<script src="/static/sheet-ref.js?v={{ sheet_ref_version }}"></script>
<script>
/* Per-character values for /static/sheet.js. Inline on purpose: they are
   per-request data and must never be cached. Character-independent tables
   (classes, races, feats, summons, ...) live in /static/sheet-ref.js. */
window.SHEETCFG = {
  charId: {{ character.id }},
  charLevel: {{ character.level }},
  charAsiHistory: {{ character.asi_history|tojson if character.asi_history else '[]' }},
  hpMax: {{ character.hp_max }},
  hdTotal: {{ character.hit_dice.split('d')[0] if 'd' in (character.hit_dice or '') else 0 }},
  attunedItems: {{ character.attuned_items|tojson }},
  itemNeedsAttunement: {{ item_attunement_json|safe if item_attunement_json else '{}' }},
  campaignId: {{ campaign_info.id if campaign_info else 'null' }},
  hdDie: {{ character.hit_dice.split('d')[1] if 'd' in (character.hit_dice or '') else 8 }},
  hdUsed: {{ character.hit_dice_used|default(0)|int }},
  conMod: {{ ((character.constitution or 10) - 10) // 2 }},
  preparedMax: {{ prepared_max }},
  casterType: {{ caster_type|tojson }},
  charGp: {{ character.gp|default(0)|int }},
  charSaveProfs: {{ saves_class|tojson }},
  charSkills: {{ (character.skills or [])|tojson }},
  charExpertise: {{ (character.expertise_skills or [])|tojson }},
  charClassName: {{ character.class_name|tojson }},
  charSubclass: {{ (character.subclass or "")|tojson }},
  expertiseOptions: {{ expertise_options|tojson }},
  expertiseCount: {{ expertise_count }},
  charProfBonusOrDefault: {{ character.proficiency_bonus or 2 }},
  strScore: {{ character.strength }},
  dexScore: {{ character.dexterity }},
  conScore: {{ character.constitution }},
  intScore: {{ character.intelligence }},
  wisScore: {{ character.wisdom }},
  chaScore: {{ character.charisma }},
  charRace: {{ character.race|tojson }},
  charSubrace: {{ (character.subrace or "")|tojson }},
  charBackground: {{ (character.background or "")|tojson }},
  charAlignment: {{ (character.alignment or "")|tojson }},
  classLevels: {{ (class_levels or {})|tojson }},
  armorNames: {{ armor_names|tojson }},
  charRaceJson: {{ character.race|tojson }},
  charSubraceJson: {{ (character.subrace or "")|tojson }},
  charClassNameJson: {{ character.class_name|tojson }},
  charSubclassJson: {{ (character.subclass or "")|tojson }},
  charBackgroundJson: {{ (character.background or "")|tojson }},
  charAlignmentJson: {{ (character.alignment or "")|tojson }},
  charBackgroundData: {{ character.background_data|tojson if character.background_data else '{}' }},
  charNameJson: {{ character.name|tojson }},
  charProfBonus: {{ character.proficiency_bonus|tojson }},
  charFeatureData: {{ character.feature_data|tojson if character.feature_data else '[]' }},
  charEquipped: {{ character.equipped|tojson if character.equipped else '[]' }},
  charSummons: {{ character.summons|tojson }},
};
</script>
<script src="/static/sheet.js?v={{ sheet_js_version }}"></script>
