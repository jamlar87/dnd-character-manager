<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#12121d">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon-180.png">
<link rel="stylesheet" href="/static/layout.css?v={{ static_asset_version('layout.css') }}">
<script src="/static/pwa.js?v={{ static_asset_version('pwa.js') }}" defer></script>
<title>{{ campaign.name }} — Table</title>
<style>
  /* The players' own device: no app chrome, no login, one column. It borrows the app's
     tokens and primitives so the table screen and the player map read as one product. */
  body::before { display: none; }
  .wrap { max-width: 44rem; margin: 0 auto; padding: var(--s4) var(--s3) var(--s5); }
  /* A shared table screen is read from a distance; on a desktop it may use the width. */
  @media (min-width: 980px) { .wrap { max-width: 72rem; } }

  .install-hint {
    display: none; align-items: center; gap: var(--s2); flex-wrap: wrap;
    margin-bottom: var(--s3); padding: var(--s2) var(--s3);
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); font-size: 0.82rem; color: var(--text-muted);
  }
  .install-hint .grow { flex: 1; min-width: 8rem; }
  .install-x {
    background: none; border: 0; color: var(--text-muted); cursor: pointer;
    font-size: 1rem; min-width: 40px; min-height: 40px; border-radius: var(--radius-sm);
  }
  .install-x:hover { background: var(--surface-3); color: var(--text); }

  /* Three live read-outs: the numbers are the point, so they stay large on a phone too. */
  .stat-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s2); margin-bottom: var(--s3); }
  /* At a real table the feed is watched from across the room, so on wide screens
     the roller and the feed sit side by side instead of stacking in a narrow column. */
  .tgrid { display: grid; gap: var(--s3); align-items: start; }
  @media (min-width: 980px) {
    .tgrid { grid-template-columns: minmax(0, 1.1fr) minmax(0, 0.9fr); }
    .tgrid .feed-list { min-height: 18rem; }
  }
  .stat-row .stat-num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
  .stat-row .name {
    font-size: 0.95rem; font-weight: 700; line-height: 1.3;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .card-body { padding: var(--s3) var(--s4); }

  .pad { display: grid; grid-template-columns: repeat(auto-fit, minmax(3.6rem, 1fr)); gap: var(--s2); margin-bottom: var(--s3); }
  .pad button {
    min-height: 52px; font-family: inherit; font-size: 1rem; font-weight: 700;
    background: var(--surface-2); color: var(--text);
    border: 1px solid var(--border); border-radius: var(--radius-sm); cursor: pointer;
    transition: border-color 0.15s, background 0.15s, transform 0.1s;
  }
  .pad button:hover { border-color: var(--accent); color: var(--accent-hi); }
  /* d20 is what the table reaches for nine times in ten — make it the one loud button. */
  .pad button.primary {
    background: var(--accent-soft); border-color: var(--accent); color: var(--accent-hi);
  }
  .pad button:active { transform: translateY(1px); background: var(--accent-soft); }

  .field-row { display: flex; flex-wrap: wrap; gap: var(--s2); margin-bottom: var(--s2); }
  .field { display: flex; flex-direction: column; gap: 0.3rem; flex: 1 1 12rem; min-width: 0; }
  .field-narrow { flex: 0 1 7rem; }
  .field-label { font-size: 0.8rem; font-weight: 650; color: var(--text-muted); }
  .field .input, .field .select { width: 100%; min-height: 40px; }
  .hint { margin: 0; font-size: 0.86rem; color: var(--text-muted); }

  .feed-list { max-height: 22rem; overflow-y: auto; }
  .rf-empty { padding: var(--s3) var(--s4); font-size: 0.86rem; color: var(--text-muted); }
  .rf-row {
    display: flex; align-items: baseline; gap: var(--s2);
    padding: 0.45rem var(--s4); border-bottom: 1px solid var(--border); font-size: 0.9rem;
  }
  .rf-row:last-child { border-bottom: 0; }
  .rf-who { font-weight: 650; white-space: nowrap; max-width: 11rem; overflow: hidden; text-overflow: ellipsis; }
  .rf-label { color: var(--text-muted); font-size: 0.82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rf-right { margin-left: auto; display: flex; gap: var(--s2); align-items: baseline; white-space: nowrap; }
  .rf-expr { color: var(--text-muted); font-size: 0.82rem; font-variant-numeric: tabular-nums; }
  .rf-faces { color: var(--text-dim); font-size: 0.8rem; }
  .rf-total {
    font-weight: 750; font-size: 1.05rem; color: var(--accent-hi);
    font-family: var(--font-mono); font-variant-numeric: tabular-nums;
  }
  .rf-lock { color: var(--text-dim); font-size: 0.8rem; }
  .rf-mine { color: var(--accent-hi); }
  .rf-hidden .rf-total { color: var(--text-muted); }

  @media (max-width: 480px) {
    .wrap { padding: var(--s3) var(--s2) var(--s4); }
    .card-body { padding: var(--s2) var(--s3); }
    .card-head { padding: var(--s2) var(--s3); }
    .field-narrow { flex: 1 1 6rem; }
    .rf-row { padding: 0.45rem var(--s3); flex-wrap: wrap; gap: 0.3rem var(--s2); }
    .rf-label { order: 3; flex: 1 1 100%; }
    /* Names are how you tell players apart at a table: wrap them, never cut them. */
    .rf-who { max-width: none; white-space: normal; overflow-wrap: anywhere; }
    .rf-right { margin-left: auto; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div id="installHint" class="install-hint">
    <button data-install-button class="btn btn-primary btn-sm" data-action="installApp">📲 Install this app</button>
    <span class="grow">Full screen, one tap from the home screen.</span>
    <button class="install-x" data-action="dismissInstallHint" title="Not now">✕</button>
  </div>

  <div class="page-head">
    <div>
      <div class="eyebrow">Shared table</div>
      <h1 class="page-title">{{ campaign.name }}</h1>
      <p class="page-sub">No login needed — the DM handed you this link.</p>
    </div>
  </div>

  <div class="stat-row">
    <div class="stat-box">
      <div class="stat-num" id="statMod">+0</div>
      <div class="stat-mod">modifier</div>
    </div>
    <div class="stat-box">
      <div class="name" id="statWho">nobody yet</div>
      <div class="stat-mod">rolling as</div>
    </div>
    <div class="stat-box">
      <div class="stat-num" id="statRolls">0</div>
      <div class="stat-mod">rolls shown</div>
    </div>
  </div>

  <div class="tgrid">
  <section class="card card-flush">
    <div class="card-head">
      <h2>🎲 Roll</h2>
      <span class="badge badge-muted" id="rfStatus">connecting…</span>
    </div>
    <div class="card-body">
      <div class="pad" id="rfPad"></div>
      <div class="field-row">
        <label class="field">
          <span class="field-label">Your character</span>
          <select id="rfCharacter" class="select" data-action="rfSaveCharacter" title="Who you are at this table">
            <option value="">— pick your character —</option>
            {% for ch in roster %}
            <option value="{{ ch.id }}">{{ ch.name }}</option>
            {% endfor %}
          </select>
        </label>
        <label class="field field-narrow">
          <span class="field-label">Modifier</span>
          <input type="number" id="rfMod" class="input" value="0" step="1" min="-20" max="20">
        </label>
        <label class="field field-narrow">
          <span class="field-label">Roll mode</span>
          <select id="rfAdv" class="select">
            <option value="0">normal</option>
            <option value="1">advantage</option>
            <option value="-1">disadvantage</option>
          </select>
        </label>
      </div>
      <div class="field-row">
        <label class="field">
          <span class="field-label">What is it?</span>
          <input type="text" id="rfLabel" class="input" placeholder="attack, save, check…">
        </label>
      </div>
      <p class="hint" id="rfHint">Pick your character, then tap a die.</p>
    </div>
  </section>

  <section class="card card-flush">
    <div class="card-head">
      <h2>The feed</h2>
      <span class="meta">newest first</span>
    </div>
    <div class="feed-list" id="rollFeedList"><div class="rf-empty">loading…</div></div>
  </section>
  </div>
</div>

<script>
  (function () {
    try {
      var saved = localStorage.getItem('dnd_theme');
      if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
    } catch (e) { /* storage blocked — the page stays dark */ }
    window.TABLE_CFG = {
      key: {{ key|tojson }},
      campaign: {{ campaign.name|tojson }},
      character: null,
      streamUrl: "/api/table/{{ key }}/stream",
      rollUrl: "/api/table/{{ key }}/roll"
    };
  })();
</script>
<script src="/static/dice.js?v={{ static_asset_version('dice.js') }}"></script>
<script src="/static/rollfeed.js?v={{ static_asset_version('rollfeed.js') }}"></script>
<script>
(function () {
  'use strict';
  var DICE = [4, 6, 8, 10, 12, 20, 100];

  var pad = document.getElementById('rfPad');
  DICE.forEach(function (sides) {
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'd' + sides;
    if (sides === 20) b.className = 'primary';
    b.onclick = function () { rfRoll(sides); };
    pad.appendChild(b);
  });

  window.rfCharacter = function () {
    var sel = document.getElementById('rfCharacter');
    return sel.value ? parseInt(sel.value, 10) : null;
  };

  /** The three read-outs mirror the controls under them, so what you see is what will roll. */
  function syncStats() {
    var mod = parseInt(document.getElementById('rfMod').value || '0', 10) || 0;
    document.getElementById('statMod').textContent = (mod >= 0 ? '+' : '') + mod;
    var sel = document.getElementById('rfCharacter');
    var who = sel.value ? sel.selectedOptions[0].textContent : 'nobody yet';
    var node = document.getElementById('statWho');
    node.textContent = who;
    node.title = who;
  }

  window.rfSaveCharacter = function () {
    var id = window.rfCharacter();
    try { localStorage.setItem('tableCharacter_' + window.TABLE_CFG.key, id || ''); } catch (e) {}
    document.getElementById('rfHint').textContent = id
      ? 'Rolling as ' + document.getElementById('rfCharacter').selectedOptions[0].textContent + '.'
      : 'Pick your character, then tap a die.';
    syncStats();
  };

  // The pad rolls REAL dice here and posts the faces: the server recomputes the total and
  // rejects anything that does not add up, so the feed can never show a number the dice
  // did not produce.
  window.rfRoll = function (sides) {
    var characterId = window.rfCharacter();
    if (!characterId) {
      document.getElementById('rfHint').textContent = 'Pick your character first.';
      return;
    }
    var mod = parseInt(document.getElementById('rfMod').value || '0', 10) || 0;
    var adv = parseInt(document.getElementById('rfAdv').value || '0', 10);
    var label = (document.getElementById('rfLabel').value || '').trim() || ('d' + sides);

    var expr = '1d' + sides + (mod ? (mod > 0 ? '+' + mod : mod) : '');
    var kept, note = '';

    if (adv !== 0 && sides === 20) {
      // Advantage/disadvantage is two rolls kept as one. The log stores the die that
      // counted and the label carries both, so the table sees the discard without the
      // grammar having to learn a keep-highest operator.
      var a = window.DiceRoller.roll('1d20');
      var b = window.DiceRoller.roll('1d20');
      var best = adv > 0 ? Math.max(a.rolls[0], b.rolls[0]) : Math.min(a.rolls[0], b.rolls[0]);
      kept = { expr: expr, rolls: [best], mod: mod, total: best + mod, text: '' };
      note = (adv > 0 ? 'adv' : 'dis') + ' (' + a.rolls[0] + ', ' + b.rolls[0] + ')';
    } else {
      kept = window.DiceRoller.roll(expr);
    }
    if (!kept) return;
    window.RollFeed.setOptions({ characterId: characterId });

    var shown = (mod ? kept.total : kept.rolls[0]);
    document.getElementById('rfHint').textContent =
      'You rolled ' + shown + (note ? ' · ' + note : '') + ' — sending…';

    window.RollFeed.post(kept, {
      label: label + (note ? ' · ' + note : ''),
      hidden: false
    }).then(function (res) {
      document.getElementById('rfHint').textContent = res
        ? 'Sent: ' + label + ' = ' + shown
        : 'Could not send that roll — the table did not get it.';
    });
  };

  // Restore who this device is (the same tablet is usually the same player).
  var saved = null;
  try { saved = localStorage.getItem('tableCharacter_' + window.TABLE_CFG.key); } catch (e) {}
  if (saved) {
    var sel = document.getElementById('rfCharacter');
    sel.value = saved;
    if (!sel.value) sel.selectedIndex = 0;
  }

  window.RollFeed.init({
    listEl: document.getElementById('rollFeedList'),
    statusEl: document.getElementById('rfStatus'),
    streamUrl: window.TABLE_CFG.streamUrl,
    rollUrl: window.TABLE_CFG.rollUrl,
    characterId: window.rfCharacter(),
    source: 'player-view',
    publish: false            // the pad publishes; clicks on rules text on this page must not
  });

  document.getElementById('rfCharacter').addEventListener('change', function () {
    window.RollFeed.setOptions({ characterId: window.rfCharacter() });
    syncStats();
  });
  document.getElementById('rfMod').addEventListener('input', syncStats);

  // Keep the roll count honest as the feed streams in (and when it is reset).
  var listEl = document.getElementById('rollFeedList');
  function countRolls() {
    document.getElementById('statRolls').textContent = listEl.querySelectorAll('.rf-row').length;
  }
  if (window.MutationObserver) new MutationObserver(countRolls).observe(listEl, { childList: true });
  countRolls();

  window.rfSaveCharacter();
})();
</script>
</body>
</html>
