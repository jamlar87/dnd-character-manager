{% extends "layout.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="card" style="max-width:400px;margin:3rem auto">
  <h2 style="margin-bottom:1rem">Create Account</h2>
  {% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
  <form method="post">
    <div class="form-group"><label>Email</label><input type="email" name="email" required></div>
    <div class="form-group"><label>Password (min 6 chars)</label><input type="password" name="password" required minlength="6"></div>
    <button type="submit" class="btn btn-primary" style="width:100%">Register</button>
  </form>
  <p style="margin-top:1rem;text-align:center;color:var(--text-muted)">Already have an account? <a href="/login">Login</a></p>
</div>
{% endblock %}
