{% extends "layout.html" %}
{% block title %}Character Manager{% endblock %}
{% block content %}
<div style="text-align:center;margin-top:3rem">
  <h1 style="font-size:2.5rem;margin-bottom:0.5rem">⚔️ D&D Character Manager</h1>
  <p style="color:var(--text-muted);max-width:500px;margin:0 auto 2rem">Create and manage D&D 5e characters. Track HP, spell slots, inventory, and more during live sessions. Multi-user — bring your whole party.</p>
  <a href="/register" class="btn btn-primary" style="font-size:1.1rem;padding:0.75rem 2rem">Get Started</a>
  <a href="/login" class="btn btn-outline" style="font-size:1.1rem;padding:0.75rem 2rem;margin-left:0.5rem">Login</a>
</div>
{% endblock %}
