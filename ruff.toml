# Lint policy for the dnd-character-manager codebase.
#
# The project grew without a formatter, so line length is not enforced. These
# are the checks the code is expected to keep green:
#   F  - pyflakes: undefined names, unused imports/vars, f-string bugs
#   E9 - real syntax/runtime errors (not style)
#   B  - bugbear: mutable defaults, silent exception swallowing, etc.
#   I  - import ordering, so module headers stay readable
target-version = "py312"
line-length = 100
# Historical archive of removed scripts - not maintained, not linted.
exclude = [".hermes"]

[lint]
select = ["F", "E9", "B", "I"]

[lint.per-file-ignores]
# Test modules import after setting env vars / sys.path by design.
"tests/*.py" = ["E402"]
# Package facades: __init__.py re-exports its sub-modules' names on purpose
# (``from routes.dm import ...`` is a documented public entry point).
"**/__init__.py" = ["F401"]
# Facade modules: they re-export names that the rest of the app imports from
# here (core.data especially - it is the single "get me the rules data" door).
# Every one of these names is used elsewhere, just not inside the file itself.
"core/data.py" = ["F401"]
"core/constants.py" = ["F401"]
"core/features.py" = ["F401"]
"pdf_generator.py" = ["F401"]
"routes/characters/all.py" = ["F401"]
"services/leveling.py" = ["F401"]
# main.py is the application facade and the test suite reaches a lot of the app
# through ``main.<NAME>`` (often via getattr, so lint cannot see the use).
"main.py" = ["F401"]
